# kubeadm join は JoinConfiguration 以外の文書を読まずに警告を出して捨て、kubelet の設定は
# kube-system/kubelet-config ConfigMap から取得する (正はそちら)。ここは init 時の
# KubeletConfiguration (scripts/nodes/k8s-node-setup.sh) と揃えておくための写し。
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: "systemd"
protectKernelDefaults: true
# kubelet と、kubelet から traceparent を受け取る containerd の span を各ノードの Alloy に送る
# refs: docs/runbooks/k8s-system-component-tracing.md
tracing:
  endpoint: 127.0.0.1:4317
  samplingRatePerMillion: 10000
---
apiVersion: kubeadm.k8s.io/v1beta3
kind: JoinConfiguration
nodeRegistration:
  criSocket: "unix:///var/run/containerd/containerd.sock"
  kubeletExtraArgs:
    node-ip: "{{ host_addr_cls }}"
discovery:
  bootstrapToken:
    apiServerEndpoint: "{{ kube_api_server_vip }}:8443"
    token: "{{ kubeadm_bootstrap_token }}"
    unsafeSkipCAVerification: true
controlPlane:
  certificateKey: "{{ kubeadm_uploaded_certs }}"
  localAPIEndpoint:
    advertiseAddress: "{{ host_addr_cls }}"
    bindPort: 6443
