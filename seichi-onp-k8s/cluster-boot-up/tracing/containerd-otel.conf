# containerd のトレース設定 (systemd drop-in)。
# 配置先: /etc/systemd/system/containerd.service.d/10-otel.conf
# containerd 2.x のトレースは config.toml ではなく OTEL_* 環境変数だけで有効になる。
# OTEL_EXPORTER_OTLP_ENDPOINT が空だと otlp / tracing プラグインは
# "skip plugin: tracing endpoint not configured" で読み込まれない。
#
# - 送信先は各ノードの hostNetwork の Alloy (OTLP HTTP, 127.0.0.1:4318)。
#   汎用の OTEL_EXPORTER_OTLP_ENDPOINT には SDK が /v1/traces を付け足すのでパスは書かない
#   (OTEL_EXPORTER_OTLP_TRACES_ENDPOINT を使う場合はパスまで書く必要がある)。
#   http:// のスキームなので TLS は使われない。
# - parentbased_traceidratio: kubelet から traceparent 付きで来た CRI 呼び出しは kubelet の
#   判定 (samplingRatePerMillion: 10000 = 1%) に従い、親のない呼び出し (crictl など) は 1% だけ記録する。
# 反映には systemctl daemon-reload && systemctl restart containerd が必要。
# KillMode=process なので、containerd を再起動しても shim と稼働中のコンテナは止まらない。
# 手順: docs/runbooks/k8s-system-component-tracing.md
[Service]
Environment="OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318"
Environment="OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
Environment="OTEL_SERVICE_NAME=containerd"
Environment="OTEL_TRACES_SAMPLER=parentbased_traceidratio"
Environment="OTEL_TRACES_SAMPLER_ARG=0.01"
