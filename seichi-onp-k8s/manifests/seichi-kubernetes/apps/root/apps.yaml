apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: seichi-minecraft-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/GiganticMinecraft/seichi_infra
        revision: main
        directories:
          - path: seichi-onp-k8s/manifests/seichi-kubernetes/apps/seichi-minecraft/*
  template:
    metadata:
      # 各Application が argocd namespace に配置されるため prefix した方が安全
      name: "seichi-minecraft-{{path.basenameNormalized}}"
      namespace: argocd
    spec:
      project: seichi-minecraft
      source:
        repoURL: https://github.com/GiganticMinecraft/seichi_infra
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "seichi-minecraft"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 2m
      # backup/start-stop Workflow と KEDA が replicas を制御する StatefulSet に限定する。
      # Argo CD はその他の StatefulSet の replicas drift を引き続き検知する。
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          name: mcserver--s1
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--s2
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--s3
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--s5
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--s7
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--lobby
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--votelistener
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--kagawa
          jsonPointers: [/spec/replicas]
        - group: apps
          kind: StatefulSet
          name: mcserver--one-day-to-reset
          jsonPointers: [/spec/replicas]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubechecks
  namespace: argocd
spec:
  project: kubechecks
  source:
    repoURL: https://zapier.github.io/kubechecks/
    chart: kubechecks
    targetRevision: 3.0.0
    helm:
      releaseName: kubechecks
      values: |
        configMap:
          create: true
          env:
            KUBECHECKS_VCS_TYPE: "github"
            KUBECHECKS_ARGOCD_API_SERVER_ADDR: "argocd-server.argocd:443"
            KUBECHECKS_ARGOCD_API_INSECURE: "true"
            KUBECHECKS_WEBHOOK_URL_BASE: "https://kubechecks.onp-k8s.admin.seichi.click"
            KUBECHECKS_FALLBACK_K8S_VERSION: "1.36.2"
            # kubeconform の標準 registry に含まれない CRD
            # (PrometheusRule / CiliumNetworkPolicy など)を検証する。
            # CI の結果が外部 repository の更新だけで変わらないよう commit を固定する。
            KUBECHECKS_SCHEMAS_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/52b0261318acc7dd0b66e032759b1f218216b980/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
            KUBECHECKS_TIDY_OUTDATED_COMMENTS_MODE: "delete"
            KUBECHECKS_LOG_LEVEL: "info"
            KUBECHECKS_MONITOR_ALL_APPLICATIONS: "true"

        secrets:
          create: false

        deployment:
          image:
            pullPolicy: IfNotPresent
            name: ghcr.io/zapier/kubechecks
            # renovate: datasource=docker depName=ghcr.io/zapier/kubechecks
            # kubechecks chart 3.0.0 は tag を app.kubernetes.io/version にも使うため、
            # digest を連結すると Kubernetes の label 制約を満たさない。
            tag: "v3.4.0"
          envFrom:
            - secretRef:
                name: kubechecks-github-app-secret

        ingress:
          create: false

        service:
          create: true
          type: ClusterIP
          port: 8080

        serviceAccount:
          create: true
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kubechecks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
---
