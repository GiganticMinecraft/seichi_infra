apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seichi-portal-rabbitmq
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-rabbitmq
    release: prometheus
spec:
  selector:
    matchLabels:
      app: seichi-portal-rabbitmq
  endpoints:
    # ノード全体の集計値 (rabbitmq_*)。公式 Grafana ダッシュボードはこちらを前提にしている
    - port: prometheus
      path: /metrics
      interval: 30s
    # キュー / exchange 単位の値 (rabbitmq_detailed_*)。CDC キューの滞留や
    # ack 待ちをキュー名つきで見るために取る。/metrics/per-object は /metrics と
    # メトリクス名が衝突して sum() が二重計上になるため detailed を使う
    - port: prometheus
      path: /metrics/detailed
      interval: 30s
      params:
        family:
          - queue_coarse_metrics
          - queue_consumer_count
          - queue_delivery_metrics
          - exchange_metrics
      metricRelabelings:
        # /metrics 側と重複する info 系は落とす
        - sourceLabels: [__name__]
          regex: rabbitmq_(build|identity)_info
          action: drop
