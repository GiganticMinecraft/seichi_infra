apiVersion: v1
kind: ConfigMap
metadata:
  name: seichi-portal-rabbitmq-definitions
  namespace: seichi-minecraft
data:
  # 起動時に load_definitions で取り込まれるが、既に存在する exchange / queue は
  # 引数が違っても更新されない (declare が既存を返すだけ)。StatefulSet でデータを
  # 引き継ぐようになったため、type や arguments を変えるときは対象を手で削除するか
  # 新しい名前で作り直すこと
  definitions.json: |
    {
      "vhosts": [
        {
          "name": "/"
        }
      ],
      "exchanges": [
        {
          "name": "seichi_portal",
          "vhost": "/",
          "type": "direct",
          "durable": true
        }
      ],
      "queues": [
        {
          "name": "seichi_portal",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "bindings": [
        {
          "source": "seichi_portal",
          "vhost": "/",
          "destination": "seichi_portal",
          "destination_type": "queue",
          "routing_key": "seichi_portal",
          "arguments": {}
        }
      ]
    }
