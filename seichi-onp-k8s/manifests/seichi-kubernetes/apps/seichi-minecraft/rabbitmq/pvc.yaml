# Deployment 時代の PVC。StatefulSet 移行後は volumeClaimTemplates の
# data-seichi-portal-rabbitmq-0 を使うので未使用になる。中身は Pod 名ごとの
# データディレクトリ (切替時点で動いていた node の分を含む) で、新 node の稼働と
# 切替前のキューが空だったことを確認したら削除する
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seichi-portal-rabbitmq-data
  namespace: seichi-minecraft
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
