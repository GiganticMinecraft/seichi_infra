apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-rabbitmq
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seichi-portal-rabbitmq
  template:
    metadata:
      labels:
        app: seichi-portal-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          env:
            - name: SEICHI_PORTAL_RABBITMQ_USER
              value: seichi-portal
            - name: SEICHI_PORTAL_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-rabbitmq-credentials
                  key: password
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: '-rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"'
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until rabbitmqctl await_startup --timeout 5 >/dev/null 2>&1; do
                      sleep 1
                    done
                    if rabbitmqctl list_users --silent | awk -v user="$SEICHI_PORTAL_RABBITMQ_USER" '$1 == user { found=1 } END { exit(found ? 0 : 1) }'; then
                      rabbitmqctl change_password "$SEICHI_PORTAL_RABBITMQ_USER" "$SEICHI_PORTAL_RABBITMQ_PASSWORD"
                    else
                      rabbitmqctl add_user "$SEICHI_PORTAL_RABBITMQ_USER" "$SEICHI_PORTAL_RABBITMQ_PASSWORD"
                    fi
                    rabbitmqctl set_permissions -p / "$SEICHI_PORTAL_RABBITMQ_USER" '.*' '.*' '.*'
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          volumeMounts:
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: definitions
          configMap:
            name: seichi-portal-rabbitmq-definitions
        - name: data
          persistentVolumeClaim:
            claimName: seichi-portal-rabbitmq-data
