apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-rabbitmq
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seichi-portal-rabbitmq
  template:
    metadata:
      labels:
        app: seichi-portal-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          env:
            - name: SEICHI_PORTAL_RABBITMQ_USER
              value: seichi-portal
            - name: SEICHI_PORTAL_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-rabbitmq-credentials
                  key: password
            # Erlang VM はノードの全コア数 (24) 分スケジューラを立てるため、
            # CPU limit 1 に合わせてスケジューラを 1 本にし busy-wait も無効化する
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: '+S 1:1 +sbwt none +sbwtdcpu none +sbwtdio none -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"'
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    until rabbitmqctl await_startup --timeout 5 >/dev/null 2>&1; do
                      sleep 1
                    done
                    if rabbitmqctl list_users --silent | awk -v user="$SEICHI_PORTAL_RABBITMQ_USER" '$1 == user { found=1 } END { exit(found ? 0 : 1) }'; then
                      rabbitmqctl change_password "$SEICHI_PORTAL_RABBITMQ_USER" "$SEICHI_PORTAL_RABBITMQ_PASSWORD"
                    else
                      rabbitmqctl add_user "$SEICHI_PORTAL_RABBITMQ_USER" "$SEICHI_PORTAL_RABBITMQ_PASSWORD"
                    fi
                    rabbitmqctl set_permissions -p / "$SEICHI_PORTAL_RABBITMQ_USER" '.*' '.*' '.*'
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          volumeMounts:
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              # 以前の 500m は probe の rabbitmq-diagnostics が食っていた分(約 0.3 core)を
              # 実測として取り込んだ値。probe を TCP に替えた後の broker 本体は数十 m で済む
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          # 旧 probe の rabbitmq-diagnostics ping は実行ごとに Erlang VM を起動して
          # distribution に join するため 1 回あたり約 1 CPU 秒かかり、5 秒 + 10 秒間隔の
          # 実行だけで常時 0.3 core を消費して CFS throttling が 50% に達していた。
          # 公式ドキュメント (monitoring#health-checks-as-readiness-probes) と RabbitMQ
          # Cluster Operator に合わせ、readiness は AMQP ポートの TCP チェックのみにし
          # liveness は置かない。AMQP リスナーは起動手順の最後に開くので起動完了の判定にもなる
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: definitions
          configMap:
            name: seichi-portal-rabbitmq-definitions
        - name: data
          persistentVolumeClaim:
            claimName: seichi-portal-rabbitmq-data
