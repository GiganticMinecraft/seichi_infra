# seichi-portal のアプリケーションアラート (#5611, #5618)。
# kube-prometheus-stack の ruleSelector (release: prometheus) が namespace 横断で
# PrometheusRule を発見する (seichi-portal-valkey チャートの prometheusRule と同じ仕組み)。
# kured の alertFilterRegexp は許可リスト (再起動を止めるアラートだけを列挙) なので、
# アプリのエラーでノード再起動を止めないよう、ここのアラート名は登録しない。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seichi-portal-alerts
  namespace: seichi-minecraft
  labels:
    release: prometheus
spec:
  groups:
    - name: seichi-portal-alerts
      rules:
        # Tempo metrics-generator (span-metrics processor) が remote_write する
        # traces_spanmetrics_calls_total を使う。RED metrics の正は Tempo spanmetrics
        # (#5604 で一本化)。低トラフィック時の単発失敗で発火しないよう、SERVER スパン
        # 限定 + 直近 10 分で 20 リクエスト以上のトラフィック下限を付ける。
        # 5% / 20 リクエストは初期値で、本番ベースライン観測後に見直す (#5611)
        - alert: SeichiPortalHighErrorRate
          expr: |
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"seichi-portal-(frontend|backend)",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m]))
              /
              sum by (service) (rate(traces_spanmetrics_calls_total{service=~"seichi-portal-(frontend|backend)",span_kind="SPAN_KIND_SERVER"}[5m]))
            ) > 0.05
            and on (service)
            sum by (service) (increase(traces_spanmetrics_calls_total{service=~"seichi-portal-(frontend|backend)",span_kind="SPAN_KIND_SERVER"}[10m])) >= 20
          for: 10m
          labels:
            severity: warning
            notify: discord
            team: portal
          annotations:
            summary: "{{ $labels.service }} のエラーレートが 5% を超えています"
            description: "{{ $labels.service }} のサーバーサイドスパンのエラーレートが 10 分間 5% を超えています (現在値: {{ $value | humanizePercentage }})。"
        # 起動不能 (CrashLoopBackOff) の通知。2026-10-21 (#6468/#6472) までは起動直後の
        # panic ログが Loki に届かず Loki ruler の panic ルール (#5618) で検知できなかった
        # ため、Sentry が担っていた「起動不能の即時通知」をこのアラートで代替している。
        # 今は panic ログも Loki に届くが、panic 以外の起動失敗も拾えるので残す。
        # rollout 中に旧 Pod がサービスを継続できている場合は通知せず、Service の
        # ready endpoint が 0 の場合だけ通知する。
        # Deployment の initContainer (wait-for-dependencies) で依存先待ちをしているため、
        # 依存先が落ちている間は CrashLoopBackOff にならず Init で止まる。その状態は
        # 下の SeichiPortalBackendUnavailable が拾う。
        - alert: SeichiPortalBackendCrashLoop
          expr: |
            (
              max by (namespace, pod, container) (
                max_over_time(kube_pod_container_status_waiting_reason{namespace="seichi-minecraft", container="seichi-portal-backend", reason="CrashLoopBackOff", job="kube-state-metrics"}[5m])
              ) >= 1
            )
            and on (namespace)
            (
              kube_service_info{namespace="seichi-minecraft", service="seichi-portal-backend", job="kube-state-metrics"}
              unless on (namespace)
              kube_endpointslice_endpoints{namespace="seichi-minecraft", endpointslice=~"seichi-portal-backend-.*", ready="true", job="kube-state-metrics"}
            )
          for: 5m
          labels:
            severity: critical
            notify: discord
            team: portal
          annotations:
            summary: "seichi-portal-backend が CrashLoopBackOff です"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} が繰り返しクラッシュしており、Service seichi-portal-backend に ready endpoint がありません。原因は Loki で {job=\"seichi-minecraft/seichi-portal-backend\"} | json | panic=\"true\" か kubectl logs --previous で確認する。"

        # 理由を問わず Service に ready endpoint が無い状態の通知。initContainer で依存先を
        # 待っている (Init:0/1)、イメージが pull できない、Pending のまま載らない、など
        # CrashLoopBackOff にならない起動不能をすべて拾う。kured 窓の依存先復帰では
        # backend の ready endpoint が 6 分無かった (2026-10-28、mariadb-0 の停止 5 分半 +
        # 起動) ので、窓の副作用で鳴らないよう for は 15m にする。
        # rollout は maxUnavailable: 0 なので旧 Pod が ready のままで鳴らない。
        # crash loop が続く本物の障害では CrashLoop (5m) とこれ (15m) が両方鳴る。
        - alert: SeichiPortalBackendUnavailable
          expr: |
            kube_service_info{namespace="seichi-minecraft", service="seichi-portal-backend", job="kube-state-metrics"}
            unless on (namespace)
            kube_endpointslice_endpoints{namespace="seichi-minecraft", endpointslice=~"seichi-portal-backend-.*", ready="true", job="kube-state-metrics"}
          for: 15m
          labels:
            severity: critical
            notify: discord
            team: portal
          annotations:
            summary: "seichi-portal-backend に ready endpoint がありません"
            description: "Service seichi-portal-backend に 15 分間 ready endpoint がありません。kubectl get pods -n seichi-minecraft -l app=seichi-portal-backend で Init (依存先待ち) / ImagePullBackOff / Pending のどれかを確認する。Init のままなら mariadb と seichi-portal-valkey の状態を見る。"

        # CDC キューを誰も消費していない状態。backend は broker が再起動すると接続は
        # 張り直すが consumer (basic_consume) を再登録しないため、RabbitMQ の OOMKilled や
        # 更新のたびに黙って消費が止まる (2026-10-30)。検索インデックスへの反映が止まり、
        # Debezium のスナップショットが来るとキューが溜まる一方になる。
        # 復旧は backend の rollout restart。
        - alert: SeichiPortalCdcQueueNoConsumer
          expr: |
            rabbitmq_detailed_queue_consumers{namespace="seichi-minecraft", queue="seichi_portal"} == 0
          for: 5m
          labels:
            severity: warning
            notify: discord
            team: portal
          annotations:
            summary: "seichi_portal キューに consumer がいません"
            description: "RabbitMQ の seichi_portal キューを 5 分間誰も消費していません。backend が broker 再起動後に consumer を再登録できていない可能性が高い。kubectl -n seichi-minecraft rollout restart deploy/seichi-portal-backend で復旧する。"

        # RabbitMQ が memory watermark に達して publisher をブロックしている状態。
        # Debezium のスナップショットが消費を大きく上回ると起きる。ブロックが続くと
        # Debezium 側が confirm 待ちで失敗してスナップショットをやり直すので、
        # consumer が生きているか (上のアラート) とキューの減り方を確認する。
        - alert: SeichiPortalRabbitMqMemoryAlarm
          expr: |
            rabbitmq_alarms_memory_used_watermark{namespace="seichi-minecraft"} == 1
          for: 2m
          labels:
            severity: warning
            notify: discord
            team: portal
          annotations:
            summary: "seichi-portal の RabbitMQ がメモリ上限で publisher をブロックしています"
            description: "RabbitMQ の memory alarm が 2 分間続いています。seichi_portal キューの滞留と consumer の有無を確認する。"

        # Debezium が MariaDB の binlog を読めていない状態。止まっている間は検索インデックスに
        # 変更が反映されない。2026-10-24 は破損した binlog (mariadb-bin.000405) を読もうとして
        # 再起動とリトライを数時間繰り返していたが、KubePodCrashLooping に埋もれて気付けなかった。
        # リトライの合間に一瞬 connected になるので、30 分の平均で見る。Pod ごとに instance
        # ラベルが変わるため sum してから平均する。Pod が無いときは vector(0) で 0 扱いにする。
        # 実測: 2026-10-21〜10-24 の平常時は常に 1、障害中は 0〜0.5。
        - alert: SeichiPortalDebeziumDisconnected
          expr: |
            avg_over_time(
              (
                sum(debezium_connection_status{debezium_logical_name="seichi_portal", debezium_context="streaming", debezium_connection_state="connected"})
                or vector(0)
              )[30m:1m]
            ) < 0.8
          for: 15m
          labels:
            severity: warning
            notify: discord
            team: portal
          annotations:
            summary: "seichi-portal の Debezium が MariaDB の binlog に接続できていません"
            description: "直近 30 分の大半で Debezium の binlog 接続が切れています。kubectl -n seichi-minecraft logs deploy/seichi-portal-debezium で Caused by を確認してください。binlog の読み取りエラー (Error reading file) が続く場合は、PVC 内の offsets.dat / dbhistory.dat を退避して Pod を作り直すと、全件スナップショットしてから現在の位置で再開します。"
