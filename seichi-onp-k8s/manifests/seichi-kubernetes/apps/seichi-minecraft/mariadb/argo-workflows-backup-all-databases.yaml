apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: backup--mariadb-all-databases
  namespace: seichi-minecraft
spec:
  schedules:
    - "0 4 * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  workflowSpec:
    workflowTemplateRef:
      name: backup--mariadb-all-databases
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: backup--mariadb-all-databases
  namespace: seichi-minecraft
  annotations:
    workflows.argoproj.io/description: "Namespace内の全Database CRDを対象に、各.spec.databaseを指定してBackup CRを作成する"
spec:
  podResources:
    requests:
      cpu: 50m
      memory: 64Mi
  serviceAccountName: mariadb-workflow-sa
  activeDeadlineSeconds: 7200 # 2時間でタイムアウト（image pullの失敗等での長時間ハングを防ぐ）
  onExit: notify-on-failure
  entrypoint: default
  templates:
    - name: default
      steps:
        - - name: check-maintenance-mode
            template: check-maintenance-mode
        - - name: generate-timestamp
            template: get-timestamp
        - - name: list-databases
            template: list-databases
        - - name: backup-each-database
            template: backup-single
            arguments:
              parameters:
                - name: name
                  value: "{{item}}"
                - name: timestamp
                  value: "{{steps.generate-timestamp.outputs.result}}"
            withParam: "{{steps.list-databases.outputs.result}}"
        - - name: cleanup-old-backups
            template: cleanup-old-backups
          - name: cleanup-old-s3-objects
            template: cleanup-old-s3-objects

    - name: check-maintenance-mode
      script:
        image: alpine/kubectl:1.37.1
        command: [sh]
        source: |
          set -e
          ALL_SERVERS_MAINTENANCE_ENABLED=$(kubectl get configmap maintenance-mode -n seichi-minecraft -o jsonpath='{.data.enabled}' 2>/dev/null || echo "false")
          if [ "$ALL_SERVERS_MAINTENANCE_ENABLED" = "true" ]; then
            echo "メンテナンスモードが有効です。バックアップワークフローをスキップします。"
            exit 1
          fi
          echo "メンテナンスモードは無効です。バックアップを続行します。"

    - name: get-timestamp
      script:
        image: alpine/kubectl:1.37.1
        command: [sh]
        source: |
          date +%Y%m%d-%H%M%S

    - name: list-databases
      script:
        image: alpine/kubectl:1.37.1
        command: [sh]
        source: |
          kubectl get databases.k8s.mariadb.com -n "$TARGET_NAMESPACE" -o jsonpath='{.items[*].metadata.name}' \
            | tr ' ' '\n' \
            | awk 'NF {printf "%s\"%s\"", (NR>1 ? "," : ""), $0} END {print ""}' \
            | awk '{print "[" $0 "]"}'
        env:
          - name: TARGET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

    - name: backup-single
      inputs:
        parameters:
          - name: name
          - name: timestamp
      script:
        image: alpine/kubectl:1.37.1
        command: [sh]
        source: |
          set -e
          NAME="{{inputs.parameters.name}}"
          TIMESTAMP="{{inputs.parameters.timestamp}}"
          NAMESPACE="$TARGET_NAMESPACE"

          MARIA_DB_REF=$(kubectl get databases.k8s.mariadb.com "$NAME" -n "$NAMESPACE" -o jsonpath='{.spec.mariaDbRef.name}')
          DB_NAME=$(kubectl get databases.k8s.mariadb.com "$NAME" -n "$NAMESPACE" -o jsonpath='{.spec.name}')

          if [ -z "$MARIA_DB_REF" ] || [ -z "$DB_NAME" ]; then
            echo "spec.mariaDbRef.name or spec.name が定義されていません！"
            exit 1
          fi

          BACKUP_NAME="${NAME}-backup--${TIMESTAMP}"
          echo "Backup作成中: ${BACKUP_NAME} for MariaDB instance '${MARIA_DB_REF}', DB '${DB_NAME}'"

          cat <<MANIFEST | kubectl apply -f -
          apiVersion: k8s.mariadb.com/v1alpha1
          kind: Backup
          metadata:
            name: ${BACKUP_NAME}
            namespace: ${NAMESPACE}
          spec:
            mariaDbRef:
              name: ${MARIA_DB_REF}
            databases:
              - ${DB_NAME}
            storage:
              s3:
                bucket: mariadb-backups
                prefix: "database--${NAME}"
                endpoint: garage.garage.svc.cluster.local:3900
                region: seichi-cloud
                accessKeyIdSecretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
                secretAccessKeySecretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          MANIFEST

          # Backup CR を作っただけで成功扱いにすると、Job が失敗してもワークフローは Succeeded になり
          # 失敗に気づけない (2026-09-30〜10-02 に Garage の 503 で全 DB の Job が失敗していたが通知されなかった)。
          # 成功・失敗ともに type=Complete,status=True になり reason で区別されるので、それを待って判定する。
          # 全体のタイムアウトはワークフローの activeDeadlineSeconds に任せる
          while :; do
            STATUS=$(kubectl get backups.k8s.mariadb.com "$BACKUP_NAME" -n "$NAMESPACE" \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
            if [ "$STATUS" = "True" ]; then
              break
            fi
            sleep 10
          done

          REASON=$(kubectl get backups.k8s.mariadb.com "$BACKUP_NAME" -n "$NAMESPACE" \
            -o jsonpath='{.status.conditions[?(@.type=="Complete")].reason}')
          if [ "$REASON" != "JobComplete" ]; then
            echo "失敗: ${BACKUP_NAME} (reason: ${REASON})"
            exit 1
          fi

          echo "成功: ${BACKUP_NAME}"
        env:
          - name: TARGET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

    - name: cleanup-old-backups
      script:
        image: alpine/kubectl:1.37.1
        command: [sh]
        source: |
          set -e
          NAMESPACE="$TARGET_NAMESPACE"
          RETENTION_DAYS=3
          CUTOFF=$(date -u -d "@$(($(date +%s) - RETENTION_DAYS * 86400))" +%Y-%m-%dT%H:%M:%SZ)

          echo "=== ${RETENTION_DAYS}日より古いBackup CRを削除します (cutoff: ${CUTOFF}) ==="

          kubectl get backups.k8s.mariadb.com -n "$NAMESPACE" \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\n"}{end}' \
          | while IFS="$(printf '\t')" read -r NAME CREATED; do
            if [ -z "$NAME" ] || [ -z "$CREATED" ]; then
              continue
            fi
            if [ "$CREATED" \< "$CUTOFF" ]; then
              kubectl delete backups.k8s.mariadb.com "$NAME" -n "$NAMESPACE" && {
                DELETED=$((DELETED + 1))
                echo "削除: ${NAME} (created: ${CREATED})"
              } || {
                echo "削除失敗: ${NAME}"
              }
            fi
          done

          echo "=== クリーンアップ完了 ==="
        env:
          - name: TARGET_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

    - name: cleanup-old-s3-objects
      script:
        image: amazon/aws-cli:2.37.12
        command: [sh]
        source: |
          set -e
          # 日数で消すと、バックアップの失敗が続いた時に最後の成功分まで消えてしまう
          # (2026-10-03 に flyway 等のバックアップが S3 から全て消えていた)。
          # prefix (= DB) ごとに新しい順で KEEP 件を残し、それより古いものだけを消す
          KEEP=3

          echo "=== DB ごとに最新${KEEP}件を残して古いS3バックアップオブジェクトを削除します ==="

          S3_ENDPOINT="http://garage.garage.svc.cluster.local:3900"
          S3_REGION="seichi-cloud"
          BUCKET="mariadb-backups"

          ALL_OBJECTS=$(aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
            s3api list-objects-v2 --bucket "$BUCKET" --prefix "database--" \
            --query "Contents[].{Key: Key, LastModified: LastModified}" \
            --output json)

          if [ "$ALL_OBJECTS" = "null" ]; then
            ALL_OBJECTS="[]"
          fi

          OBJECTS_TO_DELETE=$(echo "$ALL_OBJECTS" | jq --argjson keep "$KEEP" '
            group_by(.Key | split("/")[0])
            | map(sort_by(.LastModified) | reverse | .[$keep:])
            | add // []
            | map({Key: .Key})')

          COUNT=$(echo "$OBJECTS_TO_DELETE" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "削除対象: ${COUNT}件"
            echo "$OBJECTS_TO_DELETE" | jq -r '.[].Key'

            echo "$OBJECTS_TO_DELETE" | jq -c '. as $in | range(0; length; 1000) | $in[.:. + 1000]' | while read -r BATCH; do
              DELETE_PAYLOAD="{\"Objects\": ${BATCH}, \"Quiet\": false}"
              aws --endpoint-url "$S3_ENDPOINT" --region "$S3_REGION" \
                s3api delete-objects --bucket "$BUCKET" --delete "$DELETE_PAYLOAD"
            done
            echo "${COUNT}件のオブジェクトを削除しました"
          else
            echo "削除対象のオブジェクトはありません"
          fi

          echo "=== S3クリーンアップ完了 ==="
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: garage-s3-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: garage-s3-credentials
                key: AWS_SECRET_ACCESS_KEY

    - name: notify-on-failure
      steps:
        - - name: send-failure-notification
            templateRef:
              name: backup-failure-notification
              template: send-discord-notification
              clusterScope: true
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: title
                  value: "mariadb バックアップ失敗"
