apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mcserver--s5
  namespace: seichi-minecraft
  labels:
    app: mcserver--s5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcserver--s5
  template:
    metadata:
      annotations:
        profiles.grafana.com/java.enabled: "true"
        resource.opentelemetry.io/service.name: "mcserver-s5"
      labels:
        app: mcserver--s5
        mcserver: s5
    spec:
      # liveness kill 時に SIGTERM からの正常終了 (JFR dumponexit が OldObjectSample を
      # 書き出す) が完走する確率を上げる。デフォルト 30 秒では 2026-08-09 の GC storm 時に
      # 足りず SIGKILL された。正常時の停止は数十秒で終わるため日次再起動には影響しない。
      terminationGracePeriodSeconds: 180
      initContainers:
        - name: mod-downloader
          image: ghcr.io/giganticminecraft/mod-downloader:1.0.0@sha256:a92e4b0501700279c9b8459f62d737802220928d43ab746027fb9eae5e9cda41
          env:
            - name: S3_ENDPOINT
              value: garage.garage.svc.cluster.local:3900
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: BUCKET_NAME
              value: seichi-plugins
            - name: BUCKET_PREFIX_NAME
              value: common-plugins
            - name: DOWNLOAD_TARGET_DIR_PATH
              value: /downloaded-plugins
          volumeMounts:
            - name: mod-downloader-volume
              mountPath: /downloaded-plugins
        - name: seichiassist-downloader
          image: ghcr.io/giganticminecraft/mod-downloader:1.0.0@sha256:a92e4b0501700279c9b8459f62d737802220928d43ab746027fb9eae5e9cda41
          env:
            - name: S3_ENDPOINT
              value: garage.garage.svc.cluster.local:3900
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: BUCKET_NAME
              value: seichiassist
            - name: BUCKET_PREFIX_NAME
              value: master
            - name: DOWNLOAD_TARGET_DIR_PATH
              value: /downloaded-plugins
          volumeMounts:
            - name: mod-downloader-volume
              mountPath: /downloaded-plugins

        # GC storm 調査用テレメトリの掃除 (canary)。
        # GC ログは %t 付き basename のため JVM の filecount rotation が起動を跨いで効かず、
        # JFR repository は SIGKILL で残った旧 subdirectory (最大 ~1GiB/回) を次の JVM が
        # 削除しないため、どちらも起動時にここで削除する。
        - name: gc-telemetry-cleanup
          image: busybox:1.38.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              find /data -maxdepth 1 -name 'gc-*.log*' -mtime +14 -exec rm -f {} + || true
              [ -d /data/jfr-repository ] && find /data/jfr-repository -mindepth 1 -maxdepth 1 -mtime +7 -exec rm -rf {} + || true
          volumeMounts:
            - name: mcserver--s5-data
              mountPath: /data

      containers:
        - resources:
            requests:
              cpu: 2
              memory: 16Gi
            limits:
              cpu: 4
              memory: 16Gi
          env:
            - name: MEMORY
              value: 8G
            - name: EULA
              value: "TRUE"

            # mc-server-runner は stop 送信から STOP_DURATION 秒後に Java プロセスを
            # 強制 kill する (デフォルト 60)。サーバー停止処理と JVM shutdown hook
            # (JFR dumponexit 含む) はこの 150 秒以内に完了する必要がある。
            # terminationGracePeriodSeconds (180) との差 30 秒は runner 自身と Pod 終了処理の
            # 余白であり、JVM shutdown hook 用の追加時間ではない。
            - name: STOP_DURATION
              value: "150"

            # glibc の malloc arena の数を制限する。
            # arena の上限はデフォルトで「CPU コア数 × 8」だが、glibc は cgroup を認識しないため
            # ここでの CPU コア数は limits.cpu ではなくノードの物理コア数になり、arena が大量に作られうる。
            # チャンク圧縮 (zlib) などの多スレッドからの細かい malloc/free で断片化した arena は
            # free 済みでも OS にメモリを返さないため、RSS が戻らずに増え続ける一因になる。
            # (2026-07-19 の計測: GC 側の対策後も賑わい時間帯に ~0.5GiB/h のラチェット式増加が残存)
            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: JVM_OPTS
              # base image 側で JVM_OPTS に対して jmx exporter の設定を追加しているが、上書きが必要なためここで設定する
              # SeichiAssistによるワールドマイグレーションをするとメモリリークが発生するため、Papermc公式が推奨しているJVM Optionを追加する
              # ref: https://docs.papermc.io/paper/aikars-flags
              #
              # ただし Aikar's flags のうち DisableExplicitGC は ExplicitGCInvokesConcurrent に置き換えている。
              # MaxDirectMemorySize の上限に達したとき、JVM は System.gc() を呼んで direct buffer の
              # 回収を試みるが、DisableExplicitGC だとこの経路が塞がれて OutOfMemoryError になりうる。
              # ExplicitGCInvokesConcurrent なら System.gc() が STW の Full GC ではなく concurrent cycle に
              # 変換されるため、プラグインの System.gc() 呼び出しでラグらせないという元の目的も保たれる。
              value: >-
                -javaagent:/jmx-exporter/jmx_prometheus_javaagent.jar=18321:/jmx-exporter/jmx-exporter-config.yaml
                -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
                -XX:+UnlockExperimentalVMOptions -XX:+ExplicitGCInvokesConcurrent -XX:+AlwaysPreTouch
                -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M
                -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
                -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem
                -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs
                -Daikars.new.flags=true

            - name: JVM_XX_OPTS
              # G1PeriodicGCInterval: 無人時間帯は Old 世代の回収 (concurrent cycle) が一度も走らず、
              # Cleaner 経由で解放されるネイティブメモリ (Deflater 等) が Old 世代へ昇格したまま蓄積し、
              # 約 1GiB/h のペースで増加して数時間で OOMKilled に至っていた (2026-07-18 の計測より)。
              # このフラグは「指定時間、どの GC も走らなかったとき」に concurrent cycle を強制する (JEP 346)。
              # 無人時でも Young GC は 2〜4 分に 1 回走ってタイマーをリセットするため、
              # 間隔はそれより短い 1 分に設定する必要がある (5 分 = 300000 では一度も発動しなかった)。
              # 賑わっている時間帯は GC 間隔が数秒のためこのフラグは発動しない。
              #
              # MaxDirectMemorySize: 未設定だとデフォルトで Xmx と同じ 8G まで direct buffer が
              # 伸びられるため、コンテナの memory limit を超えうる。実測ピークは ~450MiB のため
              # 2 倍のマージンを取って 1G に制限する。
              #
              # --- 以下 2026-08-09 GC storm 調査用の canary (s5 のみ) ---
              # 2026-08-09 17:27 の liveness kill は、collection 後の Old 使用量が約 70 分で
              # 2.5→7.96GiB (ほぼ満杯) に増大し Full GC 連発 (17:20-25 の 5 分で 271 秒) に
              # 陥ったことが原因。Old に何が保持されていたかは未特定のため、GC ログと
              # 継続 JFR を /data (PVC) に永続化して次回発生時に特定できるようにする。
              #
              # GC ログ: %t なしだと liveness kill 直後の再起動で直前のログが失われるため
              # %t を付ける。その代償として filecount の rotation は JVM 起動を跨いで効かない
              # (起動ごとに別 basename になる) ので、gc-telemetry-cleanup initContainer が
              # 起動時に古いファイルを掃除する。
              # gc+age は MaxTenuringThreshold=1 の再評価、gc+humongous は G1HeapRegionSize
              # 16M 化の要否判断、safepoint は watchdog の停止時間との照合に使う。
              #
              # JFR: repository を PVC 上に置くことで、SIGKILL 後も完成済み chunk を
              # `jfr assemble /data/jfr-repository/<subdir> out.jfr` で連結して読める
              # (未完了の .part は除外される)。repository ディレクトリは JFR が自動作成する。
              # OldObjectSample は default 設定でも有効だが allocation stack trace がないため
              # stackTrace のみ追加で有効化する (JDK 17 の CLI イベント設定オーバーライド)。
              # settings=profile を常用しないのは短期解析向けで default より負荷が高いため。
              #
              # 重要な制約: OldObjectSample イベントは recording の stop/dump 時にしか
              # chunk へ書き出されない (PlatformRecorder.stop の実装)。SIGKILL で残る chunk に
              # 含まれるのは GC/safepoint/ObjectAllocationSample 等の通常イベントのみで、
              # 「生存オブジェクトの allocation stack」(保持元特定に必要) は残らない。対策:
              # - terminationGracePeriodSeconds を 180 に延長し、liveness kill 時に SIGTERM
              #   からの正常終了 (shutdown hook の dumponexit が OldObjectSample を書き出す)
              #   が完走する確率を上げる (2026-08-09 は猶予 30 秒で足りず SIGKILL された)
              # - アラート発火中に手動で取る場合は JMC を JMX (10.96.118.86:32000) につないで
              #   recording "continuous" を dump する。コンテナは JRE イメージで jcmd がなく、
              #   kubectl debug --target も PID namespace しか共有せず attach socket
              #   (/tmp/.java_pid*) が debug container から見えないため使えない。
              #   FlightRecorderMXBean によるアラート起点の自動 dump は今後の課題
              value: >-
                -XX:ErrorFile=/data/hs_err_pid%p.log -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/data/ -XX:+CreateCoredumpOnCrash
                -XX:NativeMemoryTracking=summary
                -XX:+UnlockDiagnosticVMOptions
                -XX:+DebugNonSafepoints
                -XX:ReservedCodeCacheSize=384m
                -XX:MaxMetaspaceSize=384m
                -XX:G1PeriodicGCInterval=60000
                -XX:MaxDirectMemorySize=1g
                -Xlog:gc*,gc+heap=debug,gc+age=debug,gc+humongous=debug,safepoint=info:file=/data/gc-%t.log:time,uptime,level,tags:filecount=10,filesize=50m
                -XX:FlightRecorderOptions=repository=/data/jfr-repository,stackdepth=128
                -XX:StartFlightRecording:name=continuous,disk=true,maxage=6h,maxsize=1g,dumponexit=true,filename=/data/jfr-exit.jfr,settings=default,jdk.OldObjectSample#stackTrace=true

            - name: ENABLE_JMX
              value: "true"
            # 固定化したClusterIPを指定することで、VisualVMによるアクセスが正しく動作するようにする
            - name: JMX_HOST
              value: "10.96.118.86"
            - name: JMX_PORT
              value: "32000"

            - name: COPY_CONFIG_DEST
              # /config をサーバーディレクトリにコピーするようにする
              # https://github.com/itzg/docker-minecraft-server/tree/9458005b5bd78b8139e13e66c29a449a12dd6218#optional-plugins-mods-and-config-attach-points
              value: /data

            - name: CFG_REPLACEMENT__DISCORDSRV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcserver--common--config-secrets
                  key: DISCORDSRV_TOKEN

            - name: CFG_REPLACEMENT__DISCORDSRV_GLOBAL_CHANNEL_ID
              value: "535436718405451777"

            - name: CFG_REPLACEMENT__DISCORDSRV_CONSOLE_CHANNEL_ID
              value: "295043380914683906"

            - name: CFG_REPLACEMENT__SEICHIASSIST_DB_HOST
              value: mariadb

            - name: CFG_REPLACEMENT__SEICHIASSIST_DB_PORT
              value: "3306"

            - name: CFG_REPLACEMENT__SEICHIASSIST_DB_USER
              value: mcserver

            - name: CFG_REPLACEMENT__SEICHIASSIST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mcserver-password

            - name: CFG_REPLACEMENT__SEICHIASSIST_URL_WEBHOOK_NOTIFICATION
              valueFrom:
                secretKeyRef:
                  name: mcserver--seichiassist-webhook--config-secrets
                  key: SEICHIASSIST_S5_WEBHOOK_URL

            - name: CFG_REPLACEMENT__SEICHIASSIST_REDISBUNGEE_REDIS_HOST
              value: seichi-redisbungee-valkey

            - name: CFG_REPLACEMENT__SEICHIASSIST_REDISBUNGEE_REDIS_PORT
              value: "6379"

            - name: CFG_REPLACEMENT__SEICHIASSIST_BUNGEESEMAPHORE_RESPONDER_REDIS_HOST
              value: seichi-bungeesemaphore-valkey

            - name: CFG_REPLACEMENT__SEICHIASSIST_BUNGEESEMAPHORE_RESPONDER_REDIS_PORT
              value: "6379"

            - name: CFG_REPLACEMENT__PROMETHEUS_EXPORTER_PORT
              value: "9225"

            - name: CFG_REPLACEMENT__WORLDEDIT_SCHEMATICS_DIRECTORY
              value: /worldedit-schematica

            - name: CFG_REPLACEMENT__COREPROTECT_MYSQL_HOST
              value: mariadb

            - name: CFG_REPLACEMENT__COREPROTECT_MYSQL_PORT
              value: "3306"

            - name: CFG_REPLACEMENT__COREPROTECT_MYSQL_USER
              value: coreprotect

            - name: CFG_REPLACEMENT__COREPROTECT_MYSQL_DATABASE_NAME
              value: coreprotect__mc_s5

            - name: CFG_REPLACEMENT__COREPROTECT_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: coreprotect-password

            - name: CFG_REPLACEMENT__LUCKPERMS_MYSQL_HOST
              value: mariadb

            - name: CFG_REPLACEMENT__LUCKPERMS_MYSQL_PORT
              value: "3306"

            - name: CFG_REPLACEMENT__LUCKPERMS_MYSQL_USER
              value: luckperms

            - name: CFG_REPLACEMENT__LUCKPERMS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: luckperms-password

            - name: CFG_REPLACEMENT__LUCKPERMS_MYSQL_DATABASE_NAME
              value: luckperms

            - name: CFG_REPLACEMENT__LITEBANS_MYSQL_HOST
              value: mariadb

            - name: CFG_REPLACEMENT__LITEBANS_MYSQL_PORT
              value: "3306"

            - name: CFG_REPLACEMENT__LITEBANS_MYSQL_USER
              value: litebans

            - name: CFG_REPLACEMENT__LITEBANS_MYSQL_DATABASE_NAME
              value: litebans_gigantic_prod

            - name: CFG_REPLACEMENT__LITEBANS_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: litebans-password

            - name: RCON_CMDS_STARTUP
              value: |-
                mv gamerule keepInventory true world_SW_3
                mv gamerule keepInventory true world_SW_4
                mv gamerule disableRaids true world_SW_3
                mv gamerule disableRaids true world_SW_4
                mv gamerule doInsomnia false world_SW_3
                mv gamerule doInsomnia false world_SW_4
                rg addmember -w world_SW_4 __global__ b66cc3f6-a045-42ad-b4b8-320f20caf140
                rg flag -w world_SW_4 __global__ build -g members allow
                rg flag -w world_SW_3 __global__ deny-spawn PHANTOM
                rg flag -w world_SW_4 __global__ deny-spawn PHANTOM

            - name: REMOVE_OLD_MODS
              value: "TRUE"

            # /downloaded-plugins: Garage からダウンロードしたプラグインを配置
            # /plugins: common イメージや各サーバ個別のイメージの中にそれぞれ含まれる設定ファイルを配置
            # Note: Docker の COPY 命令は、同名ディレクトリが存在する場合は、再帰的に中身がマージされ、同名ファイルは上書きされる
            - name: COPY_PLUGINS_SRC
              value: |-
                /downloaded-plugins
                /plugins

          image: ghcr.io/giganticminecraft/seichi_minecraft_server_production_s5:1.0.0@sha256:4d5a1c14154c9f14d309db39f467bedb1208ab62c609c77e50a96a1162e77be8
          name: minecraft
          ports:
            - containerPort: 25565
              name: minecraft
            - containerPort: 18321
              name: jmx-metrics
            - containerPort: 9225
              name: mc-metrics
            - containerPort: 32000
              name: jmx-remote

          livenessProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: 25565
            # 最大10分待つ。ノード再起動直後のコールドスタートでは
            # プラグイン読み込みで起動が 120 秒を超え、旧設定(120秒)では
            # 開通前に kill され続ける再起動ループに陥った(2026-07-14)
            failureThreshold: 30
            periodSeconds: 20

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  # メンテナンスモードチェック（ConfigMapをボリュームマウントで読み取り）
                  if grep -q "^true$" /maintenance-mode/enabled 2>/dev/null; then
                    echo "Maintenance mode is enabled"
                    exit 1
                  fi
                  # 通常のヘルスチェック
                  mc-monitor status --host localhost --port 25565
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 18

          volumeMounts:
            # メンテナンスモードの状態確認用ConfigMap
            - name: maintenance-mode
              mountPath: /maintenance-mode
              readOnly: true

            # itzg/minecraft-server は /config に設定ファイルをマウントしておけばコピーをしてくれる。
            # 環境変数の置き換えはPrefix等の設定が必要なので、必要になったら設定するように。
            # https://github.com/itzg/docker-minecraft-server/tree/9458005b5bd78b8139e13e66c29a449a12dd6218#replacing-variables-inside-configs

            # 普通にマウントすると、auto-update (常に最新のvolume内容がコンテナ内から見える) の挙動を
            # 提供するために symlink による一時ディレクトリがマウントされることになるが、
            # itzg/minecraft-server が利用するファイル同期の仕組み (itzg/mc-image-helper) は
            # symlink を展開してしまうため、設定ファイルのパスが壊れてしまう。
            #
            # subPathを利用してマウントすればsymlinkが作られることを回避できるためそのようにしている。
            # 参考: https://stackoverflow.com/a/63114800
            # 参考: https://stackoverflow.com/a/50687707

            # /plugins, /data/plugins ディレクトリには直接マウントしないこと。
            #
            # itzg/minecraft-server は /plugins ディレクトリにプラグインを配置することで
            # /data/plugins ディレクトリに自動で配置してくれる。
            # しかし、この Pod のベースとなっている seichi_minecraft_server_base は、
            # /plugins ディレクトリに必要なプラグインの設定ファイルを展開している。
            # そのため、/plugins ディレクトリにボリュームを直接マウントすると、既存の設定ファイルがすべて上書き(削除)されてしまう。
            #
            # また、/data/plugins ディレクトリにマウントしていない理由は、
            # バックアップファイルからサーバーデータをリストアした場合、既存のデータが /data/plugins ディレクトリにも配置される。
            # しかし、この Pod が起動したときに /data/plugins ディレクトリに mod-downloader-volume をマウントしてしまうと、
            # 復元したはずのデータがすべて削除されることによって、
            # /data/plugins/[プラグイン名] ディレクトリ以下にデータを保存するプラグインのデータ整合性が失われるリスクがある。
            # これを回避するため、別のディレクトリにマウントしたうえで /data/plugins ディレクトリに mod-donwloader からダウンロードしたプラグインを配置する必要がある。
            # itzg/minecraft-server の機能で COPY_PLUGINS_SRC という環境変数で指定したディレクトリをにプラグインを配置することで、
            # これを実現するため、Pod 起動時に /data/plugins ディレクトリにプラグインを配置することができ、
            # そこに指定した /downloaded-plugins ディレクトリにマウントすることとしている。
            - name: mod-downloader-volume
              mountPath: /downloaded-plugins

            - name: worldedit-schematica-volume
              mountPath: /worldedit-schematica

            - name: mcserver--s5-data
              mountPath: /data

        - resources:
            limits:
              memory: 128Mi
          image: nginx:1.31.4
          name: dynmap
          ports:
            - containerPort: 80
              name: dynmap
          env:
            - name: TZ
              value: Asia/Tokyo
          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-conf
              subPath: nginx.conf
            - name: mcserver--s5-data
              mountPath: /data

      volumes:
        # メンテナンスモードの状態を保持するConfigMap
        - name: maintenance-mode
          configMap:
            name: maintenance-mode

        # mod-downloaderからプラグインをinitContainerでダウンロードしてMinecraftに受け渡すためのvolume
        - name: mod-downloader-volume
          emptyDir: {}

        # WorldEditがSchematicaを保存・読み取るするためのvolume
        - name: worldedit-schematica-volume
          emptyDir: {}

        # DynMapをホストするためのnginxの設定ファイル
        - name: nginx-conf
          configMap:
            name: dynmap-nginx-conf--s5
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mcserver--s5-data
      spec:
        accessModes:
          - ReadWriteOnce
