apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-frontend
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-frontend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seichi-portal-frontend
  template:
    metadata:
      labels:
        app: seichi-portal-frontend
    spec:
      containers:
        - name: seichi-portal-frontend
          image: ghcr.io/giganticminecraft/seichi-portal-frontend:0.3.2@sha256:9d65f9089513367d260b7c3671d101947ad16a95cc115ddbb73748839f7feb5f
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          env:
            - name: MS_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: MS_APP_CLIENT_ID
            - name: MS_APP_REDIRECT_URL
              value: https://portal.seichi.click
            - name: BACKEND_SERVER_URL
              value: http://seichi-portal-backend:80
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_REDIRECT_URI
              value: https://portal.seichi.click/api/discord
            - name: NEXT_PUBLIC_DEBUG_MODE
              value: "false"
            # OTel SDK (@vercel/otel) 導入 (seichi-portal-frontend#932) 前は参照されない
            - name: OTEL_SERVICE_NAME
              value: "seichi-portal-frontend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=seichi-portal,deployment.environment=production,deployment.environment.name=production"
            # 継続プロファイリング (seichi-portal-frontend#962)。
            # 対応前のイメージはこの env を読まないため先行供給しても無害
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "seichi-portal-frontend"
