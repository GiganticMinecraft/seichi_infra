apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-frontend
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-frontend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: seichi-portal-frontend
  template:
    metadata:
      labels:
        app: seichi-portal-frontend
    spec:
      # SIGTERM 後の猶予。Next.js の standalone server は SIGTERM を受けると drain せずに
      # すぐ終了するため 30 秒 (既定値) で足りる。preStop は Endpoint 反映までの取りこぼしを
      # 防ぐだけで、SIGTERM 時点で処理中の SSR リクエストは切れる
      terminationGracePeriodSeconds: 30
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-portal-frontend
      containers:
        - name: seichi-portal-frontend
          image: ghcr.io/giganticminecraft/seichi-portal-frontend:1.3.5@sha256:6b4c02836b6df54433bfb1cf8252bb93f3d409a9010a72b0f6e80ef881c6a206
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # health エンドポイントが無いため、listener の有無だけを tcpSocket で見る。
          # (SSR が backend を呼ぶ "/" を httpGet にすると backend 障害で frontend まで
          # 再起動するため使わない。イベントループのハングは tcpSocket では検知できない)
          # startupProbe が通るまで liveness を止め、起動直後の再起動を防ぐ (最大 60 秒)
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # 2026-10 時点の 7 日ピークが 230Mi で limit 256Mi に迫り、VPA の upper bound
          # (303Mi) も limit を超えていたため memory を倍に広げる。
          # CPU は平均 10m 程度 (VPA target 23m) だが、Next.js の SSR はリクエストが
          # 重なった瞬間に 1 コアを使い切る。limit 100m では脆弱性スキャナのバーストや
          # 回答一覧の SSR で CFS throttling が 50% を超え (7 日ピーク 54%)、backend が
          # 5ms で返す /users/me の fetch に 650ms、ページ応答に 1.5〜2.7 秒かかっていた
          # ため limit を 500m にする。request は実使用に合わせて据え置く。
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # ルートファイルシステムは読み取り専用にし、Next.js の画像最適化キャッシュ
          # (/app/.next/cache) だけ emptyDir を使う
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
          env:
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: TURNSTILE_SITE_KEY
            - name: MS_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: MS_APP_CLIENT_ID
            - name: MS_APP_REDIRECT_URL
              value: https://portal.seichi.click
            - name: BACKEND_SERVER_URL
              value: http://seichi-portal-backend:80
            - name: SEICHI_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: SEICHI_PROXY_SECRET
            - name: SEICHI_CLIENT_IP_HEADER
              value: CF-Connecting-IP
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-frontend-secrets
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_REDIRECT_URI
              value: https://portal.seichi.click/api/discord
            - name: NEXT_PUBLIC_DEBUG_MODE
              value: "false"
            # OTel SDK (@vercel/otel) 導入 (seichi-portal-frontend#932) 前は参照されない
            - name: OTEL_SERVICE_NAME
              value: "seichi-portal-frontend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=seichi-portal,deployment.environment=production,deployment.environment.name=production"
            # 継続プロファイリング (seichi-portal-frontend#962)。
            # 対応前のイメージはこの env を読まないため先行供給しても無害
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "seichi-portal-frontend"
      # イメージは distroless nonroot (USER 65532:65532)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # /_next/image の最適化結果を書き込むキャッシュ。書けないと毎回 MISS (再変換) になり、
        # ENOENT の unhandledRejection がログに出る。Pod ごとのキャッシュで再起動時に消えてよい。
        # ノードのディスクを使い、sizeLimit (256Mi) を超えると kubelet が Pod を evict する
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
