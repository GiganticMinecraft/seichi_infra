apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-read-canary-workflow-sa
  namespace: seichi-minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-read-canary-workflow-role
  namespace: seichi-minecraft
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-read-canary-workflow-binding
  namespace: seichi-minecraft
subjects:
  - kind: ServiceAccount
    name: garage-read-canary-workflow-sa
    namespace: seichi-minecraft
roleRef:
  kind: Role
  name: garage-read-canary-workflow-role
  apiGroup: rbac.authorization.k8s.io
