# Garage のオブジェクトを実際に最後まで読み出して欠損を検出するカナリア。
#
# 2026-10-19 に garage-1 切断中の repair block-refs で block_ref が誤って削除され、
# 参照先ブロックが GC されて約 70 オブジェクトが読めなくなった。欠損したオブジェクトへの
# GET は 200 と正しい Content-Length を返したあと本文が途中で切れるため、
# api_s3_error_counter にも 5xx にも現れない (ヘッダ送信後の失敗は数えられない)。
# seichi-plugins/common-plugins/ObserverUtils-*.jar が切れていたことで本番の
# Minecraft サーバー 5 台が起動できなくなるまで誰も気付けなかった。
#
# そこで mod-downloader (各 Minecraft サーバーの init container) が依存する
# seichi-plugins と seichiassist の全オブジェクトを 1 時間ごとに読み、
# ダウンロード失敗またはサイズ不一致があればワークフローを失敗させて
# backup-failure-notification 経由で Discord に通知する。
# 対象は 2026-10 時点で約 245 オブジェクト / 約 510MiB。
#
# 認証情報は mod-downloader と同じ garage-s3-credentials を使う (同じ鍵で読めることを確認する意味もある)。
# この Secret と通知用の backup-failure-notify-webhook が seichi-minecraft namespace に
# あるため、cluster-wide-apps ではなくここに置いている。
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: garage-read-canary
  namespace: seichi-minecraft
spec:
  schedules:
    - "23 * * * *"
  timezone: Asia/Tokyo
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: garage-read-canary
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: garage-read-canary
  namespace: seichi-minecraft
  annotations:
    workflows.argoproj.io/description: "Garage の seichi-plugins / seichiassist バケットの全オブジェクトを読み出し、欠損 (本文の途中切れ) がないか確認するワークフロー"
spec:
  podResources:
    requests:
      cpu: 100m
      memory: 256Mi
  serviceAccountName: garage-read-canary-workflow-sa
  ttlStrategy:
    secondsAfterSuccess: 3600
    secondsAfterFailure: 86400
  # 1 時間ごとに起動するので、次の起動までには必ず終わらせる
  activeDeadlineSeconds: 2400
  onExit: notify-on-failure
  entrypoint: default
  templates:
    - name: default
      steps:
        - - name: read-all-objects
            template: read-all-objects

    - name: read-all-objects
      retryStrategy:
        # 一時的な接続断で通知が飛ばないよう 1 回だけやり直す。
        # 欠損したオブジェクトは何度読んでも同じ所で切れるので、2 回続けて失敗したら本物。
        limit: "1"
        retryPolicy: OnFailure
      script:
        # AWS CLI と bash が入っている既存のバックアップ用イメージを使う
        image: ghcr.io/giganticminecraft/pbs-client:1.0.0@sha256:0249304b6d227ac472947c895c3cba7449ccac648ecddc883e1eb7e9ceeb1cc4
        command: ["/bin/bash"]
        source: |
          set -euo pipefail

          S3_OPTS=(--endpoint-url http://garage.garage.svc.cluster.local:3900 --region seichi-cloud)
          BUCKETS="seichi-plugins seichiassist"

          total=0
          failed=0
          failures=""

          for bucket in $BUCKETS; do
            echo "=== Listing s3://$bucket ==="
            listing=$(aws "${S3_OPTS[@]}" s3api list-objects-v2 \
              --bucket "$bucket" \
              --query 'Contents[].[Size,Key]' \
              --output text)

            if [ -z "$listing" ] || [ "$listing" = "None" ]; then
              # 空になっている時点で mod-downloader は何も取れないので異常として扱う
              echo "ERROR: s3://$bucket にオブジェクトがありません"
              failed=$((failed + 1))
              failures="${failures}s3://$bucket (empty)\n"
              continue
            fi

            # Size を先頭に置いているので、キーにスペースが含まれても 2 列目以降に全部入る
            while IFS=$'\t' read -r expected key; do
              [ -n "$key" ] || continue
              total=$((total + 1))
              # 欠損したオブジェクトは 200 + 正しい Content-Length のあと本文が途中で切れる。
              # aws s3 cp はこの場合に失敗するが、念のため受信バイト数もリスト上のサイズと比べる。
              if actual=$(aws "${S3_OPTS[@]}" s3 cp --quiet "s3://$bucket/$key" - </dev/null | wc -c); then
                if [ "$actual" -ne "$expected" ]; then
                  echo "NG   s3://$bucket/$key: expected $expected bytes, got $actual bytes"
                  failed=$((failed + 1))
                  failures="${failures}s3://$bucket/$key (size $actual/$expected)\n"
                fi
              else
                echo "NG   s3://$bucket/$key: download failed (received ${actual:-?} bytes of $expected)"
                failed=$((failed + 1))
                failures="${failures}s3://$bucket/$key (download failed)\n"
              fi
            done <<< "$listing"
          done

          echo "=== Checked $total objects, $failed failed ==="
          if [ "$failed" -ne 0 ]; then
            echo "Failed objects:"
            printf '%b' "$failures"
            exit 1
          fi
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: garage-s3-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: garage-s3-credentials
                key: AWS_SECRET_ACCESS_KEY
          # 欠損したオブジェクトは何度読んでも同じ所で切れるので、CLI 内部のリトライで時間を食わないよう試行回数を絞る
          - name: AWS_MAX_ATTEMPTS
            value: "2"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

    - name: notify-on-failure
      steps:
        - - name: send-failure-notification
            templateRef:
              name: backup-failure-notification
              template: send-discord-notification
              clusterScope: true
            when: "{{workflow.status}} != Succeeded"
            arguments:
              parameters:
                - name: title
                  value: "Garage 読み出しカナリア失敗"
                - name: workflow-kind
                  value: "Garage 読み出しカナリア"
