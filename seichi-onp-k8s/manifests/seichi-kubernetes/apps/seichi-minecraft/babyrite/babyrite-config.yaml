# babyrite Config
# This file is used to configure babyrite.
# You can change the settings here to customize babyrite's behavior.
# For more information, see the babyrite documentation at https://babyrite.m1sk9.dev/docs/configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: babyrite-config
data:
  config.toml: |
    ### babyrite configuration file ###
    # This file is used for babyrite configuration.
    # The settings are written in TOML format. To use the configuration file, specify the recursive path to the configuration file in the environment variable "CONFIG_FILE_PATH" injected into the container.
    # Note that babyrite will run with default settings if not configured.
    # babyrite reads this file only on startup, so the Pod must be restarted after changing it.

    # Logging settings
    [log]
    ## Log level filter. Accepts the same syntax as the RUST_LOG environment variable (e.g. "babyrite=debug").
    ## RUST_LOG takes precedence over this value when it is set.
    level = "babyrite=info"
    ## Output format: "compact" (human-readable) or "json".
    ## JSON is required for Loki to parse the per-request fields (message_id / guild_id / channel_id) with "| json".
    format = "json"

    # Feature flags
    [features]
    ## Expands GitHub permalinks into syntax-highlighted code blocks.
    github_permalink = false
