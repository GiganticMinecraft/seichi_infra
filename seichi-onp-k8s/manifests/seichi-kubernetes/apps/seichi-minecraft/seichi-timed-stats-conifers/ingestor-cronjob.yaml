apiVersion: batch/v1
kind: CronJob
metadata:
  name: seichi-timed-stats-conifers-ingestor
  namespace: seichi-minecraft
spec:
  # every 5 minutes
  # https://crontab.guru/#*/5_0_*_*_*
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 5
      # 実行時間の上限。通常の ingest は数秒〜数十秒で終わる。
      # ingestor#196 で導入する Pyroscope agent の停止処理は、依存クレート内部の
      # エラー経路で稀に無期限待機し得るため (Codex レビュー指摘)、Job 側で
      # 確実に打ち切る (5 分周期 + startingDeadlineSeconds 240 と整合する値)
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            # CiliumNetworkPolicy の endpointSelector 用
            app: seichi-timed-stats-conifers-ingestor
        spec:
          restartPolicy: OnFailure
          # イメージ (conifers#240 以降) は distroless nonroot で USER 65532:65532 を数値で
          # 明示しているので、migration-job.yaml と同じく runAsNonRoot だけで非 root を強制する
          # (runAsUser の固定はイメージ側の uid 変更を黙って上書きするため付けない)。
          # listen はしないので port の制約は無い
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # migration は initContainer ではなく ArgoCD の PreSync hook
          # (migration-job.yaml) で sync 時に 1 回だけ実行する (infra#5693)。
          # migration の障害が 5 分ごとの全 ingest を止めないようにするため
          containers:
            - name: ingestor
              image: ghcr.io/giganticminecraft/seichi-timed-stats-conifers-ingestor:latest@sha256:acad126265f740e91da46b0fcdbb1ab085ac6bafc8b794783b2f12bbbb944f18
              # 2026-10 時点で直近 24 時間の working set 最大は約 30Mi、1 回の実行は 12 秒程度。
              # CPU は実行時間が短く scrape 間隔に収まらないため実測できていない
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              # rootfs は読み取り専用。書き込みが必要なのは pyroscope-rs (pprof) が
              # 起動時に作る一時ファイル用の /tmp だけ (conifers#240 でローカル実機確認)。
              # /tmp に書けないと ingest 自体は成功するが、起動時に
              # "Error in creating profiler: Read-only file system (os error 30)" を
              # ログに出してプロファイルだけ取れなくなる (アラートは無いのでログで気付く)
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: DB_CONNECTION_HOST_AND_PORT
                  value: "mariadb:3306"
                - name: DB_CONNECTION_USER
                  value: "seichi-timed-stats-conifers"
                - name: DB_CONNECTION_DATABASE
                  value: "seichi-timed-stats-conifers"
                - name: DB_CONNECTION_POOL_SIZE
                  value: "3"
                - name: DB_CONNECTION_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: seichi-timed-stats-conifers-db-credentials
                      key: password
                - name: GAME_DATA_SERVER_GRPC_ENDPOINT_URL
                  value: "http://seichi-game-data-server:80"
                - name: RUST_LOG
                  value: "debug,h2::codec::framed_read=info"
                - name: RUST_BACKTRACE
                  value: "1"
                # 継続プロファイリング (conifers#196 で Sentry から移行)
                - name: PYROSCOPE_SERVER_ADDRESS
                  value: "http://pyroscope.monitoring.svc.cluster.local:4040"
                - name: PYROSCOPE_APPLICATION_NAME
                  value: "seichi-timed-stats-conifers-ingestor"
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                # 他の Rust サービス (game-data-server 等) と同じ値。medium: Memory では
                # sizeLimit が tmpfs の size になるため、超過しても evict ではなく
                # プロセス内の書き込みが ENOSPC で失敗し、プロファイルが欠ける
                sizeLimit: 64Mi
