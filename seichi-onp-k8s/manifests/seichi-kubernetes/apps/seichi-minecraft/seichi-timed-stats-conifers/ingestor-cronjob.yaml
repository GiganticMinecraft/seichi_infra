apiVersion: batch/v1
kind: CronJob
metadata:
  name: seichi-timed-stats-conifers-ingestor
  namespace: seichi-minecraft
spec:
  # every 5 minutes
  # https://crontab.guru/#*/5_0_*_*_*
  schedule: "*/5 * * * *"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 240
  jobTemplate:
    spec:
      backoffLimit: 5
      # 実行時間の上限。通常の ingest は数秒〜数十秒で終わる。
      # ingestor#196 で導入する Pyroscope agent の停止処理は、依存クレート内部の
      # エラー経路で稀に無期限待機し得るため (Codex レビュー指摘)、Job 側で
      # 確実に打ち切る (5 分周期 + startingDeadlineSeconds 240 と整合する値)
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            # CiliumNetworkPolicy の endpointSelector 用
            app: seichi-timed-stats-conifers-ingestor
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: migration
              image: ghcr.io/giganticminecraft/seichi-timed-stats-conifers-database-migration:sha-58b84f1@sha256:2da36394a784cd95deabb69c6b553b5c6adbebe9754530c0d6fc4705cad9069b
              env:
                - name: DB_HOST_AND_PORT
                  value: "mariadb:3306"
                - name: DB_USER
                  value: "seichi-timed-stats-conifers"
                - name: DB_DATABASE_NAME
                  value: "seichi-timed-stats-conifers"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: seichi-timed-stats-conifers-db-credentials
                      key: password
          containers:
            - name: ingestor
              image: ghcr.io/giganticminecraft/seichi-timed-stats-conifers-ingestor:sha-5fe5b38@sha256:a3992cd8bdd198d5a0a3ce5b473f62c1dcaec7834abd972ddc999f4931a42e89
              env:
                - name: DB_CONNECTION_HOST_AND_PORT
                  value: "mariadb:3306"
                - name: DB_CONNECTION_USER
                  value: "seichi-timed-stats-conifers"
                - name: DB_CONNECTION_DATABASE
                  value: "seichi-timed-stats-conifers"
                - name: DB_CONNECTION_POOL_SIZE
                  value: "3"
                - name: DB_CONNECTION_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: seichi-timed-stats-conifers-db-credentials
                      key: password
                - name: GAME_DATA_SERVER_GRPC_ENDPOINT_URL
                  value: "http://seichi-game-data-server:80"
                - name: RUST_LOG
                  value: "debug,h2::codec::framed_read=info"
                - name: RUST_BACKTRACE
                  value: "1"
                # 継続プロファイリング (conifers#196 で Sentry から移行)
                - name: PYROSCOPE_SERVER_ADDRESS
                  value: "http://pyroscope.monitoring.svc.cluster.local:4040"
                - name: PYROSCOPE_APPLICATION_NAME
                  value: "seichi-timed-stats-conifers-ingestor"
