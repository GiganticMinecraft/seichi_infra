# seichi-timed-stats-conifers の ingest 失敗通知。
# Sentry SDK 撤去 (seichi-timed-stats-conifers#196) 後の通知カバレッジ確保
# (Codex レビュー指摘: 汎用の KubeJobFailed は notify=discord の opt-in
# リストに含まれておらず、人的通知が消えていた)。
# 各アラート名は kured の alertFilterRegexp にも登録している。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: seichi-timed-stats-conifers-alerts
  namespace: seichi-minecraft
  labels:
    release: prometheus
spec:
  groups:
    - name: seichi-timed-stats-conifers-alerts
      rules:
        - alert: ConifersIngestorJobFailed
          # backoffLimit (5) / activeDeadlineSeconds 超過で Job が失敗扱いに
          # なったことを検知する。
          # failedJobsHistoryLimit が最後の失敗 Job を保持し続けるため、
          # 「失敗 Job の存在」だけを見ると何日も前の失敗に firing し続ける
          # (2026-08-02 に 4 日前の残骸 Job で誤報した実績)。開始が直近 1 時間の
          # Job に限定し、履歴の残骸では発火させない。
          # job_name を残すと 5 分ごとの Job 1 個につき 1 アラートになり、
          # 失敗が続くと Discord 通知が同文の羅列になる (2026-08-02 実績) ため
          # count で単一インスタンスに集約し、失敗数は $value で伝える
          expr: |
            count by (namespace) (
              kube_job_failed{namespace="seichi-minecraft", job_name=~"seichi-timed-stats-conifers-ingestor-.*", condition="true"} == 1
              and on (job_name)
              (
                time() - kube_job_status_start_time{namespace="seichi-minecraft", job_name=~"seichi-timed-stats-conifers-ingestor-.*"} < 3600
              )
            ) > 0
          for: 1m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "timed-stats-conifers の ingest Job が失敗しました"
            description: "直近 1 時間に {{ $value }} 個の ingest Job が失敗しています (retry 上限または実行期限超過)。ログは Loki の {job=\"seichi-minecraft/ingestor\"} で確認する (短命 Pod のため欠落しうる。その場合は kubectl logs)。"

        - alert: ConifersIngestorStalled
          # 「失敗 Job の存在」(上記) とは独立に、成功の途絶そのものを検知する
          # (infra#5692、2026-08-02 インシデントの恒久対策)。
          # Job オブジェクトは concurrencyPolicy: Replace や履歴 limit ですぐ
          # 消されるため、JobFailed だけでは長時間停止が resolve 済みに見える
          # ことがある。最後の成功からの経過時間なら Job の残骸に依存しない。
          # 閾値 30 分 = 5 分周期の 6 回分。suspend 中 (計画停止) は発火させない。
          # max による集約は kube-state-metrics の pod 入れ替わりでアラート
          # インスタンスが変わって通知が乱れるのを防ぐため。
          # kube-state-metrics 自体の停止・欠落は汎用の TargetDown 等が検知する
          expr: |
            (
              time()
              - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace="seichi-minecraft", cronjob="seichi-timed-stats-conifers-ingestor"})
              > 1800
            )
            and on (namespace, cronjob)
            (
              max by (namespace, cronjob) (kube_cronjob_spec_suspend{namespace="seichi-minecraft", cronjob="seichi-timed-stats-conifers-ingestor"}) == 0
            )
          for: 5m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "timed-stats-conifers の ingest が停止しています"
            description: "最後に成功した ingest から {{ $value | humanizeDuration }} 経過しています (平常は 5 分周期)。Job の状態は kubectl get jobs -n seichi-minecraft、ログは Loki の {job=\"seichi-minecraft/ingestor\"} で確認する。"

        - alert: ConifersMigrationJobFailed
          # ArgoCD PreSync hook の migration Job (migration-job.yaml,
          # infra#5693) の失敗検知。hook 失敗 = sync 中断であり、ingest は
          # 旧イメージで継続しているが、新リリースの配備が止まっている。
          # 失敗した hook Job は次の sync まで残るため、直近 1 時間の開始に
          # 限定して残骸での発火を防ぐ (ConifersIngestorJobFailed と同じ方式)
          expr: |
            count by (namespace) (
              kube_job_failed{namespace="seichi-minecraft", job_name="seichi-timed-stats-conifers-migration", condition="true"} == 1
              and on (job_name)
              (
                time() - kube_job_status_start_time{namespace="seichi-minecraft", job_name="seichi-timed-stats-conifers-migration"} < 3600
              )
            ) > 0
          for: 1m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "timed-stats-conifers の migration Job が失敗しました"
            description: "ArgoCD PreSync の migration Job が失敗し、sync が中断されています (ingest は旧イメージで継続中)。ログは kubectl logs job/seichi-timed-stats-conifers-migration -n seichi-minecraft、sync 状態は ArgoCD の seichi-minecraft-seichi-timed-stats-conifers を確認する。"
