apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: seichi-minecraft
  labels:
    app: seichi-game-data-server
  name: seichi-game-data-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-server
  template:
    metadata:
      labels:
        app: seichi-game-data-server
    spec:
      # preStop 5 秒 + アプリ側の drain 最大 15 秒 + Pyroscope エージェント停止 最大 10 秒
      # = 30 秒に、OTel の flush と余裕を足して 45 秒にする (既定の 30 秒だと drain 中に
      # SIGKILL され得る)
      terminationGracePeriodSeconds: 45
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-game-data-server
      containers:
        - resources:
            requests:
              memory: 128Mi

          # root で port 80 に bind するため、drop ALL の後に NET_BIND_SERVICE だけ戻す。
          # ルートファイルシステムは読み取り専用にし、書き込みが要る /tmp だけ emptyDir を使う
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          envFrom:
            - configMapRef:
                name: seichi-game-data-server-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mcserver-password
            # service.instance.id が無いと OTLP メトリクスに instance ラベルが付かず、
            # 複数 replica (と rollout 中の新旧 Pod) の累積値が同じ series に交互に
            # 書かれて resets() / increase() が壊れる。Pod 名を instance にする。
            # $(POD_NAME) は先に定義した env しか展開されないため、この順序を保つ
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,deployment.environment.name=production,service.instance.id=$(POD_NAME)"

          # CI が default branch への merge ごとに :master を上書き push する。
          # Renovate (pinDigests) が :master の digest の変化を検知して更新 PR を出す。
          # 特定コミットに固定してロールバックしたいときは sha-<commit> タグの digest を指定する
          image: ghcr.io/giganticminecraft/seichi-game-data-server:master@sha256:4ce57ddd6cee8c8bf96736a639273f63b0c444eb5ab111d61c235fbf642d65ab
          imagePullPolicy: Always
          name: seichi-game-data-server
          ports:
            - containerPort: 80
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # pyroscope-rs のプロファイラが /tmp に一時ファイルを作る。/tmp が書けないと
        # 起動時に "create profiler error" で終了するため、読み取り専用の
        # ルートファイルシステムの代わりに書き込める /tmp を与える。
        # medium: Memory (tmpfs) はコンテナのメモリ使用量に計上される。一時ファイルは小さいが、
        # sizeLimit (64Mi) を超えると kubelet が Pod を evict する
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
