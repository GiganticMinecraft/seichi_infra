apiVersion: v1
kind: ConfigMap
metadata:
  name: seichi-game-data-server-config
data:
  # Each DB query has its own client span (SQL text, returned rows and
  # duration), so the per-query `sqlx::query` events at Debug level are no
  # longer needed. Slow statements (over 1s) are still logged by sqlx at WARN.
  RUST_LOG: "info"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "80"

  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_DATABASE_NAME: "seichiassist"
  DB_USER: "mcserver"

  # Db password will be read from mcserver--common--config-secrets secret

  # OpenTelemetry: traces and metrics are pushed to the cluster's Alloy
  # receiver, which fans out to Tempo / Mimir. Logs are not sent over OTLP;
  # the JSON lines on stdout (with trace_id / span_id) reach Loki through the
  # Pod log collection. Disabling the exporter is as simple as removing
  # OTEL_EXPORTER_OTLP_ENDPOINT.
  OTEL_SERVICE_NAME: "seichi-game-data-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  # OTEL_RESOURCE_ATTRIBUTES は Pod 名 (downward API) を埋め込むため deployment.yaml の env にある

  # Continuous profiler push target. Unset to disable.
  PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.monitoring.svc.cluster.local:4040"
  PYROSCOPE_APPLICATION_NAME: "seichi-game-data-server"
