apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-backend
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # 単一 replica でも、新 Pod が安定して Ready になるまでは旧 Pod を残す。
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: seichi-portal-backend
  template:
    metadata:
      labels:
        app: seichi-portal-backend
      annotations:
        resource.opentelemetry.io/service.name: seichi-portal-backend
        resource.opentelemetry.io/service.namespace: seichi-portal
    spec:
      # preStop 5 秒 + drain (v1.2.4 以降: シグナル受信から 15 秒で打ち切り。axum と
      # search sync / Discord / MQ の停止をまとめて待つ) + Pyroscope 停止 最大 10 秒 +
      # tracer / meter provider の shutdown (順に実行、それぞれ OTLP タイムアウト 10 秒)
      # = 50 秒に余裕を足して 60 秒にする
      terminationGracePeriodSeconds: 60
      # backend は起動時に MariaDB / Valkey へ接続できないと panic で落ちる
      # (connection.rs の ValkeyConnection::connect / ConnectionPool::new)。kured の
      # 再起動で portal 一式が同じノードから退避されると、backend が valkey (exporter
      # sidecar の image pull で 1 分半) や mariadb (他ノードにメモリ不足で載らず元ノード
      # 復帰まで数分) より先に起動して CrashLoopBackOff になり、依存先が復帰した後も
      # backoff の分だけ余計に止まる (2026-10-24 / 10-28 / 10-29、毎回 restart 6 回)。
      # 必須依存 (/health が必須としている 2 つ) の TCP が開くまで Init で待つことで、
      # panic も CrashLoopBackOff も起こさず、依存先復帰の数秒後に起動する。
      # 待ち先は env の MYSQL_HOST:MYSQL_PORT / REDIS_HOST:REDIS_PORT と同じ値。
      # Meilisearch / RabbitMQ は起動時に無くても degraded で動くので待たない。
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              for target in mariadb:3306 seichi-portal-valkey:6379; do
                host=${target%:*}; port=${target#*:}
                until nc -z -w 2 "$host" "$port"; do
                  echo "waiting for $target"
                  sleep 2
                done
                echo "$target is reachable"
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: seichi-portal-backend
          image: ghcr.io/giganticminecraft/seichi-portal-backend:1.2.4@sha256:d51b8e37b54978751392a939700820e402a824c25d785159c8e492fef151d132
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # /health は MariaDB と Valkey を必須依存として確認する。
          # Meilisearch、RabbitMQ、Discord Bot の障害は degraded として報告されるが、
          # 主要機能を提供できる Pod は Service から外さない。
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # 依存サービスの障害では再起動させず、HTTP listener 自体の停止だけを検知する。
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # 大量同期時のメモリ増加と CPU throttling を吸収する。
            # 実際に必要なメモリ量を観測できるよう、memory limit は一時的に 3Gi とする。
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          # イメージの USER は ubuntu (名前指定) で、kubelet は名前から uid を解決できず
          # runAsNonRoot だけでは CreateContainerConfigError になる。このため ubuntu の
          # uid/gid (1000) を数値で明示する (migration と /health が uid 1000 で通ることを確認済み)。
          # ルートファイルシステムは読み取り専用にし、書き込みが要る /tmp だけ emptyDir を使う
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MYSQL_DATABASE
              value: seichi-portal
            - name: MYSQL_USER
              value: seichi-portal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-db-credentials
                  key: password
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_PORT
              value: "3306"
            - name: S3_ENDPOINT
              value: http://garage.garage.svc.cluster.local:3900
            - name: S3_BUCKET
              value: seichi-portal
            - name: S3_REGION
              value: seichi-cloud
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: HTTP_PORT
              value: "9000"
            - name: ENV_NAME
              value: production
            - name: FRONTEND_URL
              value: https://portal.seichi.click
            - name: TURNSTILE_ENABLED
              value: "true"
            - name: TURNSTILE_ALLOWED_HOSTNAMES
              value: portal.seichi.click
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: TURNSTILE_SECRET_KEY
            - name: REDIS_HOST
              value: seichi-portal-valkey
            - name: REDIS_PORT
              value: "6379"
            - name: SEICHI_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: SEICHI_PROXY_SECRET
            - name: MEILISEARCH_HOST
              value: http://seichi-portal-meilisearch:7700
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-meilisearch-master-key
                  key: MEILI_MASTER_KEY
            - name: MINECRAFT_BANS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: MINECRAFT_BANS_DATABASE_URL
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: DISCORD_BOT_TOKEN
            - name: RABBITMQ_USER
              value: seichi-portal
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              value: seichi-portal-rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_ROUTING_KEY
              value: seichi_portal
            - name: OTEL_SERVICE_NAME
              value: "seichi-portal-backend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            # メトリクスの送信間隔。Rust SDK の既定 (60s) だと rate() の解像度が粗いため、
            # 他の scrape 間隔 (30s) に揃える
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "30000"
            # service.version はここに書くと Renovate のイメージ更新(image: 行のみ書き換え)に
            # 追従できず乖離するため含めない。アプリ側で CARGO_PKG_VERSION から
            # OTel resource に埋め込むのが正
            # service.instance.id が無いと OTLP メトリクスに instance ラベルが付かず、
            # 複数 replica (と rollout 中の新旧 Pod) の累積値が同じ series に交互に
            # 書かれて resets() / increase() が壊れる。Pod 名を instance にする。
            # $(POD_NAME) は先に定義した env しか展開されないため、この順序を保つ
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=seichi-portal,deployment.environment=production,deployment.environment.name=production,service.instance.id=$(POD_NAME)"
            # 継続プロファイリング (seichi-portal-backend#1290)。
            # 対応前のイメージはこの env を読まないため先行供給しても無害
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "seichi-portal-backend"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # pyroscope-rs のプロファイラが /tmp に一時ファイルを作る。/tmp が書けないと
        # 起動はするがプロファイラが黙って無効になるため、読み取り専用の
        # ルートファイルシステムの代わりに書き込める /tmp を与える。
        # medium: Memory (tmpfs) はコンテナのメモリ使用量に計上される。一時ファイルは小さいが、
        # sizeLimit (64Mi) を超えると kubelet が Pod を evict する
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
