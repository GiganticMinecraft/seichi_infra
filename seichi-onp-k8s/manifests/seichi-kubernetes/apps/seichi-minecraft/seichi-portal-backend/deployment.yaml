apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-backend
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # 単一 replica でも、新 Pod が安定して Ready になるまでは旧 Pod を残す。
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: seichi-portal-backend
  template:
    metadata:
      labels:
        app: seichi-portal-backend
      annotations:
        resource.opentelemetry.io/service.name: seichi-portal-backend
        resource.opentelemetry.io/service.namespace: seichi-portal
    spec:
      containers:
        - name: seichi-portal-backend
          image: ghcr.io/giganticminecraft/seichi-portal-backend:0.2.6@sha256:b56414440c27d68d5853aa36bee32c169c8b0d9802a2c37d85adf02e936248a8
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          # /health は MariaDB、Meilisearch、RabbitMQ、DiscordBot まで確認する。
          # rollout 中は依存先を含めて利用可能になった Pod だけを Service に載せる。
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # 依存サービスの障害では再起動させず、HTTP listener 自体の停止だけを検知する。
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # OTel exporter のオーバーヘッド吸収のため limit を 100m から 300m へ増強
            # (seichi-game-data-publisher が exporter 導入時に 50m→300m へ増強した実績に倣う)
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          env:
            - name: MYSQL_DATABASE
              value: seichi-portal
            - name: MYSQL_USER
              value: seichi-portal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-db-credentials
                  key: password
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_PORT
              value: "3306"
            - name: HTTP_PORT
              value: "9000"
            - name: ENV_NAME
              value: production
            - name: FRONTEND_URL
              value: https://portal.seichi.click
            - name: TURNSTILE_ENABLED
              value: "true"
            - name: TURNSTILE_ALLOWED_HOSTNAMES
              value: portal.seichi.click
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: TURNSTILE_SECRET_KEY
            - name: REDIS_HOST
              value: seichi-portal-valkey
            - name: REDIS_PORT
              value: "6379"
            - name: SEICHI_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: SEICHI_PROXY_SECRET
            - name: MEILISEARCH_HOST
              value: http://seichi-portal-meilisearch:7700
            - name: MEILISEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-meilisearch-master-key
                  key: MEILI_MASTER_KEY
            - name: MINECRAFT_BANS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: MINECRAFT_BANS_DATABASE_URL
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-backend-secrets
                  key: DISCORD_BOT_TOKEN
            - name: RABBITMQ_USER
              value: seichi-portal
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              value: seichi-portal-rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_ROUTING_KEY
              value: seichi_portal
            - name: OTEL_SERVICE_NAME
              value: "seichi-portal-backend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            # service.version はここに書くと Renovate のイメージ更新(image: 行のみ書き換え)に
            # 追従できず乖離するため含めない。アプリ側で CARGO_PKG_VERSION から
            # OTel resource に埋め込むのが正
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=seichi-portal,deployment.environment=production,deployment.environment.name=production"
            # 継続プロファイリング (seichi-portal-backend#1290)。
            # 対応前のイメージはこの env を読まないため先行供給しても無害
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "seichi-portal-backend"
