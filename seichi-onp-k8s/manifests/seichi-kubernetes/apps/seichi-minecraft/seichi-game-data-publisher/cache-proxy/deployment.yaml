apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seichi-game-data-publisher-cache-proxy
  name: seichi-game-data-publisher-cache-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-publisher-cache-proxy
  template:
    metadata:
      labels:
        app: seichi-game-data-publisher-cache-proxy
    spec:
      # 既定値と同じ 30 秒を明示する (SIGTERM 後の猶予。挙動は変わらない)
      terminationGracePeriodSeconds: 30
      containers:
        - resources:
            requests:
              memory: 32Mi

          # 公式 nginx イメージは master が root で起動し、worker を nginx (101) に
          # setuid/setgid する。master は temp/cache ディレクトリを mkdir して worker に chown する。
          # このため drop ALL の後に NET_BIND_SERVICE (port 80)、SETUID/SETGID (worker の降格)、
          # CHOWN (temp/cache の chown) を戻す。ローカルの container ランタイムで、
          # どれか 1 つでも欠けると起動に失敗することを確認済み
          # proxy_cache_path は /var/cache/nginx 直下だと master がその親ディレクトリごと
          # nginx に chown し、続く client_temp などの mkdir に DAC_OVERRIDE が必要になるため、
          # nginx.conf 側でサブディレクトリにしている
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID

          image: nginx:1.31.7
          name: seichi-game-data-publisher-cache-proxy
          ports:
            - containerPort: 80
          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-conf
              subPath: nginx.conf

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          ports:
            - containerPort: 9113
              name: metrics
          # nginx-prometheus-exporter のイメージは USER 1001:1001
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-conf
          configMap:
            name: seichi-game-data-publisher-cache-proxy-nginx-conf