apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seichi-game-data-publisher-cache-proxy
  name: seichi-game-data-publisher-cache-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-publisher-cache-proxy
  template:
    metadata:
      labels:
        app: seichi-game-data-publisher-cache-proxy
    spec:
      # 既定値と同じ 30 秒を明示する (SIGTERM 後の猶予。挙動は変わらない)
      terminationGracePeriodSeconds: 30
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-game-data-publisher-cache-proxy
      containers:
        - resources:
            requests:
              memory: 32Mi

          image: nginx:1.31.7
          name: seichi-game-data-publisher-cache-proxy
          ports:
            - containerPort: 80
          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-conf
              subPath: nginx.conf

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          ports:
            - containerPort: 9113
              name: metrics
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      volumes:
        - name: nginx-conf
          configMap:
            name: seichi-game-data-publisher-cache-proxy-nginx-conf