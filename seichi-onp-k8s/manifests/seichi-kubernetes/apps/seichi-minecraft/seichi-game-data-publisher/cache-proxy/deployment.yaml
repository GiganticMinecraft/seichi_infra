apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seichi-game-data-publisher-cache-proxy
  name: seichi-game-data-publisher-cache-proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-publisher-cache-proxy
  template:
    metadata:
      labels:
        app: seichi-game-data-publisher-cache-proxy
    spec:
      # SIGTERM 後の猶予。公式 nginx イメージの STOPSIGNAL は SIGQUIT (graceful shutdown) で、
      # 処理中のリクエストは短いため preStop の 5 秒を含めても 30 秒 (既定値) で足りる
      terminationGracePeriodSeconds: 30
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-game-data-publisher-cache-proxy
      containers:
        - resources:
            requests:
              memory: 32Mi

          # 公式 nginx イメージは master が root で起動し、worker を nginx (101) に
          # setuid/setgid する。master は temp/cache ディレクトリを mkdir して worker に chown する。
          # このため drop ALL の後に NET_BIND_SERVICE (port 80)、SETUID/SETGID (worker の降格)、
          # CHOWN (temp/cache の chown) を戻す。ローカルの container ランタイムで、
          # どれか 1 つでも欠けると起動に失敗することを確認済み
          # proxy_cache_path は /var/cache/nginx 直下だと master がその親ディレクトリごと
          # nginx に chown し、続く client_temp などの mkdir に DAC_OVERRIDE が必要になるため、
          # nginx.conf 側でサブディレクトリにしている。
          # ルートファイルシステムは読み取り専用にし、書き込み先は emptyDir にする (volumes 参照)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID

          image: nginx:1.31.7
          name: seichi-game-data-publisher-cache-proxy
          ports:
            - containerPort: 80
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3
          args:
            - "-nginx.scrape-uri=http://127.0.0.1:80/stub_status"
          ports:
            - containerPort: 9113
              name: metrics
          # nginx-prometheus-exporter のイメージは USER 1001:1001。
          # 単一の Go バイナリでファイルに書き込まないため、ルートファイルシステムは読み取り専用にする
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m

      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # 読み取り専用のルートファイルシステムで nginx が書き込む先。
        # /var/cache/nginx は client_temp などの一時ディレクトリと proxy_cache、
        # /run は nginx.pid (/var/run は /run への symlink)。
        # sizeLimit を超えると kubelet が Pod を evict する
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          configMap:
            name: seichi-game-data-publisher-cache-proxy-nginx-conf