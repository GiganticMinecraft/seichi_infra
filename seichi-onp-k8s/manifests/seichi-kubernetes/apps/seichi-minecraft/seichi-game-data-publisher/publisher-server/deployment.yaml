apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seichi-game-data-publisher-server
  name: seichi-game-data-publisher-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-publisher-server
  template:
    metadata:
      labels:
        app: seichi-game-data-publisher-server
    spec:
      # 既定値と同じ 30 秒を明示する (SIGTERM 後の猶予。挙動は変わらない)
      terminationGracePeriodSeconds: 30
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-game-data-publisher-server
      containers:
        - resources:
            # Bumped from 50m to 300m to absorb the OTel exporter and
            # pprof-rs profiler overhead; the previous 50m limit caused 90%+
            # CFS throttling even with avg CPU usage <10m.
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 768Mi

          # root で port 80 に bind するため、drop ALL の後に NET_BIND_SERVICE だけ戻す
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          envFrom:
            - configMapRef:
                name: seichi-game-data-publisher-server

          # Track the rolling :master tag so Argo Image Updater can swap
          # digests in. Per-commit pinning happens by setting a sha- tag here
          # if you ever need to roll back (and disabling Image Updater for
          # this image temporarily).
          image: ghcr.io/giganticminecraft/seichi-game-data-publisher:master@sha256:4212eb06d8eae390c77c6436b09421f17912449fa55c07092e52be5a0cf5027d
          imagePullPolicy: Always
          name: seichi-game-data-publisher-server
          ports:
            - containerPort: 80
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
