apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seichi-game-data-publisher-server
  name: seichi-game-data-publisher-server
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # ステートレスなので 2 replica にし、ノード再起動 (kured) やロールアウト中も 1 台は残す。
  # PDB (pdb.yaml) と組み合わせて drain 時も最低 1 台を維持する
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: seichi-game-data-publisher-server
  template:
    metadata:
      labels:
        app: seichi-game-data-publisher-server
    spec:
      # preStop 5 秒 + アプリ側の pre-drain 5 秒 + drain 最大 15 秒 = 25 秒に
      # 余裕を足して 40 秒にする
      terminationGracePeriodSeconds: 40
      # 2 replica を別ノードに分散させる。空きが無いときは同じノードでも起動させる
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seichi-game-data-publisher-server
      containers:
        - resources:
            # Bumped from 50m to 300m to absorb the OTel exporter and
            # pprof-rs profiler overhead; the previous 50m limit caused 90%+
            # CFS throttling even with avg CPU usage <10m.
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 300m
              memory: 768Mi

          # root で port 80 に bind するため、drop ALL の後に NET_BIND_SERVICE だけ戻す。
          # ルートファイルシステムは読み取り専用にし、書き込みが要る /tmp だけ emptyDir を使う
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          envFrom:
            - configMapRef:
                name: seichi-game-data-publisher-server

          # Track the rolling :master tag so Argo Image Updater can swap
          # digests in. Per-commit pinning happens by setting a sha- tag here
          # if you ever need to roll back (and disabling Image Updater for
          # this image temporarily).
          image: ghcr.io/giganticminecraft/seichi-game-data-publisher:master@sha256:3303142e3eebca574786b02656f93bd5994e0d37d600ede8eca9567ce2b6e827
          imagePullPolicy: Always
          name: seichi-game-data-publisher-server
          ports:
            - containerPort: 80
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          # アプリ側にも SIGTERM 後に 5 秒待つ pre-drain があり待ち時間は重複するが、
          # アプリの値を将来変えても k8s 側で猶予を担保できるよう preStop も付ける
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            tcpSocket:
              port: 80
            # 最大30秒待つ
            failureThreshold: 6
            periodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # pyroscope-rs のプロファイラが /tmp に一時ファイルを作る。/tmp が書けないと
        # 起動時に "create profiler error" で終了するため、読み取り専用の
        # ルートファイルシステムの代わりに書き込める /tmp を与える。
        # medium: Memory (tmpfs) はコンテナのメモリ使用量に計上される。一時ファイルは小さいが、
        # sizeLimit (64Mi) を超えると kubelet が Pod を evict する
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
