apiVersion: v1
kind: ConfigMap
metadata:
  name: seichi-game-data-publisher-server
data:
  # Expect game-data-server service to be in the same namespace
  GAME_DATA_SERVER_GRPC_ENDPOINT_URL: "http://seichi-game-data-server:80"
  # sqlx::query=debug は外した (publisher は DB に触らない)
  RUST_LOG: "info"
  RUST_BACKTRACE: "1"

  # OpenTelemetry: traces and metrics are pushed to the cluster's Alloy
  # receiver, which fans out to Tempo / Mimir. Logs are not exported over OTLP;
  # the JSON lines on stdout (with trace_id / span_id) are collected as pod
  # logs. Disabling the exporter is as simple as removing
  # OTEL_EXPORTER_OTLP_ENDPOINT. service.version defaults to the git commit
  # compiled into the binary; set SERVICE_VERSION to override it.
  OTEL_SERVICE_NAME: "seichi-game-data-publisher"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "parentbased_always_on"
  # OTEL_RESOURCE_ATTRIBUTES は Pod 名 (downward API) を埋め込むため deployment.yaml の env にある

  # Continuous profiler push target. Unset to disable.
  PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.monitoring.svc.cluster.local:4040"
  PYROSCOPE_APPLICATION_NAME: "seichi-game-data-publisher"
