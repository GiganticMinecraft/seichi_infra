# Redmine の issue を SeichiPortal へ移行する一回限りの Job。
#
# 初回 merge では ArgoCD の Skip により作成されない。DB 復元、事前 data migration、plan の確認後、
# この annotation を削除する変更を merge して初めて import Job を作成すること。plan／verify は同じ
# Application に含まれるが、各 overlay の Skip を Git change で削除するまで作成されない。
apiVersion: batch/v1
kind: Job
metadata:
  name: seichi-portal-redmine-importer
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-redmine-importer
  annotations:
    argocd.argoproj.io/sync-options: Skip
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: seichi-portal-redmine-importer
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redmine-importer
          image: ghcr.io/giganticminecraft/seichi-portal-redmine-importer:971557d4780a4a826092842cfcb5a37233b1291b@sha256:d769358a1dba7fa66fd7a2b1fff2d41ce70b79c9d2f2b3677064163beb4a4d46
          args: ["import"]
          env:
            - name: MYSQL_DATABASE
              value: seichi-portal
            - name: MYSQL_USER
              value: seichi-portal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-db-credentials
                  key: password
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_PORT
              value: "3306"
            - name: PORTAL_BASE_URL
              value: http://seichi-portal-backend/api/v1
            - name: PORTAL_API_SESSION_ID
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-redmine-importer-credentials
                  key: PORTAL_API_SESSION_ID
            - name: REDMINE_BASE_URL
              value: https://redmine.seichi.click
            - name: REDMINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-redmine-importer-credentials
                  key: REDMINE_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
