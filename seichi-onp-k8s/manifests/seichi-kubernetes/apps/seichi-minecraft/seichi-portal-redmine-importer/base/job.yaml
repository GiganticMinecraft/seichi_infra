# Redmine の issue を SeichiPortal へ移行する一回限りの Job。
#
# 初回 merge では ArgoCD の Skip により作成されない。DB 復元、事前 data migration、plan の確認後、
# この annotation を削除する変更を merge して初めて import Job を作成すること。plan／verify は同じ
# Application に含まれるが、各 overlay の Skip を Git change で削除するまで作成されない。
apiVersion: batch/v1
kind: Job
metadata:
  name: seichi-portal-redmine-importer
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-redmine-importer
  annotations:
    argocd.argoproj.io/sync-options: Skip
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app: seichi-portal-redmine-importer
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redmine-importer
          image: ghcr.io/giganticminecraft/seichi-portal-redmine-importer:069a320084287ba21fc39879e831d32784860b72@sha256:04612641fa71d065fb465b2bfa3cf34b25e83cf07327e75e3c8b854c6f783632
          args: ["import"]
          env:
            - name: MYSQL_DATABASE
              value: seichi-portal
            - name: MYSQL_USER
              value: seichi-portal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-db-credentials
                  key: password
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_PORT
              value: "3306"
            - name: S3_ENDPOINT
              value: http://garage.garage.svc.cluster.local:3900
            - name: S3_BUCKET
              value: seichi-portal
            - name: S3_REGION
              value: seichi-cloud
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDMINE_BASE_URL
              value: https://redmine.seichi.click
            - name: REDMINE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-redmine-importer-credentials
                  key: REDMINE_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
