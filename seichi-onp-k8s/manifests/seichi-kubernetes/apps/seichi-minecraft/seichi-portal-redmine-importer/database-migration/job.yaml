# Portal DB の schema migration 後に、Redmine importer が参照する初期データを一度だけ投入する Job。
#
# 初回 merge では ArgoCD の Skip により実行されない。DB の schema と Secret を確認した後、
# この Job／NetworkPolicy／ConfigMap の Skip を削除する変更を merge して実行すること。
apiVersion: batch/v1
kind: Job
metadata:
  name: seichi-portal-pre-redmine-migration
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-pre-redmine-migration
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: seichi-portal-pre-redmine-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb-client
          image: docker-registry1.mariadb.com/library/mariadb:11.8@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              export MYSQL_PWD="${MYSQL_PASSWORD}"
              mariadb_args="
                --protocol=TCP
                --host=${MYSQL_HOST}
                --port=${MYSQL_PORT}
                --user=${MYSQL_USER}
                --database=${MYSQL_DATABASE}
              "

              schema_table_count() {
                # mariadb_args is intentionally split into separate client options.
                # shellcheck disable=SC2086
                mariadb ${mariadb_args} \
                  --batch \
                  --skip-column-names \
                  -e "
                    SELECT COUNT(*)
                    FROM information_schema.tables
                    WHERE table_schema = DATABASE()
                      AND table_name IN (
                        'users',
                        'form_meta_data',
                        'form_questions',
                        'form_choices',
                        'label_for_form_answers',
                        'form_discord_webhooks',
                        'global_discord_webhook_settings'
                      );
                  " 2>/dev/null
              }

              schema_check_attempt=0
              printf '%s\n' 'migration: waiting for Portal schema (7 tables required)'
              while :; do
                schema_check_attempt=$((schema_check_attempt + 1))
                if table_count="$(schema_table_count)"; then
                  if [ "${table_count}" = "7" ]; then
                    printf '%s\n' 'migration: Portal schema is ready (7/7 tables)'
                    break
                  fi
                  if [ $((schema_check_attempt % 6)) -eq 1 ]; then
                    printf 'migration: Portal schema is not ready (%s/7 tables, check %s); retrying\n' \
                      "${table_count}" "${schema_check_attempt}"
                  fi
                elif [ $((schema_check_attempt % 6)) -eq 1 ]; then
                  printf 'migration: unable to read Portal schema (check %s); retrying\n' \
                    "${schema_check_attempt}"
                fi
                sleep 5
              done

              printf '%s\n' 'migration: applying seed SQL'
              # mariadb_args is intentionally split into separate client options.
              # shellcheck disable=SC2086
              if mariadb ${mariadb_args} \
                --batch \
                --skip-column-names \
                < /migration/001-pre-redmine-seed.sql; then
                printf '%s\n' 'migration: seed SQL applied successfully'
              else
                mariadb_exit_status=$?
                printf 'migration: seed SQL failed (exit status %s)\n' "${mariadb_exit_status}" >&2
                exit "${mariadb_exit_status}"
              fi
              unset MYSQL_PWD
          env:
            - name: MYSQL_DATABASE
              value: seichi-portal
            - name: MYSQL_USER
              value: seichi-portal
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-db-credentials
                  key: password
            - name: MYSQL_HOST
              value: mariadb
            - name: MYSQL_PORT
              value: "3306"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: migration
          configMap:
            name: seichi-portal-pre-redmine-migration-sql
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
