apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seichi-minecraft

resources:
  - job.yaml
  - network-policy.yaml

configMapGenerator:
  - name: seichi-portal-pre-redmine-migration-sql
    files:
      - 001-pre-redmine-seed.sql

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
