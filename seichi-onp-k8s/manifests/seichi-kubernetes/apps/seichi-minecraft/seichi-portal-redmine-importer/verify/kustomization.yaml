apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seichi-minecraft

nameSuffix: -verify

resources:
  - ../base

# 初回 merge では base から Skip を継承する。import 完了後に、Job と CiliumNetworkPolicy の Skip を
# 削除する Git change をこの overlay に追加して ArgoCD で同期する。
patches:
  - target:
      group: batch
      version: v1
      kind: Job
      name: seichi-portal-redmine-importer
    patch: |-
      - op: replace
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "3"
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["verify"]
