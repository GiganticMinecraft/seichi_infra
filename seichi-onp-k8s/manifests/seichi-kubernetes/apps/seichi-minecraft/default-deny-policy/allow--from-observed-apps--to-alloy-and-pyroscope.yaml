# 観測対象アプリが monitoring namespace の受け口へテレメトリを送るための egress 許可。
#   - alloy-receiver 4318/TCP: OTLP HTTP (gachadata-server, seichi-game-data-server,
#     seichi-game-data-publisher-server, conifers ingestor。portal は既存の
#     allow--from-seichi-portal--to-alloy-receiver.yaml が担う)
#   - pyroscope 4040/TCP: 継続プロファイリングの push
#     (portal backend/frontend, gachadata-server, conifers ingestor,
#     seichi-game-data-server, seichi-game-data-publisher-server)
# seichi-timed-stats-conifers-ingestor のラベルは migration Job (PreSync hook) にも付いている
# (mariadb への通信条件を揃えるため) ので、migration の Pod もこの許可の対象になる。
# 対象アプリを増やすときは seichi-minecraft 側 (egress) と monitoring 側 (ingress) の
# 両方のリストを揃えて更新すること。
# 対になる monitoring 側の ingress 許可は
# apps/cluster-wide-apps/monitoring-default-deny-policy/ にある。
# 注意: 現状の default-deny は明示 Deny (ingressDeny/egressDeny) 方式のため、
# policyAuditMode を解除するとこの allow ごと無効化される。解除前に
# deny 方式の変換が必要 (#5672)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-observed-apps--to-alloy-receiver
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gachadata-server
          - seichi-game-data-server
          - seichi-game-data-publisher-server
          - seichi-timed-stats-conifers-ingestor
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy-receiver
            app.kubernetes.io/instance: k8s-monitoring-alloy-receiver
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-observed-apps--to-pyroscope
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - seichi-portal-backend
          - seichi-portal-frontend
          - gachadata-server
          - seichi-timed-stats-conifers-ingestor
          - seichi-game-data-server
          - seichi-game-data-publisher-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: pyroscope
            app.kubernetes.io/instance: pyroscope
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
---
# Debezium Server (OpenTelemetry Java Agent) が CDC のメトリクスと publish span を
# OTLP HTTP で送るための egress 許可
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-seichi-portal-debezium--to-alloy-receiver
spec:
  endpointSelector:
    matchLabels:
      app: seichi-portal-debezium
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alloy-receiver
            app.kubernetes.io/instance: k8s-monitoring-alloy-receiver
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
