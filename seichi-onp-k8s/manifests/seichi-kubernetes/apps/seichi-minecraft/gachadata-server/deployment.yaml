apiVersion: apps/v1
kind: Deployment
metadata:
  name: gachadata-server
  namespace: seichi-minecraft
  labels:
    app: gachadata-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gachadata-server
  template:
    metadata:
      labels:
        app: gachadata-server
      annotations:
        resource.opentelemetry.io/service.name: gachadata-server
    spec:
      # 既定値と同じ 30 秒を明示する (SIGTERM 後の猶予。挙動は変わらない)
      terminationGracePeriodSeconds: 30
      containers:
        - name: gachadata-server
          image: ghcr.io/giganticminecraft/gachadata-server:sha-80e3110@sha256:c9897f29a276420af088c38844ceb351aadc3660ff2c17273e74f5e3b1a9d80a
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # health エンドポイントが無いため、listener (HTTP_PORT=80) の有無だけを
          # tcpSocket で見る。DB 接続より前に bind するので、DB 障害では落ちない。
          # tcpSocket はプロセスのハング (accept しない状態) までは検知できない。
          # startupProbe は seichi-game-data-* と同じ最大 30 秒
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            # OTel exporter / Pyroscope サンプリングのオーバーヘッド吸収のため増強
            # (seichi-game-data-publisher / seichi-portal-backend が exporter 導入時に
            # 300m へ増強した実績に倣う)
            limits:
              cpu: 300m
              memory: 128Mi
          # root で port 80 に bind するため、drop ALL の後に NET_BIND_SERVICE だけ戻す。
          # ルートファイルシステムは読み取り専用にし、書き込みが要る /tmp だけ emptyDir を使う
          # (mariadb-dump はファイルに書かないため追加の書き込み先は不要)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MYSQL_USER
              value: mcserver
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mcserver-password
            - name: MYSQL_HOST
              value: "mariadb"
            - name: MYSQL_PORT
              value: "3306"
            - name: HTTP_PORT
              value: "80"
            # ---- 観測 (gachadata-server#239 の OTel + Pyroscope 対応イメージで有効化) ----
            # 旧イメージはこれらの env を読まないため、先にマージしても無害
            - name: ENV_NAME
              value: production
            - name: OTEL_SERVICE_NAME
              value: "gachadata-server"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,deployment.environment.name=production"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "gachadata-server"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # pyroscope-rs のプロファイラが /tmp に一時ファイルを作る。/tmp が書けないと
        # 起動はするがプロファイラが黙って無効になるため、読み取り専用の
        # ルートファイルシステムの代わりに書き込める /tmp を与える。
        # medium: Memory (tmpfs) はコンテナのメモリ使用量に計上される。一時ファイルは小さいが、
        # sizeLimit (64Mi) を超えると kubelet が Pod を evict する
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
