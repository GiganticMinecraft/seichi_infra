apiVersion: apps/v1
kind: Deployment
metadata:
  name: gachadata-server
  namespace: seichi-minecraft
  labels:
    app: gachadata-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gachadata-server
  template:
    metadata:
      labels:
        app: gachadata-server
      annotations:
        resource.opentelemetry.io/service.name: gachadata-server
    spec:
      # preStop 5 秒 + 処理中リクエストの drain (axum の graceful shutdown。アプリ側で
      # 20 秒で打ち切る: gachadata-server#268 の DRAIN_TIMEOUT) + Pyroscope 停止・OTel flush
      # (合計 15 秒を見込む) で 40 秒にする。DRAIN_TIMEOUT はこの値から逆算しているので、
      # 変えるときはアプリ側も揃える。
      # キャッシュミス時の mariadb-dump (最大 120 秒) を待ち切る長さにはしない。
      # その場合は SIGKILL でリクエストが切れ、クライアント側の再試行に任せる
      terminationGracePeriodSeconds: 40
      containers:
        - name: gachadata-server
          image: ghcr.io/giganticminecraft/gachadata-server:latest@sha256:3efb3566dbc400b9c59cb37a0d22a0fe2a2189c88888a1167f343f883251ccdd
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # health エンドポイントが無いため、listener (HTTP_PORT=80) の有無だけを
          # tcpSocket で見る。DB 接続より前に bind するので、DB 障害では落ちない。
          # tcpSocket はプロセスのハング (accept しない状態) までは検知できない。
          # startupProbe は seichi-game-data-* と同じ最大 30 秒
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            # OTel exporter / Pyroscope サンプリングのオーバーヘッド吸収のため増強
            # (seichi-game-data-publisher / seichi-portal-backend が exporter 導入時に
            # 300m へ増強した実績に倣う)
            limits:
              cpu: 300m
              memory: 128Mi
          # root で port 80 に bind するため、drop ALL の後に NET_BIND_SERVICE だけ戻す。
          # ルートファイルシステムは読み取り専用にし、書き込みが要る /tmp だけ emptyDir を使う
          # (mariadb-dump はファイルに書かないため追加の書き込み先は不要)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MYSQL_USER
              value: mcserver
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: mcserver-password
            - name: MYSQL_HOST
              value: "mariadb"
            - name: MYSQL_PORT
              value: "3306"
            - name: HTTP_PORT
              value: "80"
            # ---- 観測 (gachadata-server#239 の OTel + Pyroscope 対応イメージで有効化) ----
            # 旧イメージはこれらの env を読まないため、先にマージしても無害
            - name: ENV_NAME
              value: production
            - name: OTEL_SERVICE_NAME
              value: "gachadata-server"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            # service.instance.id が無いと OTLP メトリクスに instance ラベルが付かず、
            # 複数 replica (と rollout 中の新旧 Pod) の累積値が同じ series に交互に
            # 書かれて resets() / increase() が壊れる。Pod 名を instance にする。
            # $(POD_NAME) は先に定義した env しか展開されないため、この順序を保つ
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,deployment.environment.name=production,service.instance.id=$(POD_NAME)"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "gachadata-server"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # pyroscope-rs のプロファイラが /tmp に一時ファイルを作る。/tmp が書けないと
        # 起動はするがプロファイラが黙って無効になるため、読み取り専用の
        # ルートファイルシステムの代わりに書き込める /tmp を与える。
        # 他の Rust サービスと違い memory limit が 128Mi と小さく、tmpfs (medium: Memory) だと
        # /tmp の使用量がメモリ limit に計上されて OOM kill を招き得るため、ノードのディスクを使う。
        # 一時ファイルは小さいが、sizeLimit (64Mi) を超えると kubelet が Pod を evict する
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
