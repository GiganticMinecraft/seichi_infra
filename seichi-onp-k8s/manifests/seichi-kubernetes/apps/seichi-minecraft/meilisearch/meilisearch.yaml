apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seichi-portal-meilisearch
  namespace: argocd
spec:
  project: seichi-minecraft
  source:
    chart: meilisearch
    repoURL: 'https://meilisearch.github.io/meilisearch-kubernetes'
    targetRevision: 0.42.0
    helm:
      releaseName: seichi-portal-meilisearch
      values: |
        # image は chart の既定値 (appVersion) に従わせる。chart の更新 PR がそのままエンジンの更新になる。
        auth:
          existingMasterKeySecret: seichi-portal-meilisearch-master-key
        environment:
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
          # Meilisearch の DB はバージョン固定で、image を上げただけだと起動時に VersionMismatch で落ちる。
          # DB とバイナリのバージョンが違うときだけ起動時に in-place で移行し、一致していれば何もしないので常設する。
          MEILI_UPGRADE_DB: "true"
        persistence:
          enabled: true
          size: 10Gi
        # 起動時の DB 移行は tasks DB (1GiB 超) の走査を含み、chart 既定の 60 秒では足りなくなり得る。
        startupProbe:
          failureThreshold: 300
        resources:
          # Redmine 移行後の大量同期を処理できるよう、一時的に余裕を持たせる。
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
  destination:
    server: https://kubernetes.default.svc
    namespace: seichi-minecraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
