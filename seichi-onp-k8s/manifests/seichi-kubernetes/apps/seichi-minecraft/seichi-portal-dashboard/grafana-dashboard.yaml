# seichi-portal の総合ダッシュボード。
# 処理の起点 (seichi_portal.flow: user / cdc / notification / scheduled) ごとに行を分けている。
# 生成元の考え方: HTTP の RED は Tempo span-metrics、CDC は Debezium (OTel Java Agent) /
# RabbitMQ (rabbitmq_prometheus) / backend (OTLP) のメトリクス、ブラウザは Faro (Loki)、
# トレース一覧は Tempo (TraceQL) から引く。
apiVersion: v1
kind: ConfigMap
metadata:
  name: seichi-portal-dashboard
  namespace: seichi-minecraft
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Seichi Portal"
data:
  seichi-portal.json: |
    {
      "uid": "seichi-portal-overview",
      "title": "Seichi Portal",
      "description": "seichi-portal (frontend / backend / CDC パイプライン) の性能と健全性。debezium の instance は Pod 名ではなく JVM 起動ごとのランダムな UUID (OTel Java Agent が付ける)。検証用の scratch namespace の Pod が同じ job で現れることがある",
      "tags": [
        "seichi-portal"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "概要",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "text",
          "id": 2,
          "gridPos": {
            "h": 2,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "options": {
            "mode": "markdown",
            "content": "seichi-portal の処理は起点ごとに 4 種類の流れに分かれ、backend の入口 span に `seichi_portal.flow` 属性が付く。 **user**: 利用者の操作 (ブラウザ → frontend → backend) / **cdc**: MariaDB の変更を検索に反映 (Debezium → RabbitMQ → backend → Meilisearch) / **notification**: 操作を受けた Discord 通知 / **scheduled**: 検索インデックスの定期チェック。 各流れのトレースは下の行から Tempo で開け、ログ行の trace ID からも同じトレースに飛べる。"
          },
          "transparent": true
        },
        {
          "type": "stat",
          "title": "backend リクエスト/s",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "PBFA97CFB590B2093"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 3
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "PBFA97CFB590B2093"
              },
              "expr": "sum(rate(traces_spanmetrics_calls_total{service=\"seichi-portal-backend\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
              "refId": "A",
              "legendFormat": "",
              "range": true,
              "exemplar": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
