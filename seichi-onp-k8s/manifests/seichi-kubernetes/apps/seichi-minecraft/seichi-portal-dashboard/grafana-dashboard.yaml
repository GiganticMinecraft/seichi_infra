                "indexByName": {
                  "k8s_pod_name": 0,
                  "service_version": 1,
                  "k8s_pod_start_time": 2,
                  "k8s_node_name": 3
                },
                "renameByName": {
                  "service_version": "バージョン",
                  "k8s_pod_name": "Pod",
