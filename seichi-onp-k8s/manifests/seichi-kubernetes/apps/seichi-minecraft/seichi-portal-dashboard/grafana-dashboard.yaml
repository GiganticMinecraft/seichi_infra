          "description": "OTLP の target_info (service.version / service.instance.id) から。OTLP の series には staleness marker が無いため、削除された Pod も約 5 分は残り、ローリング更新の直後は新旧 ReplicaSet の Pod が並ぶことがある。debezium の instance は Pod 名ではなく JVM 起動ごとのランダムな UUID で、OTel Java Agent は service.version を付けないのでバージョンは空欄。seichi-minecraft namespace のみ (scratch 検証 Pod は除外)"
