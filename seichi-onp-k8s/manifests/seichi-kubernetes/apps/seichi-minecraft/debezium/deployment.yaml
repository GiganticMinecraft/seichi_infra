apiVersion: apps/v1
kind: Deployment
metadata:
  name: seichi-portal-debezium
  namespace: seichi-minecraft
  labels:
    app: seichi-portal-debezium
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seichi-portal-debezium
  template:
    metadata:
      labels:
        app: seichi-portal-debezium
    spec:
      securityContext:
        fsGroup: 185
      containers:
        - name: debezium
          image: quay.io/debezium/server:3.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEBEZIUM_SINK_RABBITMQ_CONNECTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seichi-portal-rabbitmq-credentials
                  key: password
            - name: DEBEZIUM_SOURCE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-db-credentials
                  key: password
            # イメージ同梱の OpenTelemetry Java Agent (lib_metrics/enable_otel_agent.sh) を有効化する。
            # - metrics: config/debezium-jmx-config.yaml の JMX Metric Insight で Debezium の
            #   connector-metrics (binlog からの遅延、イベント数、内部キュー残量) と JVM を OTLP で送る
            # - traces: amqp-client 計装が RabbitMQ への publish を PRODUCER span にし、AMQP ヘッダへ
            #   traceparent を載せる。seichi-portal-backend の CDC consumer がこれを親にして trace がつながる
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SDK_DISABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: "seichi-portal-debezium"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
            # ログは Pod ログ経由で Loki に入っているので二重送信しない
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "30000"
            # CDC の観測に必要なのは amqp-client (publish span + traceparent 注入) と JMX のみ。
            # vertx / netty は probe (/q/health/*) の SERVER span、jdbc は Debezium が数秒おきに
            # 発行する内部クエリの root span になりノイズなので切る
            - name: OTEL_INSTRUMENTATION_VERTX_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_NETTY_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_JDBC_ENABLED
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=seichi-portal,deployment.environment=production,deployment.environment.name=production"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            # Java Agent の分 (metaspace / 計装クラス) を見込んで limit を上げる。導入前の実使用は ~460Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /debezium/config/application.properties
              subPath: application.properties
            - name: data
              mountPath: /debezium/data
      volumes:
        - name: config
          configMap:
            name: seichi-portal-debezium-config
        - name: data
          persistentVolumeClaim:
            claimName: seichi-portal-debezium-data
