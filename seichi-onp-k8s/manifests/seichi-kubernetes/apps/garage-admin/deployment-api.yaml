apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-admin-api
  labels:
    app: garage-admin-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: garage-admin-api
  template:
    metadata:
      labels:
        app: garage-admin-api
    spec:
      # SIGTERM 後の猶予。アプリ (Go の http.ListenAndServe) はシグナルを処理せず SIGTERM で
      # すぐ終了するため 30 秒 (既定値) で足りる。preStop は Endpoint 反映までの取りこぼしを
      # 防ぐだけで、SIGTERM 時点で処理中のリクエストと未送信のテレメトリは失われる
      terminationGracePeriodSeconds: 30
      containers:
        - name: garage-admin-api
          image: ghcr.io/giganticminecraft/garage-admin-console-backend:sha-a7b56f5@sha256:5d533bd1a977081e96cadd0721ad51c07bbe9a221856dea7641638aa56012738
          ports:
            - containerPort: 8080
          # ファイルに書き込まないため、ルートファイルシステムは読み取り専用にする
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GARAGE_ADMIN_ENDPOINT
              value: "http://garage-metrics.garage.svc.cluster.local:3903"
            - name: GARAGE_S3_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: GARAGE_S3_REGION
              value: "seichi-cloud"
            - name: BASE_URL
              value: "https://garage-admin.onp.admin.seichi.click"
            - name: GITHUB_ORG
              value: "GiganticMinecraft"
            - name: GITHUB_TEAM_SLUG
              value: "onp-admin-grafana"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin-token
                  key: GARAGE_ADMIN_TOKEN
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: GITHUB_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: SESSION_SECRET
            - name: GARAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-admin-s3
                  key: AWS_ACCESS_KEY_ID
            - name: GARAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-admin-s3
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
      # イメージは distroless static nonroot (USER 65532)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
