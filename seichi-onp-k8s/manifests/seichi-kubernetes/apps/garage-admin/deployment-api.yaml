apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-admin-api
  labels:
    app: garage-admin-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: garage-admin-api
  template:
    metadata:
      labels:
        app: garage-admin-api
    spec:
      # SIGTERM 後の猶予。アプリ (garage-admin-console#422 以降) は SIGTERM で listener を
      # 閉じ、処理中のリクエストを最大 15 秒待ち (超過分は切断後 2 秒待つ)、OTel と Pyroscope を
      # 並行して最大 4 秒で flush してから終了する (合計 21 秒)。preStop 5 秒と合わせて 26 秒 < 30 秒
      terminationGracePeriodSeconds: 30
      containers:
        - name: garage-admin-api
          # GiganticMinecraft/garage-admin-console の CI (.github/workflows/backend.yaml) が
          # main への push ごとに :latest を上書き push する。Renovate (pinDigests) が
          # :latest の digest の変化を検知して更新 PR を出す。特定コミットに固定して
          # ロールバックしたいときは sha-<commit> タグの digest を指定する
          image: ghcr.io/giganticminecraft/garage-admin-console-backend:latest@sha256:fdb5397da5311c7d1e1145e129dd7be3a5d1f7225cabae9b6b496a19a10a7015
          ports:
            - containerPort: 8080
          # ファイルに書き込まないため、ルートファイルシステムは読み取り専用にする
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GARAGE_ADMIN_ENDPOINT
              value: "http://garage-metrics.garage.svc.cluster.local:3903"
            - name: GARAGE_S3_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: GARAGE_S3_REGION
              value: "seichi-cloud"
            - name: BASE_URL
              value: "https://garage-admin.onp.admin.seichi.click"
            - name: GITHUB_ORG
              value: "GiganticMinecraft"
            - name: GITHUB_TEAM_SLUG
              value: "onp-admin-grafana"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4318"
            # $(POD_NAME) で参照するため OTEL_RESOURCE_ATTRIBUTES より前に定義する
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # PYROSCOPE_APPLICATION_NAME と揃えて traces と profiles を突き合わせられるようにする
            - name: OTEL_SERVICE_NAME
              value: "garage-admin-console"
            # service.version はアプリ側 (garage-admin-console#423 以降) がイメージビルド時の
            # コミット SHA を埋め込む。
            # service.instance.id が無いと OTLP メトリクスに instance ラベルが付かず、rollout 中の
            # 新旧 Pod の累積値が同じ series に交互に書かれて resets() / increase() が壊れるため、
            # Pod 名を instance にする
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,deployment.environment.name=production,k8s.pod.name=$(POD_NAME),service.instance.id=$(POD_NAME)"
            # 継続プロファイリングの push 先 (garage-admin-console#423)。未設定なら無効。
            # アプリ名は OTEL_SERVICE_NAME に揃える
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: PYROSCOPE_APPLICATION_NAME
              value: "garage-admin-console"
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-admin-token
                  key: GARAGE_ADMIN_TOKEN
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: GITHUB_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: garage-admin-github-oauth
                  key: SESSION_SECRET
            - name: GARAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-admin-s3
                  key: AWS_ACCESS_KEY_ID
            - name: GARAGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-admin-s3
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
      # イメージは distroless static nonroot (USER 65532)
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
