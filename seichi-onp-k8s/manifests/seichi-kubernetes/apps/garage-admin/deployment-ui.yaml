apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-admin-ui
  labels:
    app: garage-admin-ui
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: garage-admin-ui
  template:
    metadata:
      labels:
        app: garage-admin-ui
    spec:
      # SIGTERM 後の猶予。公式 nginx イメージの STOPSIGNAL は SIGQUIT (graceful shutdown) で、
      # 処理中のリクエストは短いため preStop の 5 秒を含めても 30 秒 (既定値) で足りる
      terminationGracePeriodSeconds: 30
      containers:
        - name: garage-admin-ui
          # GiganticMinecraft/garage-admin-console の CI (.github/workflows/frontend.yaml) が
          # main への push ごとに :latest を上書き push する。Renovate (pinDigests) が
          # :latest の digest の変化を検知して更新 PR を出す。特定コミットに固定して
          # ロールバックしたいときは sha-<commit> タグの digest を指定する
          image: ghcr.io/giganticminecraft/garage-admin-console-frontend:latest@sha256:fcc775fa79b65d48d9b499f795ee3f4ba1b1e813fbfb7c49d39fd02a7842290d
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # 公式 nginx イメージは master が root で起動し、worker を nginx (101) に
          # setuid/setgid する。master は temp/cache ディレクトリを mkdir して worker に chown する。
          # このため drop ALL の後に NET_BIND_SERVICE (port 80)、SETUID/SETGID (worker の降格)、
          # CHOWN (temp/cache の chown) を戻す。ローカルの container ランタイムで、
          # どれか 1 つでも欠けると起動に失敗することを確認済み。
          # ルートファイルシステムは読み取り専用にし、書き込み先は emptyDir にする (volumes 参照)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - CHOWN
                - SETUID
                - SETGID
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
          # Pod の削除が始まっても、Service の Endpoint から外れたことが各ノードの
          # ロードバランサ (Cilium) に反映されるまでは新しいリクエストが届き得る。
          # その間に SIGTERM でプロセスが止まって接続を落とさないよう、SIGTERM の前に 5 秒待つ。
          # distroless などシェルの無いイメージでも使えるよう exec ではなく sleep アクションを使う
          # (preStop の時間は terminationGracePeriodSeconds に含まれる)
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            tcpSocket:
              port: 80
            failureThreshold: 6
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # 読み取り専用のルートファイルシステムで nginx が書き込む先。
        # /var/cache/nginx は client_temp などの一時ディレクトリ (proxy_cache は使っていない)、
        # /run は nginx.pid (/var/run は /run への symlink)。
        # sizeLimit を超えると kubelet が Pod を evict する。/api/ は client_max_body_size 100m で
        # アップロード本体を client_temp に、大きなダウンロードを proxy_temp (既定で最大 1024m) に
        # 書き出すため、ノードのディスクを使い 2Gi まで許す
        - name: nginx-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: nginx-conf
          configMap:
            name: garage-admin-ui-nginx-conf
