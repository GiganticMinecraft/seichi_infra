apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: ns-transformer
      namespace: seichi-debug-gateway
    unsetOnly: true

resources:
  - ../../../app-templates/minecraft-gateway-bungeecord
  - ./bungeecord-config.yaml
  - ./bungeesemaphore-valkey.yaml
  - ./redisbungee-valkey.yaml
  - ./network-policy.yaml

patches:
  # テンプレートの request 768Mi はヒープ (-Xmx768m) と同値で、JVM 全体では常時
  # 1.0Gi 強 (2026-10 時点の実測ピーク 1056Mi) を使うため request を実態に合わせる
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1280Mi
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bungeecord
  - path: bungeecord-metrics-patch.yaml
  - path: bungeecord-plugin-configs-patch.yaml
  - path: service-bungeecord-loadbalancer.yaml
