# Kubernetes コンポーネントの KBOM を作って脆弱性を照合する。結果は 1 件 1 行の JSON で
# 標準出力に出し、Alloy が Loki に送る ({job="trivy-operator/kbom"})。
# 実測 (2026-10-23): 6 秒、94 コンポーネント、MEDIUM 以上 2 件 (どちらも修正版なし)。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-kbom
spec:
  # 毎日 05:30 JST (seichi-minecraft の sync window 07:00-08:00 を避ける)
  schedule: "30 5 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trivy-kbom
        spec:
          serviceAccountName: trivy-kbom
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kbom
              # Renovate (kubernetes manager) がタグを追従する。Trivy Operator 側の Trivy はチャートの
              # 既定値 (trivy.image.tag) に従うので一時的にずれることはあるが、どちらも同じ trivy-db:2 を読む
              image: mirror.gcr.io/aquasec/trivy:0.75.0
              command: ["/bin/sh", "/scripts/kbom.sh"]
              env:
                # 脆弱性の照合は Trivy Operator の trivy-server (builtInTrivyServer) に任せる
                - name: TRIVY_SERVER
                  value: http://trivy-service.trivy-operator:4954
                - name: TRIVY_SEVERITY
                  value: MEDIUM,HIGH,CRITICAL
              # memory.peak は DB を書く emptyDir のページキャッシュ込みで 1Gi に張り付いた
              resources:
                # DB は trivy-server 側にあるので、/tmp には KBOM (約 60KB) と k8s 用のキャッシュだけ
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
                  ephemeral-storage: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: trivy-node-scanner-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
