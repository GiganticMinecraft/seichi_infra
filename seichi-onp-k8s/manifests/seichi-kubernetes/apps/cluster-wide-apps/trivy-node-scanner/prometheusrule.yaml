# ノードスキャン (trivy-node-scanner) そのものの故障を Discord に通知する。
# 脆弱性の件数ではアラートしない (トリアージは Grafana の「Trivy - Nodes」で行う)。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-node-scanner-alerts
  labels:
    release: prometheus
spec:
  groups:
    - name: trivy-node-scanner-alerts
      rules:
        - alert: TrivyNodeScanFailing
          # 失敗すると 1 時間後に再試行する。単発の失敗は再試行で解消するので、
          # 再試行 1 回分より長い 2 時間続いたら通知する。
          # よくある原因は脆弱性 DB の取得失敗 (mirror.gcr.io)、OOMKilled、OS を判定できない (マウント不備)。
          expr: |
            (trivy_node_scan_success == 0)
            * on (instance) group_left (nodename) node_uname_info
          for: 2h
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "{{ $labels.nodename }} の OS パッケージスキャンが失敗しています"
            description: "kubectl -n trivy-operator logs -l app.kubernetes.io/name=trivy-node-scanner --prefix で {{ $labels.nodename }} の Pod のログを確認してください。"
        - alert: TrivyNodeScanStale
          # スキャン間隔は 24h (+ 初回のみ最大 1h のずらし)。最終「成功」から 2 日経っていれば、
          # 表示中の件数は古い (失敗が続いている場合も含む)。
          # textfile が無いノード (DaemonSet が載っていない / node-exporter が読めていない) も拾う。
          # 一度は試行して失敗し続けているノードは TrivyNodeScanFailing が拾うので、ここでは除く。
          expr: |
            (time() - trivy_node_last_success_timestamp_seconds > 2 * 86400)
            * on (instance) group_left (nodename) node_uname_info
            or
            (
              node_uname_info
              unless on (instance) trivy_node_last_success_timestamp_seconds
              unless on (instance) trivy_node_scan_success
            )
          for: 3h
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "{{ $labels.nodename }} の OS パッケージスキャン結果が更新されていません"
            description: "trivy-node-scanner の Pod が {{ $labels.nodename }} で動いているか、node-exporter が --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile で起動しているかを確認してください。"
        - alert: TrivyKbomScanMissing
          # Kubernetes コンポーネントの KBOM スキャン (CronJob trivy-kbom、毎日 05:30 JST) が
          # 2 日成功していない。kbom.sh は失敗時に exit 1 するので Job の成否 = スキャンの成否。
          # 一度も成功していない CronJob は作成から 2 日経つまで鳴らさない (導入直後の誤検知を避ける)。
          expr: |
            (time() - kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="trivy-operator", cronjob="trivy-kbom"} > 2 * 86400)
            or
            (
              (time() - kube_cronjob_created{job="kube-state-metrics", namespace="trivy-operator", cronjob="trivy-kbom"} > 2 * 86400)
              unless on (namespace, cronjob)
              kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="trivy-operator", cronjob="trivy-kbom"}
            )
          for: 1h
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: Kubernetes コンポーネントの脆弱性スキャン (KBOM) が 2 日間成功していません
            description: kubectl -n trivy-operator get cronjob trivy-kbom と直近の Job / Pod の状態、Loki の {job="trivy-operator/kbom"} | json | event="trivy_kbom_scan" を確認してください。
