# 各ノードの OS パッケージを trivy rootfs でスキャンする。
#
# ホストのルート全体はマウントしない。OS とパッケージの判定に必要な
# os-release / lsb-release / dpkg データベースだけを読み取り専用でマウントする
# (ルート全体だと containerd のイメージ層まで走査して 512Mi で即 OOMKilled した)。
#
# 脆弱性 DB はクラスタ内の trivy-server を使わず、Pod ごとに取得する (Standalone)。
# 旧カーネルのパッケージが残っているノードでは結果が 6 万件規模になり、
# trivy-server (limit 1Gi) に 2 ノード同時に問い合わせたところ OOMKilled したため。
# DB (約 135MB) は /tmp の emptyDir に置くので、Pod が生きている間は再利用される。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: trivy-node-scanner
  labels:
    app.kubernetes.io/name: trivy-node-scanner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-node-scanner
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trivy-node-scanner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # dpkg データベースの読み取りと、root 所有の textfile ディレクトリへの書き込みのため root。
      # capability は全部落とし、ルートファイルシステムは読み取り専用にする。
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      # control-plane ノードもスキャン対象
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: scanner
          image: mirror.gcr.io/aquasec/trivy:0.75.0
          command: ["/bin/sh", "/scripts/node-scan.sh"]
          env:
            - name: TRIVY_DB_REPOSITORY
              value: mirror.gcr.io/aquasec/trivy-db:2
            # Trivy Operator と同じく MEDIUM 以上・修正版ありのみ
            - name: TRIVY_SEVERITY
              value: MEDIUM,HIGH,CRITICAL
            - name: SCAN_INTERVAL_SECONDS
              value: "86400"
            # 全ノードが同時に DB を取りに行かないよう、初回の開始を最大 1 時間ずらす
            - name: SCAN_JITTER_SECONDS
              value: "3600"
          # 実測 (2026-10-23): 1 ノード 6〜9 秒。memory.peak は DB を書く emptyDir の
          # ページキャッシュ込みで上限まで張り付くが、匿名メモリは 650〜850Mi 程度。
          # スキャン中だけとはいえ requests を大きく下回ると逼迫したノードで他の Pod が
          # evict されうるので、旧カーネルの残骸を消した後の想定 (~500Mi) に合わせる。
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: usr-lib-os-release
              mountPath: /host/usr/lib/os-release
              readOnly: true
            - name: etc-os-release
              mountPath: /host/etc/os-release
              readOnly: true
            # Trivy の Ubuntu 判定は etc/lsb-release を見る (無いと OS が none になり 0 件になる)
            - name: etc-lsb-release
              mountPath: /host/etc/lsb-release
              readOnly: true
            - name: dpkg
              mountPath: /host/var/lib/dpkg
              readOnly: true
            - name: textfile
              mountPath: /textfile
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: usr-lib-os-release
          hostPath:
            path: /usr/lib/os-release
            type: File
        - name: etc-os-release
          hostPath:
            path: /etc/os-release
            type: File
        - name: etc-lsb-release
          hostPath:
            path: /etc/lsb-release
            type: File
        - name: dpkg
          hostPath:
            path: /var/lib/dpkg
            type: Directory
        # node-exporter は --collector.textfile.directory=/host/root/var/lib/node-exporter/textfile
        # (ホストの / を /host/root にマウント済み) でこのディレクトリを読む
        - name: textfile
          hostPath:
            path: /var/lib/node-exporter/textfile
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: trivy-node-scanner-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
