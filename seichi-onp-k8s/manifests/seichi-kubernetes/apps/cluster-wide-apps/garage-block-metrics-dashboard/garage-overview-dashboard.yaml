              "type": "prometheus",
              "uid": "PBFA97CFB590B2093"
            },
            "query": {
              "query": "label_values(block_resync_queue_length{job=\"garage-metrics\"}, pod)",
              "refId": "A"
            },
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2,
            "allValue": ".*"
          },
          {
            "name": "bucket",
            "label": "Bucket",
            "type": "query",
            "description": "トレースのパネルだけに効く。bucket 属性の無い span (認証やパース前に失敗した要求) は含まない",
            "datasource": {
              "type": "tempo",
              "uid": "P214B5B846CF3925F"
            },
            "definition": "bucket",
            "query": {
              "type": 1,
              "label": "bucket",
              "refId": "TempoDatasourceVariableQueryEditor-VariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "sort": 1,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "slow",
            "label": "遅い閾値",
            "type": "custom",
            "description": "遅い S3 API の一覧に効く",
            "query": "100ms,500ms,1s,5s",
            "current": {
              "selected": true,
              "text": "500ms",
              "value": "500ms"
            }
          }
        ]
