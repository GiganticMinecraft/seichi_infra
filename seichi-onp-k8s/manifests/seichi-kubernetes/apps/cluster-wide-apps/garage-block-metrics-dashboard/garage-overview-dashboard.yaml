# Garage の全体像を 1 枚で見るダッシュボード。
# 公式の script/telemetry/grafana-garage-dashboard-prometheus.json (Disk I/O、API 要求/エラー、
# RPC、resync/GC/Merkle キュー、errored blocks) をベースに、このクラスタで問題の切り分けに
# 効いた指標を足している:
#   - S3 / テーブル / ブロックの p99 レイテンシ (2026-10 の Synology → NVMe 移行で 6s → 0.2s)
#   - cluster_* の健全性 stat (ただしネットワーク疎通ベースで、ストレージ障害には反応しない)
#   - meta ボリューム残量 (LMDB は再同期中に 3 倍以上に膨れる)
#   - ブロック削除数 / ブロック参照カウンタ数 (2026-10-19 に repair block-refs で block_ref が
#     誤って消され、ブロックが GC された事故はこの 2 つにしか現れなかった)
#   - トレース (Tempo): バケット別のレイテンシ / リクエスト数、遅い S3 API の一覧、受信側 RPC の p99
# JSON は scratchpad の build_dash.py 相当のスクリプトで生成したもの。手で触る場合は
# Grafana UI で編集 → JSON model をここに貼り戻す。
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Garage"
data:
  garage-overview.json: |
    {
      "uid": "garage-overview",
      "title": "Garage オーバービュー",
      "description": "Garage クラスタの健全性・S3 API・メタデータ(LMDB)・ブロックストア・RPC。公式ダッシュボード (script/telemetry/grafana-garage-dashboard-prometheus.json) をベースに、このクラスタで効いたレイテンシ系の指標を足したもの",
      "tags": [
        "garage",
        "s3",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
