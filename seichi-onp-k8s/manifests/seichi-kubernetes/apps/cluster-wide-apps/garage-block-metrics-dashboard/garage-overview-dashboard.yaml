                  "refId": "A",
                  "queryType": "traceql",
                  "metricsQueryType": "range",
                  "query": "{ resource.service.name = \"garage\" && name =~ \"S3 API .*\" && span.bucket =~ \"${bucket:regex}\" && resource.k8s.pod.name =~ \"${pod:regex}\" } | quantile_over_time(duration, .99) by (span.bucket)"
