# Garage の全体像を 1 枚で見るダッシュボード。
# 公式の script/telemetry/grafana-garage-dashboard-prometheus.json (Disk I/O、API 要求/エラー、
# RPC、resync/GC/Merkle キュー、errored blocks) をベースに、このクラスタで問題の切り分けに
# 効いた指標を足している:
#   - S3 / テーブル / ブロックの p99 レイテンシ (2026-10 の Synology → NVMe 移行で 6s → 0.2s)
#   - cluster_* の健全性 stat (ただしネットワーク疎通ベースで、ストレージ障害には反応しない)
#   - meta ボリューム残量 (LMDB は再同期中に 3 倍以上に膨れる)
# JSON は scratchpad の build_dash.py 相当のスクリプトで生成したもの。手で触る場合は
# Grafana UI で編集 → JSON model をここに貼り戻す。
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Garage"
data:
  garage-overview.json: |
    {
      "uid": "garage-overview",
      "title": "Garage オーバービュー",
      "description": "Garage クラスタの健全性・S3 API・メタデータ(LMDB)・ブロックストア・RPC。公式ダッシュボード (script/telemetry/grafana-garage-dashboard-prometheus.json) をベースに、このクラスタで効いたレイテンシ系の指標を足したもの",
      "tags": [
        "garage",
        "s3",
        "overview"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "PBFA97CFB590B2093"
            },
            "query": {
              "query": "label_values(block_resync_queue_length{job=\"garage-metrics\"}, pod)",
              "refId": "A"
            },
            "multi": true,
            "includeAll": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Garage ブロック管理メトリクス",
          "url": "/d/garage-block-metrics",
          "type": "link",
          "targetBlank": false
        },
        {
          "title": "runbook: meta ボリューム切り替え",
          "url": "https://github.com/GiganticMinecraft/seichi_infra/blob/main/docs/runbooks/garage-meta-volume-migration.md",
          "type": "link",
          "icon": "external link",
          "targetBlank": true
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "クラスタ健全性(ネットワーク疎通ベース。ストレージ障害は 503 とリシンクエラーで見る)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "cluster_healthy",
          "description": "全ストレージノードが相互に接続できているか",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
