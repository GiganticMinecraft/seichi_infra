# seichi-portal-frontend のブラウザ例外通知 (#5612)。
# Faro Web SDK (app.name=seichi-portal-browser) → same-origin /collect rewrite →
# Alloy faro.receiver → Loki。ストリームラベル app_name / kind は faro.receiver の
# extra_log_labels でペイロードから抽出される (k8s-monitoring の alloy-receiver 設定)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules-seichi-portal-browser
  namespace: monitoring
  labels:
    loki_rule: "1"
data:
  seichi-portal-browser.yaml: |
    # Sentry と違い既知/新規イシューの判定はできないため、同じエラーが再発すると
    # repeat_interval ごとに再通知される (この制約は受容済み。#5612)
    groups:
      - name: seichi-portal-browser-exceptions
        interval: 1m
        rules:
          # type (JS の例外クラス名: TypeError 等) ごとに集計して通知する。
          # type の値域はブラウザ組み込み例外クラス + アプリ定義例外程度で
          # 低カーディナリティ。ルール群全体の安全弁は loki の limits_config
          # (ruler_max_rules_per_rule_group / ruler_max_rule_groups_per_tenant)
          - alert: SeichiPortalBrowserException
            expr: |
              sum by (type) (
                count_over_time({app_name="seichi-portal-browser", kind="exception"} | logfmt [10m])
              ) > 0
            labels:
              severity: warning
              notify: discord
              team: portal
              service: seichi-portal-browser
            annotations:
              summary: seichi-portal のブラウザで {{ $labels.type }} が発生しています
              description: 直近 10 分間にブラウザ例外 ({{ $labels.type }}) が記録されました。詳細は Loki で {app_name="seichi-portal-browser", kind="exception"} を実行して確認する。
