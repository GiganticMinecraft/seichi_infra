apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./storageclass.yaml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/v1.3.1/deploy/kubernetes/v1.20/controller.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/v1.3.1/deploy/kubernetes/v1.20/csi-driver.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/v1.3.1/deploy/kubernetes/v1.20/node.yml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/v1.3.1/deploy/kubernetes/v1.20/snapshotter/snapshotter.yaml
  - https://raw.githubusercontent.com/SynologyOpenSource/synology-csi/v1.3.1/deploy/kubernetes/v1.20/snapshotter/volume-snapshot-class.yml

# 上流のマニフェスト (v1.3.1、最新の v1.4.0 も同じ) はサイドカーが 2021 年版のままで、
# ベース OS が Debian 10 (EOL) になっている。ドライバ本体は v1.3.1 のまま、サイドカーだけ
# distroless の最新版に差し替える。上流が deploy のサイドカーを上げたらこの上書きは外す。
images:
  - name: registry.k8s.io/sig-storage/csi-attacher
    newTag: v4.13.0
  - name: registry.k8s.io/sig-storage/csi-provisioner
    newTag: v6.4.0
  - name: registry.k8s.io/sig-storage/csi-resizer
    newTag: v2.3.0
  - name: registry.k8s.io/sig-storage/csi-snapshotter
    newTag: v8.7.0
  - name: registry.k8s.io/sig-storage/csi-node-driver-registrar
    newTag: v2.18.0

# 新しいサイドカーが必要とする権限を足す (各サイドカーの deploy/kubernetes/rbac.yaml との差分)。
patches:
  - target:
      kind: ClusterRole
      name: synology-csi-controller-role
    patch: |-
      # csi-provisioner v6: スナップショットからの復元で VolumeSnapshot を watch / update する
      - op: add
        path: /rules/-
        value:
          apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshots"]
          verbs: ["watch", "update"]
      # csi-resizer v2: VolumeAttributesClass (GA) を参照する
      - op: add
        path: /rules/-
        value:
          apiGroups: ["storage.k8s.io"]
          resources: ["volumeattributesclasses"]
          verbs: ["get", "list", "watch"]
  - target:
      kind: ClusterRole
      name: synology-csi-snapshotter-role
    patch: |-
      # csi-snapshotter v8: VolumeSnapshotContent を patch で更新する
      - op: add
        path: /rules/-
        value:
          apiGroups: ["snapshot.storage.k8s.io"]
          resources: ["volumesnapshotcontents", "volumesnapshotcontents/status"]
          verbs: ["patch"]
  # csi-snapshotter v8 は VolumeGroupSnapshot (GA) が既定で有効だが、synology-csi v1.3.1 は
  # GroupController を実装していないので明示的に無効にする。csi-snapshotter-crd が group snapshot の
  # CRD を入れているので、このフラグを外すと informer が起動し、上の ClusterRole には
  # groupsnapshot.storage.k8s.io の権限が無いので watch が forbidden で失敗する。
  # 外すなら upstream の rbac-csi-snapshotter.yaml にある groupsnapshot の権限も足すこと。
  # 将来の csi-snapshotter でこの gate が LockToDefault になったり削除されたりすると、
  # フラグの解析で起動に失敗するので、更新時はリリースノートを確認する。
  - target:
      kind: StatefulSet
      name: synology-csi-snapshotter
    patch: |-
      # 上流でコンテナの順番が変わったら別のコンテナにフラグが付かないよう、名前を確かめてから足す
      - op: test
        path: /spec/template/spec/containers/0/name
        value: csi-snapshotter
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CSIVolumeGroupSnapshot=false
