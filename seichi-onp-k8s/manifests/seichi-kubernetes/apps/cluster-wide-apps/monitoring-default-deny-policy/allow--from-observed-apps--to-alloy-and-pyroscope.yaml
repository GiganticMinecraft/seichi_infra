# 観測対象アプリ (seichi-minecraft namespace の各アプリと garage-admin namespace の
# garage-admin-api) からの ingress 許可。
#   - alloy-receiver 4318/TCP: OTLP HTTP (gachadata-server, seichi-game-data-server,
#     seichi-game-data-publisher-server, conifers ingestor, garage-admin-api。portal は既存の
#     allow--from-seichi-portal--to-alloy-receiver.yaml が担う)
#   - pyroscope 4040/TCP: 継続プロファイリングの push
# seichi-minecraft の対象アプリを増やすときは seichi-minecraft 側 (egress) と
# monitoring 側 (ingress) の両方のリストを揃えて更新すること。
# 対になる seichi-minecraft 側の egress 許可は
# apps/seichi-minecraft/default-deny-policy/ にある。
# garage-admin 側は apps/garage-admin/default-deny-policy/ がまだ kustomization に
# 含まれておらず (CiliumNetworkPolicy 無し)、対になる egress 許可も無い。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-observed-apps--to-alloy-receiver
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-receiver
      app.kubernetes.io/instance: k8s-monitoring-alloy-receiver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seichi-minecraft
          matchExpressions:
            - key: app
              operator: In
              values:
                - gachadata-server
                - seichi-game-data-server
                - seichi-game-data-publisher-server
                - seichi-timed-stats-conifers-ingestor
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage-admin
            app: garage-admin-api
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-observed-apps--to-pyroscope
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
      app.kubernetes.io/instance: pyroscope
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seichi-minecraft
          matchExpressions:
            - key: app
              operator: In
              values:
                - seichi-portal-backend
                - seichi-portal-frontend
                - gachadata-server
                - seichi-timed-stats-conifers-ingestor
                - seichi-game-data-server
                - seichi-game-data-publisher-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: garage-admin
            app: garage-admin-api
      toPorts:
        - ports:
            - port: "4040"
              protocol: TCP
---
# seichi-portal-debezium (OpenTelemetry Java Agent) からの OTLP HTTP の ingress 許可
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow--from-seichi-portal-debezium--to-alloy-receiver
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy-receiver
      app.kubernetes.io/instance: k8s-monitoring-alloy-receiver
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seichi-minecraft
            app: seichi-portal-debezium
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
