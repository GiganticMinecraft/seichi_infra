# Trivy Operator の自前ダッシュボード (Grafana の Trivy フォルダ、uid trivy-overview)。
#
# grafana-dashboards-kubernetes が配布している dotdc の「Trivy Operator - Vulnerabilities」
# (Kubernetes フォルダ) は次の理由で件数が実態より大きく見え、どこから手を付けるか判断しにくい。
# このダッシュボードはそれを補正して表示する。
#   - UNKNOWN が全体の約 7 割を占める。Operator はレポートの重大度を Trivy の
#     VendorSeverity[SeveritySource] から取るため、ベンダー severity の無い CVE
#     (Go の stdlib / golang.org/x/*、一部の GHSA 由来 JAR) は Unknown になる。
#     trivy.severity で LOW は除外済みなので、Unknown は「MEDIUM 以上でベンダー評価なし」。
#     隠さずに独立した列・パネルとして出し、説明文で意味を明記する。
#   - Go バイナリを含むイメージが多く、同じ stdlib の CVE が数百コンテナに出る。
#     概要の CVE 数・重大度別の検出数と CVE の表には `除外するパッケージ` 変数
#     (既定: stdlib と golang.org/x を除外) を付ける。
#   - mariadb-operator の Backup / Restore が残した完了 Job もレポートを持ち、同じイメージが
#     数十件の Job に出る。イメージ単位の数字はすべてイメージ (registry/repository:tag@digest) で
#     重複排除し、
#     CVE の表は影響イメージ数 (重複排除済み) を数える。ワークロード別の表だけは
#     ワークロード単位なので、`Job` 変数 (既定は除外) で kind=Job のレポートをワークロード別・設定監査から外す。
#   - 同じイメージが複数 namespace にあると namespace ごとに数えられる。クラスタ全体の
#     合計 (概要の stat) はイメージ (digest 単位) だけで重複排除し、`namespace` 変数で絞れるようにする。
#
# パネルの意図:
#   - 概要: 対象イメージ数・ユニーク CVE 数・重大度別の検出数 (CVE × パッケージ × イメージ)・EOL ベース OS の
#     イメージ数。全体の増減を一目で見るため。
#   - イメージ別: どのイメージを更新すると件数が大きく減るかを探すため。
#   - CVE 別: どのパッケージを上げると何イメージ分が片付くかを見るため。
#     trivy_vulnerability_id は約 3 万系列あるので、表はすべて instant クエリにする。
#   - ワークロード別: 対応するマニフェスト (どの Deployment / StatefulSet か) を特定するため。
#   - EOL ベース OS: OS パッケージの修正が出ないイメージを、CVE 件数とは別に洗い出すため。
#     trivy_image_info は operator.metricsImageInfo: true で出力される
#     (app-of-other-apps/trivy-operator.yaml)。
#   - 設定監査 / RBAC / インフラ / コンプライアンス / 公開シークレット: 脆弱性以外のレポートの概況。
#   - 運用: メトリクスが取れているか (up) と、Operator のエラーログ
#     (TrivyScanJobsFailing アラートと同じ Loki ストリーム)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-operator-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Trivy"
data:
  trivy-operator-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Trivy Operator のスキャン結果。イメージ単位で重複排除し、完了 Job の履歴や同じイメージの使い回しで件数が膨らまないようにしている。",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "概要",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "VulnerabilityReport があるイメージ (registry/repository:tag@digest) の数。同じイメージを複数のnamespace・ワークロード・完了 Job が使っていても 1 と数え、同じタグでも digest が違えば別に数える。namespace 変数が効く。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "none",
              "noValue": "データなし"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(count by (image_registry, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities{job=\"trivy-operator\", namespace=~\"$namespace\"})) or (vector(0) and on () group(trivy_image_vulnerabilities{job=\"trivy-operator\"}))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "title": "対象イメージ数",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "残っている脆弱性 ID (CVE / GHSA) の種類数。namespace 変数と「除外するパッケージ」変数 (既定では Go 標準ライブラリと golang.org/x を除外) が効く。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "none",
              "noValue": "データなし"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(count by (vuln_id) (trivy_vulnerability_id{job=\"trivy-operator\", namespace=~\"$namespace\", resource!~\"$exclude_pkg\"})) or (vector(0) and on () group(trivy_vulnerability_id{job=\"trivy-operator\"}))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "title": "ユニーク CVE 数",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "重大度ごとの検出数。脆弱性 ID × パッケージ × イメージ (digest 単位) の組を 1 件と数えるので、同じイメージが複数の namespace・ワークロード・完了 Job にあっても 1 回だけ数える。ユニーク CVE 数と同じく namespace 変数と「除外するパッケージ」変数が効く。Unknown は「未評価」ではない。trivy.severity: MEDIUM,HIGH,CRITICAL で LOW は既に除外済みで、Unknown は Trivy 自身は MEDIUM 以上と判定しているが、Operator がレポートの重大度に使うベンダー severity (VendorSeverity[SeveritySource]) が無い CVE。Unknown の大半は Go 標準ライブラリと golang.org/x なので、「除外するパッケージ」を全部表示にすると Unknown が大きく増える。MEDIUM〜HIGH 相当として扱い、隠さずに見ること。 Operator が止まっているなど trivy_vulnerability_id 自体が無いときは 0 ではなく「データなし」になる。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none",
              "noValue": "データなし"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Critical"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "High"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Medium"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Unknown (≥Medium)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "blue",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 8,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "vertical",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count by (severity) (count by (severity, vuln_id, resource, image_registry, image_repository, image_tag, image_digest) (trivy_vulnerability_id{job=\"trivy-operator\", namespace=~\"$namespace\", resource!~\"$exclude_pkg\", severity!=\"Low\"})) or ((label_replace(vector(0), \"severity\", \"Critical\", \"\", \"\") or label_replace(vector(0), \"severity\", \"High\", \"\", \"\") or label_replace(vector(0), \"severity\", \"Medium\", \"\", \"\") or label_replace(vector(0), \"severity\", \"Unknown\", \"\", \"\")) and on () group(trivy_vulnerability_id{job=\"trivy-operator\"}))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series",
              "legendFormat": "{{severity}}"
            }
          ],
          "title": "重大度別の検出数",
          "type": "stat",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "Time",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "Time": 0,
                  "Critical": 1,
                  "High": 2,
                  "Medium": 3,
                  "Unknown": 4
                },
                "renameByName": {
                  "Unknown": "Unknown (≥Medium)"
                }
              }
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "ベース OS がサポート終了 (EOSL) になっているイメージ (digest 単位) の数。OS パッケージの修正が出なくなるため、CVE 件数とは別にベースイメージの更新対象として見る。namespace 変数が効く。 trivy_image_info 自体が無いときは 0 ではなく「データなし」になる。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none",
              "noValue": "データなし"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "count(count by (image_registry, image_repository, image_tag, image_digest) (trivy_image_info{job=\"trivy-operator\", namespace=~\"$namespace\", image_os_eosl=\"true\"})) or (vector(0) and on () (count(trivy_image_info{job=\"trivy-operator\"}) > 0))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "title": "EOL ベース OS のイメージ数",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "panels": [],
          "title": "イメージ別",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "namespace × イメージ (digest 単位) ごとの件数。同じイメージを使うワークロードや完了 Job (mariadb-operator の Backup / Restore 履歴など) が複数あっても max で 1 つにまとめるので、ワークロード数で膨らまない。同じタグでも digest が違えば別の行になる (古い digest のレポートが残っている場合など)。同じイメージが別の namespace にあれば namespace ごとに 1 行になる。件数は Trivy のレポート上の件数で、パッケージ名を持たないため「除外するパッケージ」変数は効かない。Unknown 列の意味は概要の「重大度別の検出数」の説明を参照 (MEDIUM 以上でベンダー評価が無いもの)。 Critical / High / Medium / Unknown のいずれかが 1 件以上あるイメージだけを出す。Low だけ・検出なしのイメージは出ない。",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Critical"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "High"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Medium"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 80
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Unknown (≥Medium)"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "blue",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "namespace"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "digest"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": "",
              "countRows": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Critical",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, image, digest) (label_replace(label_replace(label_join(label_join((trivy_image_vulnerabilities{job=\"trivy-operator\", namespace=~\"$namespace\", severity=\"Critical\"} and on (namespace, image_registry, image_repository, image_tag, image_digest) (sum by (namespace, image_registry, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities{job=\"trivy-operator\", namespace=~\"$namespace\", severity!=\"Low\"}) > 0)), \"image\", \"/\", \"image_registry\", \"image_repository\"), \"image\", \":\", \"image\", \"image_tag\"), \"image\", \"$1\", \"image\", \"(.*):\"), \"digest\", \"$1\", \"image_digest\", \"sha256:(.{12}).*\"))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (namespace, image, digest) (label_replace(label_replace(label_join(label_join((trivy_image_vulnerabilities{job=\"trivy-operator\", namespace=~\"$namespace\", severity=\"High\"} and on (namespace, image_registry, image_repository, image_tag, image_digest) (sum by (namespace, image_registry, image_repository, image_tag, image_digest) (trivy_image_vulnerabilities{job=\"trivy-operator\", namespace=~\"$namespace\", severity!=\"Low\"}) > 0)), \"image\", \"/\", \"image_registry\", \"image_repository\"), \"image\", \":\", \"image\", \"image_tag\"), \"image\", \"$1\", \"image\", \"(.*):\"), \"digest\", \"$1\", \"image_digest\", \"sha256:(.{12}).*\"))",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
