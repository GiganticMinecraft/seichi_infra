apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: cluster-wide-apps
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 3.1.0
    helm:
      values: |
        tempo:
          metricsGenerator:
            enabled: true
            storage:
              remote_write:
                - url: "http://prometheus-kube-prometheus-prometheus.monitoring:9090/api/v1/write"
                  # span-metrics のヒストグラムに traceID の exemplar を付けて送る
                  # (Prometheus 側は exemplar-storage を有効にしている)
                  send_exemplars: true
          overrides:
            defaults:
              metrics_generator:
                processors:
                  - local-blocks
                  - service-graphs
                  - span-metrics
                processor:
                  span_metrics:
                    # seichi-portal の入口 span (HTTP リクエスト / CDC / 通知 / 定期実行) に付く
                    # 処理の起点。値は user / cdc / notification / scheduled の 4 つだけで、
                    # 属性がない span ではラベルが付かないため系列はほとんど増えない。
                    # Prometheus では seichi_portal_flow ラベルになる。
                    dimensions:
                      - seichi_portal.flow
          server:
            grpc_server_max_recv_msg_size: 16777216
            grpc_server_max_send_msg_size: 16777216
          receivers:
            otlp:
              protocols:
                grpc:
                  max_recv_msg_size_mib: 16
        persistence:
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 100Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
