apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: cluster-wide-apps
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 3.1.0
    helm:
      values: |
        tempo:
          metricsGenerator:
            enabled: true
            storage:
              remote_write:
                - url: "http://prometheus-kube-prometheus-prometheus.monitoring:9090/api/v1/write"
                  # span-metrics のヒストグラムに traceID の exemplar を付けて送る
                  # (Prometheus 側は exemplar-storage を有効にしている)
                  send_exemplars: true
          overrides:
            defaults:
              metrics_generator:
                # local-blocks は Tempo 3 で廃止され、指定しても
                # "ignoring unknown metrics-generator processor" の警告が出るだけなので外している
                processors:
                  - service-graphs
                  - span-metrics
                processor:
                  span_metrics:
                    # seichi-portal の入口 span (HTTP リクエスト / CDC / 通知 / 定期実行) に付く
                    # 処理の起点。値は user / cdc / notification / scheduled の 4 つだけで、
                    # 属性がない span ではラベルが付かないため系列はほとんど増えない。
                    # Prometheus では seichi_portal_flow ラベルになる。
                    dimensions:
                      - seichi_portal.flow
          server:
            grpc_server_max_recv_msg_size: 16777216
            grpc_server_max_send_msg_size: 16777216
          receivers:
            otlp:
              protocols:
                grpc:
                  max_recv_msg_size_mib: 16
        # Tempo は SIGTERM を受けると、live-store が完成させたブロックのバックエンド
        # (/var/tempo/traces) への書き出しを即座に打ち切る。打ち切られたブロックは
        # 0 バイトの meta.json だけが残り、以後のブロック一覧の読み込みが
        # "failed reading unknown blocks: unexpected end of JSON input" で毎回失敗して、
        # 過去のトレースが一切検索できなくなる (2026-10-03〜10-09 に発生)。
        # 壊れるのは終了時なので、起動前にそうしたブロックを quarantine へ退避する。
        # 退避先は Tempo が読まない場所で、中身の確認後に手で消してよい。
        initContainers:
          - name: quarantine-broken-blocks
            image: busybox:1.38.0
            command:
              - sh
              - -c
              - |
                set -eu
                quarantine=/var/tempo/quarantine/$(date -u +%Y%m%dT%H%M%SZ)
                for meta in /var/tempo/traces/*/*/meta.json; do
                  [ -e "$meta" ] || continue
                  # 正常な meta.json は JSON オブジェクトなので "}" で終わる
                  if [ -s "$meta" ] && tail -c 2 "$meta" | grep -q '}'; then
                    continue
                  fi
                  block=$(dirname "$meta")
                  tenant=$(basename "$(dirname "$block")")
                  mkdir -p "$quarantine/$tenant"
                  mv "$block" "$quarantine/$tenant/"
                  echo "quarantined $tenant/$(basename "$block")"
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            volumeMounts:
              - name: storage
                mountPath: /var/tempo
        persistence:
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 100Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
