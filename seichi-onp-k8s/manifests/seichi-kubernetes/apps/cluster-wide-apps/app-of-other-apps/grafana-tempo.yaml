apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: cluster-wide-apps
  source:
    chart: tempo
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 3.2.1
    helm:
      values: |
        tempo:
          # トレースの保持期間。チャートの retention は backend_scheduler にしか入らず、
          # 実際に削除する backend_worker は Tempo の既定値 (336h) のままになるため、両方に同じ値を書く。
          # 現在の流入量は 1 日 10〜20MB 程度 (SDK 計装のサービスのみ) で、30 日でも 1GB に満たない。
          # Beyla (autoInstrumentation) を有効にしていた 2026-09 下旬は 1 日 8〜9GB あり、
          # その量だと 30 日は 100Gi に収まらない。Beyla を戻すときは保持期間かディスクを見直すこと。
          retention: 720h
          backendWorker:
            compaction:
              block_retention: 720h
          metricsGenerator:
            enabled: true
            storage:
              remote_write:
                - url: "http://prometheus-kube-prometheus-prometheus.monitoring:9090/api/v1/write"
                  # span-metrics のヒストグラムに traceID の exemplar を付けて送る
                  # (Prometheus 側は exemplar-storage を有効にしている)
                  send_exemplars: true
          overrides:
            defaults:
              metrics_generator:
                # local-blocks は Tempo 3 で廃止され、指定しても
                # "ignoring unknown metrics-generator processor" の警告が出るだけなので外している
                processors:
                  - service-graphs
                  - span-metrics
                processor:
                  span_metrics:
                    # kube-apiserver の watch / exec などの長時間接続は、普通の GET / LIST と
                    # 同じ span 名 (GET /api/v1/namespaces/{:namespace}/pods など) で接続中ずっと続く。
                    # これが混ざると p95 がヒストグラムの最大バケット (16.384s) に張り付くので、
                    # 生成時に除く。条件はダッシュボードの TraceQL パネルと同じ。
                    # exclude は 1 つでも当たれば除外、1 つの exclude の中の attributes は AND。
                    # regex は部分一致 (Go の MatchString) なので完全一致させたいものは ^...$ で囲む。
                    filter_policies: &apiserver-long-running-filter
                      # watch (?watch=true, /watch/)・ログの follow・exec / attach / port-forward / proxy
                      - exclude:
                          match_type: regex
                          attributes:
                            - key: resource.service.name
                              value: ^apiserver$
                            - key: span.http.target
                              value: .*([?&](watch|follow)=(1|t|T|true|True|TRUE)|/watch/|/(exec|attach|portforward|proxy)([/?]|$)).*
                      # server span の下にあるフィルタ層の span。どれも後段の処理全体を包むので
                      # 所要時間は server span とほぼ同じで、watch でも同じ長さになる。
                      # 属性が無く watch かどうか見分けられないため、名前でまとめて除く
                      # (同じ値は server span のメトリクスで見られる)。
                      # etcd の Watch / LeaseKeepAlive はストリームが続く間ずっと開いている。
                      - exclude:
                          match_type: regex
                          attributes:
                            - key: resource.service.name
                              value: ^apiserver$
                            - key: name
                              value: ^(audit|authentication|authorization|constrainedimpersonation|priorityandfairness|etcdserverpb\.Watch/Watch|etcdserverpb\.Lease/LeaseKeepAlive)$
                    # seichi-portal の入口 span (HTTP リクエスト / CDC / 通知 / 定期実行) に付く
                    # 処理の起点。値は user / cdc / notification / scheduled の 4 つだけで、
                    # 属性がない span ではラベルが付かないため系列はほとんど増えない。
                    # Prometheus では seichi_portal_flow ラベルになる。
                    dimensions:
                      - seichi_portal.flow
                  service_graphs:
                    # span_metrics と同じ条件。watch / exec の server span を落とすと、
                    # 対になる client span (apiserver 自身の loopback など) の辺も一緒に捨てられる。
                    filter_policies: *apiserver-long-running-filter
          server:
            grpc_server_max_recv_msg_size: 16777216
            grpc_server_max_send_msg_size: 16777216
          receivers:
            otlp:
              protocols:
                grpc:
                  max_recv_msg_size_mib: 16
        # Tempo は SIGTERM を受けると、live-store が完成させたブロックのバックエンド
        # (/var/tempo/traces) への書き出しを即座に打ち切る。打ち切られたブロックは
        # 0 バイトの meta.json だけが残り、以後のブロック一覧の読み込みが
        # "failed reading unknown blocks: unexpected end of JSON input" で毎回失敗して、
        # 過去のトレースが一切検索できなくなる (2026-10-03〜10-09 に発生)。
        # 壊れるのは終了時なので、起動前にそうしたブロックを quarantine へ退避する。
        # 退避先は Tempo が読まない場所で、中身の確認後に手で消してよい。
        initContainers:
          - name: quarantine-broken-blocks
            image: busybox:1.38.0
            command:
              - sh
              - -c
              - |
                set -eu
                quarantine=/var/tempo/quarantine/$(date -u +%Y%m%dT%H%M%SZ)
                for meta in /var/tempo/traces/*/*/meta.json; do
                  [ -e "$meta" ] || continue
                  # 正常な meta.json は JSON オブジェクトなので "}" で終わる
                  if [ -s "$meta" ] && tail -c 2 "$meta" | grep -q '}'; then
                    continue
                  fi
                  block=$(dirname "$meta")
                  tenant=$(basename "$(dirname "$block")")
                  mkdir -p "$quarantine/$tenant"
                  mv "$block" "$quarantine/$tenant/"
                  echo "quarantined $tenant/$(basename "$block")"
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            volumeMounts:
              - name: storage
                mountPath: /var/tempo
        persistence:
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 100Gi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
