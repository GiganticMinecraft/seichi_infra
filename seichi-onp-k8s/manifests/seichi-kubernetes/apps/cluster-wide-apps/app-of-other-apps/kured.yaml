apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
spec:
  project: cluster-wide-apps
  source:
    chart: kured
    repoURL: https://kubereboot.github.io/charts
    targetRevision: 6.1.0
    helm:
      releaseName: kured
      values: |
        configuration:
          timeZone: "Asia/Tokyo"
          # 04:00 からの Minecraft バックアップ(kubectl patch による replicas 操作)と
          # 07:00-08:00 の ArgoCD selfHeal ウィンドウを避けた時間帯のみ再起動を許可する
          startTime: "05:00"
          endTime: "07:00"
          # ロックにより同時に再起動するノードは 1 台のみ
          concurrency: 1
          # 再起動中にノードが死んだ場合にロックが残留しないようにする
          lockTtl: 30m
          drainGracePeriod: "60"
          drainTimeout: 10m
          period: 10m
          annotateNodes: true
          # 特定のアラートが firing している間だけ再起動を保留する (許可リスト方式)。
          #
          # 導入時は「除外リストに無いアラートはすべてブロック」だったが、warning 級のアラートが
          # 100 本以上あるこのクラスタでは常に何かが firing しており、2026-08-26〜10-23 の約 2 か月間
          # kured は 1 台も drain できなかった (etcdDatabaseHighFragmentationRatio, KubeVersionMismatch,
          # GarageBlockResyncErrors, ThanosObjectStorageOperationFailures, KubeContainerWaiting 等が
          # 入れ替わりで 05:00-07:00 の窓を潰し続けた)。除外リストは 3 か月で 12 回追記しても
          # 追いつかなかったため、alertFilterMatchOnly で意味を反転し、「今もう 1 台落とすと障害が
          # 重なる」状態を表すアラートだけを列挙してブロック理由にする。これらは前のノードが復帰すれば
          # 自然に消えるので、「前の 1 台が完全に戻るまで次を待つ」という本来の目的だけが残る。
          #
          # kured が見るのは Prometheus の ALERTS 系列だけなので、ここに書けるのは PrometheusRule 由来の
          # アラートに限る。Loki ruler のアラート (loki-alert-rules/*: KuredDrainFailed,
          # NodeBlockDeviceIOErrors, NodeIscsiConnErrors, NodeBtrfsChecksumErrors) は Alertmanager に
          # 直接送られ Prometheus には現れないため、列挙しても何も起きない。
          #
          # 列挙しているもの:
          # - ノード / control plane の死活: KubeNodeNotReady, KubeNodeUnreachable,
          #   KubeNodeReadinessFlapping, KubeletDown, KubeAPIDown, KubeControllerManagerDown,
          #   KubeSchedulerDown
          # - etcd の quorum: etcdInsufficientMembers, etcdMembersDown, etcdNoLeader
          # - ストレージの冗長性: GarageStorageNodeDisconnected (RF=2 なので 2 台目は落とせない)
          # - ストレージ異常の最中にボリュームの付け外しをしない: NodeStorageIOErrors
          #   (node-storage-alerts。node-problem-detector の IOError / TaskHung)
          # - ノード 1 台分の余裕が無い: KubeCPUOvercommit, KubeMemoryOvercommit (requests の合計が
          #   ノード 1 台を失った後の allocatable を超えている状態。drain した Pod の退避先が無く
          #   Pending のまま残る。直近 36 日で firing 実績は無いので、普段は何も止めない)
          # - 退避を一切許可しない PDB がある間は drain が失敗を繰り返すので止める:
          #   KubePdbBlocksAllEvictions (node-maintenance-alerts。2026-10-24 の障害は、
          #   argocd-server の PDB による drain 失敗の繰り返しとストレージ異常が重なって起きた)。
          #   for: 6h なので窓の直前に入った PDB は拾えず、drain 失敗そのものを Prometheus 側で
          #   検知する手段は未整備 (KuredDrainFailed は Loki ruler のため kured から見えない)
          #
          # 列挙していないもの (= 再起動を止めない) の代表例と理由:
          # - アプリケーションアラート (SeichiPortal*, Gachadata*, Conifers*, Mcserver*, ArgoCDApp*):
          #   drain で Pod が作り直されても根本原因は解消しないアプリ固有の問題
          # - 状態や容量の警告 (KubeStatefulSetReplicasMismatch, KubeletTooManyPods, Trivy*,
          #   KubeContainerWaiting 等): 再起動を保留しても直らない。KubeletTooManyPods は過密ノードの
          #   drain だけが解消手段で、ブロックするとデッドロックになる (2026-07-19 の実績)
          # - drain 自身が誘発する一時的なアラート (ThanosSidecarUploadStale, GarageS3SlowWrites,
          #   ThanosObjectStorageOperationFailures 等): 1 台再起動するごとに次の周期を潰し、
          #   1 窓で 2 台しか進まなくなる (2026-10-24 の窓の実績)
          #
          # 新しいアラートを足すときの基準は「他のノードを今すぐ再起動すると被害が広がるか」。
          # 「通知したい」だけのアラートはここに入れない (通知は Alertmanager の仕事)。
          prometheusUrl: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
          alertFiringOnly: true
          alertFilterMatchOnly: true
          alertFilterRegexp: "^(KubeNodeNotReady|KubeNodeUnreachable|KubeNodeReadinessFlapping|KubeletDown|KubeAPIDown|KubeControllerManagerDown|KubeSchedulerDown|etcdInsufficientMembers|etcdMembersDown|etcdNoLeader|GarageStorageNodeDisconnected|NodeStorageIOErrors|KubeCPUOvercommit|KubeMemoryOvercommit|KubePdbBlocksAllEvictions)$"
          # kubelet のパッチ更新も kured の drain + 再起動に相乗りさせる。
          # pkgs.k8s.io はマイナーごとの repo (core:/stable:/v1.3x) なので、apt で入るのは
          # 同一マイナー内のパッチのみ。マイナーアップグレードは従来どおり kubeadm で手動実施し、
          # その際に repo の向き先を張り替えれば以後のパッチ追従が自動で継続する。
          #
          # sentinel: OS の reboot-required に加えて kubelet の更新有無を apt のドライランで判定する
          # (コマンド指定時はファイル判定が無効になるため両方をここで見る)。
          # チャートは useRebootSentinelHostPath=true (デフォルト) だと rebootSentinelCommand を
          # 出力しないため、hostPath マウント方式を無効化して nsenter によるコマンド方式に切り替える
          useRebootSentinelHostPath: false
          # --allow-change-held-packages がないと hold 中の kubelet は simulate でも
          # 変更対象から外れて更新を検知できない
          rebootSentinelCommand: >-
            sh -c 'test -f /var/run/reboot-required ||
            apt-get -qq -s -o Debug::NoLocking=true --allow-change-held-packages
            --only-upgrade install kubelet 2>/dev/null
            | grep -q "^Inst kubelet"'
          # drain 完了後に実行される。node-runtime-updater がステージした containerd / runc を
          # apply.sh (rename のみ) で先に適用し、kubelet を unhold -> パッチ更新 -> hold
          # してから再起動する。すべての更新が drain 済み・再起動直前に適用される。
          #
          # kured の nsenter はホストの mount namespace にしか入らないため、apt は
          # ホストの resolv.conf (systemd-resolved の 127.0.0.53) を読みながら Pod の
          # network namespace で実行され、名前解決に失敗する (2026-07-17 の窓で
          # kubelet の .deb 取得が全ノード "Temporary failure resolving" で失敗した実績)。
          # そのためネットワークを要する apt 部分のみ nsenter --net でホストの
          # network namespace に入れて実行する (kured は privileged + hostPID なので可能)。
          #
          # 再起動窓 (05:00-07:00) は unattended-upgrades の実行時間帯と重なり apt lock を
          # 取り合う可能性があるため Lock::Timeout を設定し、apply や apt が失敗しても reboot は
          # 必ず実行する (ノードが drain されたまま残らないようにする。sentinel が残るため翌日リトライされる)
          rebootCommand: >-
            sh -c '{ [ ! -x /var/lib/node-runtime-updater/apply.sh ]
            || /var/lib/node-runtime-updater/apply.sh; } || true;
            nsenter --net=/proc/1/ns/net -- sh -c "export DEBIAN_FRONTEND=noninteractive;
            apt-mark unhold kubelet;
            apt-get -qq -o DPkg::Lock::Timeout=600 update;
            apt-get -qq -y -o DPkg::Lock::Timeout=600 --only-upgrade install kubelet;
            apt-mark hold kubelet";
            systemctl reboot'
        # tolerations はチャートのデフォルトで control-plane の NoSchedule を含むため未指定のままにする
        service:
          create: true
        metrics:
          create: true
          labels:
            release: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
