apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: cluster-wide-apps
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: 3.9.2
    helm:
      releaseName: kyverno
      values: |
        admissionController:
          replicas: 3
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        # チャート既定の memory limit 128Mi は実測ピーク(2026-10 時点で reports 127Mi /
        # background 122Mi / cleanup 125Mi)に張り付いていて、reports-controller は
        # OOMKilled を繰り返していた。reports は 512Mi、他 2 つは 256Mi に広げる。
        backgroundController:
          replicas: 2
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        cleanupController:
          replicas: 2
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
        reportsController:
          replicas: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # チャート 3.8 系の policies.kyverno.io 系 CRD は metadata.labels /
  # metadata.annotations を空マップ({})でレンダリングする一方、API サーバーは
  # 空マップを保存しないため「{} vs 無し」の差分が永遠に残り OutOfSync 表示になる。
  # 空マップの場合に限って無視する(実値が入った場合の差分は今までどおり検知される)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels | select(. == {})
        - .metadata.annotations | select(. == {})
