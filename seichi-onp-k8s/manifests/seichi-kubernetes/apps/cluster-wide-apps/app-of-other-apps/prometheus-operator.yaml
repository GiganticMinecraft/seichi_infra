apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  project: cluster-wide-apps
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 88.6.5
    helm:
      releaseName: prometheus
      skipCrds: false
      values: |
        defaultRules:
          create: true
          rules:
            kubeProxy: false
            alertmanager: true
            windows: false
        prometheus-windows-exporter:
          prometheus:
            monitor:
              enabled: false
        kubelet:
          serviceMonitor:
            attachMetadata:
              node: true
        nodeExporter:
          operatingSystems:
            darwin:
              enabled: false
        loki:
          isDefault: false
        grafana:
          sidecar:
            datasources:
              enabled: false
              defaultDatasourceEnabled: false
              isDefaultDatasource: false
            dashboards:
              enabled: true
              defaultFolderName: ""
              label: grafana_dashboard
              labelValue: "1"
              folderAnnotation: grafana_folder
              searchNamespace: ALL
              provider:
                foldersFromFilesStructure: true
          defaultDashboardsTimezone: Asia/Tokyo
          plugins:
            - isovalent-hubble-datasource
          grafana.ini:
            log:
              level: warn
            server:
              enforce_domain: true
              domain: grafana.onp-k8s.admin.seichi.click
              root_url: https://%(domain)s/
            date_formats:
              default_timezone: Asia/Tokyo
            auth:
              disable_login_form: true
            auth.github:
              enabled: true
              allow_sign_up: true
              auto_login: true
              client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
              scopes: user:email,read:org
              auth_url: https://github.com/login/oauth/authorize
              token_url: https://github.com/login/oauth/access_token
              api_url: https://api.github.com/user
              allowed_organizations: GiganticMinecraft
              allow_assign_grafana_admin: true
              role_attribute_path: contains(groups[*], '@GiganticMinecraft/onp-admin-proxmox') && 'GrafanaAdmin' || 'Viewer'
            security:
              cookie_secure: true
              strict_transport_security: true
              content_security_policy: true
            users:
              viewers_can_edit: true
          deploymentStrategy:
            type: Recreate
          envValueFrom:
            MARIADB_MONITORING_PASSWORD:
              secretKeyRef:
                name: mariadb-monitoring-password
                key: monitoring-password
          envFromSecret: "grafana-github-oauth-app-secret"
          persistence:
            enabled: true
            size: 10Gi
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  uid: PBFA97CFB590B2093
                  type: prometheus
                  url: http://thanos-query:9090
                  isDefault: true
                - name: Prometheus Direct
                  uid: P8689B564F8D4EF51
                  type: prometheus
                  url: http://prometheus-kube-prometheus-prometheus:9090
                  isDefault: false
                - name: Loki
                  uid: P8E80F9AEF21F6940
                  type: loki
                  url: http://loki-gateway
                  isDefault: false
                - name: Pyroscope
                  uid: P02E4190217B50628
                  type: grafana-pyroscope-datasource
                  access: proxy
                  url: http://pyroscope:4040
                  isDefault: false
                  jsonData:
                    minStep: '15s'
                - name: Tempo
                  uid: P214B5B846CF3925F
                  type: tempo
                  access: proxy
                  url: http://tempo:3200
                  isDefault: false
                  jsonData:
                    tracesToLogsV2:
                      datasourceUid: P8E80F9AEF21F6940
                      tags:
                        - key: 'k8s.namespace.name'
                          value: 'namespace'
                        - key: 'service.name'
                          value: 'service_name'
                      filterByTraceID: false
                      filterBySpanID: false
                      spanStartTimeShift: '-1h'
                      spanEndTimeShift: '1h'
                      customQuery: false
                    tracesToMetrics:
                      datasourceUid: PBFA97CFB590B2093
                      tags: [{ key: 'service.name', value: 'service' }, { key: 'job' }]
                      queries:
                        - name: 'Sample query'
                          query: 'sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m]))'
                    tracesToProfiles:
                      datasourceUid: P02E4190217B50628
                      tags:
                        - key: 'k8s.namespace.name'
                          value: 'namespace'
                        - key: 'service.name'
                          value: 'service_name'
                      profileTypeId: 'process_cpu:cpu:nanoseconds:cpu:nanoseconds'
                      customQuery: false
                    serviceMap:
                      datasourceUid: PBFA97CFB590B2093
                    nodeGraph:
                      enabled: true
                    search:
                      hide: false
                    traceQuery:
                      timeShiftEnabled: true
                      spanStartTimeShift: '-1h'
                      spanEndTimeShift: '1h'
                    spanBar:
                      type: 'Tag'
                      tag: 'http.path'
                - name: MariaDB
                  uid: P2ABB19EC46770D68
                  type: mysql
                  url: mariadb.seichi-minecraft:3306
                  isDefault: false
                  user: monitoring
                  secureJsonData:
                    password: ${MARIADB_MONITORING_PASSWORD}
        prometheus:
          thanosService:
            enabled: true
          thanosServiceMonitor:
            enabled: true
            labels:
              release: prometheus
          prometheusSpec:
            enableOTLPReceiver: true
            enableRemoteWriteReceiver: true
            thanos:
              objectStorageConfig:
                existingSecret:
                  name: garage-thanos-credentials
                  key: objstore.yml
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 500Gi
            resources:
              requests:
                memory: 12Gi
            retention: 30d
            retentionSize: "120GB"
            # Discord へ通知するルールの opt-in リスト (#5602)。
            # 大半のルールは kube-prometheus-stack の defaultRules でラベルを個別に
            # 足せないため、Alertmanager への送信時に alert relabeling で
            # notify=discord を付与する。ALERTS メトリクスには影響しないので
            # kured の alertFilterRegexp の挙動は変わらない。
            # 選定基準と次バッチ候補は docs/audits/2026-08-01-alert-rules-notify-discord-audit.md
            # (Loki ruler のルールと自前の PrometheusRule はここではなく
            # ルール定義側に直接 notify: discord を書く)
            additionalAlertRelabelConfigs:
              - source_labels: [alertname, severity]
                regex: "(etcdInsufficientMembers|etcdNoLeader|KubeAPIDown|KubeControllerManagerDown|KubeSchedulerDown|KubeletDown|NodeRAIDDegraded|KubePersistentVolumeErrors|KubePersistentVolumeFillingUp|NodeFilesystemAlmostOutOfSpace|AlertmanagerClusterDown|PrometheusErrorSendingAlertsToAnyAlertmanager);critical"
                target_label: notify
                replacement: discord
            additionalScrapeConfigs:
            - job_name: 'containerd'
              scheme: http
              metrics_path: '/v1/metrics'
              kubernetes_sd_configs:
              - role: node
              relabel_configs:
              - source_labels: [__address__]
                regex: '([^:]+)(?::\d+)?'
                target_label: __address__
                replacement: '${1}:1338'
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              metric_relabel_configs:
              - source_labels: [__name__]
                regex: 'grpc_.*'
                action: drop
            # kubeEtcd の ServiceMonitor は selector なし Service + Endpoints で etcd を発見するが、
            # ArgoCD 3.x のデフォルト resource.exclusions が Endpoints を除外するため機能しない。
            # そのため static_configs で直接スクレイプする(kubeEtcd 自体は etcd 用 defaultRules の
            # 有効化条件なので values に残している)。
            - job_name: 'kube-etcd'
              scheme: http
              static_configs:
              - targets:
                - 192.168.32.11:2381
                - 192.168.32.12:2381
                - 192.168.32.13:2381
            # CP ノード上の K8s API 用 haproxy (systemd 管理、frontend prometheus :8405)
            - job_name: 'haproxy'
              scheme: http
              static_configs:
              - targets:
                - 192.168.32.11:8405
                - 192.168.32.12:8405
                - 192.168.32.13:8405
        additionalPrometheusRulesMap:
          thanos:
            groups:
              - name: thanos
                rules:
                  - alert: ThanosSidecarUploadStale
                    # thanos_objstore_bucket_last_successful_upload_time は sidecar 再起動で 0 に
                    # リセットされるため、> 0 で除外しないと Prometheus Pod が再作成されるたびに
                    # 「6 時間以上未アップロード」扱いで 15 分後に偽発火する (2026-07-20 の kured 窓で
                    # drain により Pod が移動し、次の 2h ブロックのアップロード (08:00 JST) まで
                    # 約 2.5 時間誤 firing、wk-2 の再起動を約 40 分ブロックした実績)。
                    # 「再起動後 1 度もアップロードが成功しない」ケースはこの式では拾えなくなるが、
                    # 能動的な失敗は ThanosSidecarUploadFailures / ThanosObjectStorageOperationFailures が検知する
                    expr: time() - max by (namespace, pod) (thanos_objstore_bucket_last_successful_upload_time{job="prometheus-kube-prometheus-thanos-discovery"} > 0) > 6 * 60 * 60
                    for: 15m
                    labels:
                      severity: error
                    annotations:
                      summary: Thanos sidecar has not uploaded blocks recently
                      description: Thanos sidecar has not completed a successful object storage upload for more than 6 hours.
                  - alert: ThanosSidecarUploadFailures
                    expr: increase(thanos_shipper_upload_failures_total{job="prometheus-kube-prometheus-thanos-discovery"}[30m]) > 0
                    for: 5m
                    labels:
                      severity: error
                    annotations:
                      summary: Thanos sidecar upload failures
                      description: Thanos sidecar failed to upload Prometheus TSDB blocks to object storage.
                  - alert: ThanosObjectStorageOperationFailures
                    expr: sum by (job, operation) (increase(thanos_objstore_bucket_operation_failures_total[30m])) > 0
                    for: 5m
                    labels:
                      severity: error
                    annotations:
                      summary: Thanos object storage operation failures
                      description: Thanos object storage operation {{ "{{ $labels.operation }}" }} is failing for {{ "{{ $labels.job }}" }}.
          resource-usage:
            groups:
              - name: resource-usage
                interval: 1m
                rules:
                  - record: namespace:container_memory_working_set_bytes:sum
                    expr: sum by (namespace) (container_memory_working_set_bytes{container!=""})
                  - record: namespace:container_cpu_usage_seconds:sum_rate5m
                    expr: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
                  - record: node:node_memory_utilisation:ratio
                    expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
                  - record: node:node_cpu_utilisation:avg5m
                    expr: 1 - avg by (node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
        # 既定はどこにも通知しない (root receiver "null")。Discord への通知は
        # notify=discord ラベルによる明示 opt-in のみ (#5601)。severity ベースの
        # 一括通知は行わない (既存ルールのノイズをそのまま流さないため。
        # どのルールに notify=discord を付けるかの監査は #5602)。
        # 通知先は portal アプリ系 (team=portal) と、それ以外のインフラ系に分け、
        # さらに severity=critical だけをロールメンション付きにする。
        # warning / info / error は Discord へ投稿するが ping しない。
        # route は先勝ちのため、各系統とも critical の分岐を先に書く。
        alertmanager:
          enabled: true
          config:
            route:
              receiver: "null"
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                - receiver: "discord-portal-critical"
                  matchers:
                    - notify = "discord"
                    - team = "portal"
                    - severity = "critical"
                  group_by: ["alertname", "namespace", "service", "severity"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                  mute_time_intervals:
                    - "argocd-seichi-minecraft-sync-window"
                - receiver: "discord-portal-noncritical"
                  matchers:
                    - notify = "discord"
                    - team = "portal"
                  group_by: ["alertname", "namespace", "service", "severity"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                  mute_time_intervals:
                    - "argocd-seichi-minecraft-sync-window"
                - receiver: "discord-infra-critical"
                  matchers:
                    - notify = "discord"
                    - severity = "critical"
                  group_by: ["alertname", "namespace", "service", "severity"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                  mute_time_intervals:
                    - "argocd-seichi-minecraft-sync-window"
                - receiver: "discord-infra-noncritical"
                  matchers:
                    - notify = "discord"
                  group_by: ["alertname", "namespace", "service", "severity"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 4h
                  mute_time_intervals:
                    - "argocd-seichi-minecraft-sync-window"
            time_intervals:
              # seichi-minecraft AppProject の allow Sync Window と同じ時間帯は、
              # Prometheus / Loki から Alertmanager を経由する全 Discord 通知を抑止する。
              # アラートの評価・状態記録は継続し、window 終了後も firing なら通知する。
              # Sync Window を変更した場合はこの interval も同時に更新すること。
              - name: "argocd-seichi-minecraft-sync-window"
                time_intervals:
                  - times:
                      - start_time: "07:00"
                        end_time: "08:00"
                    location: "Asia/Tokyo"
            receivers:
              - name: "null"
              # discord_configs ではなく webhook_configs で Discord ネイティブ JSON を
              # 直接 POST する。理由: prometheus-operator は alertmanager 設定を自前の
              # 内部モデルで parse しており、discord_configs の webhook_url_file を
              # 認識できない (operator v0.92.1 時点、main も未対応)。discord_configs で
              # これを使うと operator の reconcile が
              #   field webhook_url_file not found in type alertmanager.discordConfig
              # で失敗し続け、Secret マウントの STS 更新が永久に走らない (2026-08-01 実測)。
              # webhook_configs の url_file / payload は operator も認識する。
              #
              # payload は文字列テンプレートではなく YAML 構造ごと JSON エンコードされる
              # (各文字列だけがテンプレート評価される) ため、annotation の日本語や引用符も
              # 安全に JSON 化される。
              # webhook URL は公開リポジトリに書けないため、Terraform 管理の Secret
              # (alertmanagerSpec.secrets でマウント) をファイル参照する。
              # critical の firing だけ content 内のロールメンションと
              # allowed_mentions で ping する (backup 失敗通知と同じ運用ロールを
              # 暫定使用)。resolved と noncritical は投稿のみで ping しない。
              # チャンネル専用ロールに変える場合は critical receiver の content と
              # allowed_mentions の両方の ID を差し替える (#5601)。
              - name: "discord-portal-critical"
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/portal-alert-discord/webhook-url
                    # payload に含めるアラート数の上限。embed description の 4096 字制限を
                    # 超えて Discord に 400 で拒否されないための安全弁 (printf の
                    # "%.Ns" による各フィールドの切り詰めと併用)
                    max_alerts: 5
                    payload:
                      # デフォルトの __subject は末尾に CommonLabels - GroupLabels を
                      # 括弧で列挙する (condition/container/endpoint/... のダンプに
                      # なって読めない) ため、alertname と namespace だけの自作にする
                      content: '{{ if eq .Status "firing" }}<@&532704116799963168> {{ end }}{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                      allowed_mentions:
                        roles: ["532704116799963168"]
                      embeds:
                        - title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                          description: |-
                            {{ range .Alerts }}**{{ .Labels.alertname }}** ({{ .Status }}){{ with .Annotations.summary }} — {{ printf "%.200s" . }}{{ end }}
                            {{ with .Annotations.description }}{{ printf "%.500s" . }}
                            {{ end }}{{ end }}
              - name: "discord-portal-noncritical"
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/portal-alert-discord/webhook-url
                    max_alerts: 5
                    payload:
                      content: '{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                      allowed_mentions:
                        parse: []
                      embeds:
                        - title: '{{ if eq .Status "firing" }}⚠️ [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                          description: |-
                            {{ range .Alerts }}**{{ .Labels.alertname }}** ({{ .Status }}){{ with .Annotations.summary }} — {{ printf "%.200s" . }}{{ end }}
                            {{ with .Annotations.description }}{{ printf "%.500s" . }}
                            {{ end }}{{ end }}
              - name: "discord-infra-critical"
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/infra-alert-discord/webhook-url
                    max_alerts: 5
                    payload:
                      # デフォルトの __subject は末尾に CommonLabels - GroupLabels を
                      # 括弧で列挙する (condition/container/endpoint/... のダンプに
                      # なって読めない) ため、alertname と namespace だけの自作にする
                      content: '{{ if eq .Status "firing" }}<@&532704116799963168> {{ end }}{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                      allowed_mentions:
                        roles: ["532704116799963168"]
                      embeds:
                        - title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                          description: |-
                            {{ range .Alerts }}**{{ .Labels.alertname }}** ({{ .Status }}){{ with .Annotations.summary }} — {{ printf "%.200s" . }}{{ end }}
                            {{ with .Annotations.description }}{{ printf "%.500s" . }}
                            {{ end }}{{ end }}
              - name: "discord-infra-noncritical"
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/infra-alert-discord/webhook-url
                    max_alerts: 5
                    payload:
                      content: '{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                      allowed_mentions:
                        parse: []
                      embeds:
                        - title: '{{ if eq .Status "firing" }}⚠️ [FIRING:{{ .Alerts.Firing | len }}]{{ else }}✅ [RESOLVED]{{ end }} {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
                          description: |-
                            {{ range .Alerts }}**{{ .Labels.alertname }}** ({{ .Status }}){{ with .Annotations.summary }} — {{ printf "%.200s" . }}{{ end }}
                            {{ with .Annotations.description }}{{ printf "%.500s" . }}
                            {{ end }}{{ end }}
          # 通知・Silence の可用性を確保するための HA 構成。
          # Prometheus 自体は 1 レプリカのため、ルール評価までは HA にならない(受容済み)。
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
          alertmanagerSpec:
            replicas: 2
            podAntiAffinity: hard
            # 各 receiver の webhook_url_file が参照する Secret を
            # /etc/alertmanager/secrets/<name>/ にマウントする (#5601)
            secrets:
              - portal-alert-discord
              - infra-alert-discord
            # Silence・通知状態 (nflog) の永続化。Alertmanager の状態は小さいので 1Gi で十分
            storage:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
        kubeApiServer:
          serviceMonitor:
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: 'apiserver_request_body_size_bytes_bucket'
                action: drop
              - sourceLabels: [__name__]
                regex: 'apiserver_watch_(cache_read_wait|list_duration|events_sizes)_seconds_bucket'
                action: drop
        kubeProxy:
          enabled: false
        kubeEtcd:
          endpoints:
            - 192.168.32.11
            - 192.168.32.12
            - 192.168.32.13
          service:
            enabled: true
            port: 2381
            targetPort: 2381
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards-kubernetes
  namespace: argocd
  labels:
    app.kubernetes.io/name: grafana-dashboards-kubernetes
    app.kubernetes.io/version: HEAD
    app.kubernetes.io/managed-by: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: cluster-wide-apps
  source:
    path: ./
    repoURL: https://github.com/dotdc/grafana-dashboards-kubernetes
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    ## https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
