apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: cluster-wide-apps
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 18.11.0
    helm:
      values: |
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            s3:
              endpoint: "http://garage.garage.svc.cluster.local:3900"
              region: "seichi-cloud"
              accessKeyId: "${GARAGE_S3_ACCESS_KEY_ID}"
              secretAccessKey: "${GARAGE_S3_SECRET_ACCESS_KEY}"
              s3ForcePathStyle: true
              insecure: true
            bucketNames:
              chunks: loki
              ruler: loki
              admin: loki
          pattern_ingester:
              enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            ingestion_rate_mb: 8
            ingestion_burst_size_mb: 16
            # Kubernetes audit log の RequestResponse エントリは
            # デフォルト 256KB を超えることがある (observed: ~490KB)。
            # 超過時はドロップではなく切り詰めにして可観測性を維持する。
            max_line_size: 1MB
            max_line_size_truncate: true
            # Loki ruler の rule group 上限 (#5603)。ルール肥大とラベル爆発の安全弁
            ruler_max_rules_per_rule_group: 20
            ruler_max_rule_groups_per_tenant: 20
          # NOTE: chart のテンプレートが読むのは loki.rulerConfig であり、
          # loki.ruler キーはどこからも参照されない (以前の ruler.enable_api は no-op だった)
          rulerConfig:
            enable_api: true
            # ClusterIP Service 経由で Alertmanager へ送る。HA 化 (#5600) 後は
            # 片系障害時に ruler のリトライで他系へ到達する
            alertmanager_url: http://prometheus-kube-prometheus-alertmanager:9093
            # ルールは rules sidecar が label "loki_rule" 付き ConfigMap を
            # /rules/fake (auth_enabled: false の単一テナント) に配置し、
            # ruler が local storage として読む
            storage:
              type: local
              local:
                directory: /rules
            # rule_path (ruler の一時領域) はデフォルト /rules で local storage と
            # 衝突するため退避する
            rule_path: /tmp/loki/rules-temp
          structuredConfig:
            memberlist:
              join_members:
                - loki-memberlist
            ingester:
              lifecycler:
                ring:
                  kvstore:
                    store: memberlist
            compactor:
              compactor_ring:
                kvstore:
                  store: memberlist
            common:
              ring:
                kvstore:
                  store: memberlist

        minio:
          enabled: false

        # rules sidecar (chart デフォルトで singleBinary Pod に同居) の配置先を
        # 単一テナント "fake" のディレクトリへ向ける
        sidecar:
          rules:
            folder: /rules/fake

        deploymentMode: SingleBinary

        singleBinary:
          replicas: 1
          persistence:
            size: 100Gi
          extraArgs:
            - "-config.expand-env=true"
          extraEnv:
            - name: GARAGE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-loki-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: GARAGE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-loki-credentials
                  key: AWS_SECRET_ACCESS_KEY

        chunksCache:
          resources:
            requests:
              cpu: 20m
              memory: 4Gi
            limits:
              memory: 4Gi

        resultsCache:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 64Mi

        # Zero out replica counts of other deployment modes
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0

        # -- DEPRECATED Monitoring section determines which monitoring features to enable, this section is being replaced
        # by https://github.com/grafana/meta-monitoring-chart
        monitoring:
          # -- DEPRECATED Recording rules for monitoring Loki, required for some dashboards
          rules:
            enabled: true
            labels:
              release: prometheus
            additionalRuleLabels:
              release: prometheus
            additionalGroups:
            - name: additional-loki-rules
              rules:
                - record: job:loki_request_duration_seconds_bucket:sum_rate
                  expr: sum(rate(loki_request_duration_seconds_bucket[1m])) by (le, job)
                - record: job_route:loki_request_duration_seconds_bucket:sum_rate
                  expr: sum(rate(loki_request_duration_seconds_bucket[1m])) by (le, job, route)
                - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate
                  expr: sum(rate(container_cpu_usage_seconds_total[1m])) by (node, namespace, pod, container)
          #  -- DEPRECATED ServiceMonitor configuration
          serviceMonitor:
            enabled: true
            labels:
              release: prometheus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      namespace: monitoring
      jsonPointers:
        - /spec/volumeClaimTemplates
