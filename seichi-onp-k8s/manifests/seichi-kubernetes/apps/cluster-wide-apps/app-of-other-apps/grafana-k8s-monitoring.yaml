apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # cascade deletion on this App deletion
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: cluster-wide-apps
  source:
    chart: k8s-monitoring
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 4.5.3
    helm:
      values: |
        cluster:
          name: "seichi-cloud"

        destinations:
          localPrometheus:
            type: prometheus
            # remote write の受け口 (enableRemoteWriteReceiver) は /api/v1/write。
            # ルートを指していた間は全サンプルが 405 で捨てられ、OTLP で受けたメトリクスが
            # Prometheus に入っていなかった
            url: http://prometheus-kube-prometheus-prometheus:9090/api/v1/write

          localLoki:
            type: loki
            url: http://loki-gateway:80/loki/api/v1/push

          localTempo:
            type: otlp
            url: http://tempo:4317
            tls:
              insecure: true
            metrics:
              enabled: false
            logs:
              enabled: false
            traces:
              enabled: true

          localPyroscope:
            type: pyroscope
            url: http://pyroscope:4040

        clusterMetrics:
          enabled: false # kube-prometheus-stackがあるのでオフ

        clusterEvents:
          enabled: true
          collector: alloy-singleton

        nodeLogs:
          enabled: true
          collector: alloy-logs

        podLogsViaLoki:
          enabled: true
          collector: alloy-logs

        applicationObservability:
          enabled: true
          collector: alloy-receiver
          processors:
            resourceDetection:
              # chart 既定の system detector (hostname_sources = ["os"], override = true) は
              # 受け取った全 OTLP テレメトリの host.name / os.type を alloy-receiver 自身の
              # 値 (= receiver の Pod 名) で上書きしてしまい、送信元の識別に使えない値になる。
              # override: false だけでは、host.name を付けない SDK (Rust アプリなど) に
              # receiver の Pod 名が補われるだけで直らないので、system detector は無効化する。
              # 送信元の Pod / ノードは後段の k8sattributes が k8s.pod.name / k8s.node.name として付ける。
              # env detector は receiver Pod 自身の OTEL_RESOURCE_ATTRIBUTES を読むもので、
              # receiver には設定していないため現状は何もしない (chart の既定どおり残す)。
              # 将来 detector や receiver 側の属性を足しても送信元の値を上書きしないよう
              # override も false にしておく
              override: false
              system:
                enabled: false
          receivers:
            otlp:
              http:
                enabled: true
              # Garage の trace_sink は OTLP gRPC しか話せない (4317)。http だけ開けていた
              # ため Garage は 2026-05 の設定以来ずっと "the grpc server returns error ...
              # transport error" を 3 秒ごとに出し、溜まった span で "channel is full" を
              # 5 分に 7,000 行吐いていた
              grpc:
                enabled: true
          traces:
            filters:
              span:
                - 'resource.attributes["service.name"] == "garage" and name == "GET /metrics"'
                - 'resource.attributes["service.name"] == "garage" and IsMatch(name, ".* /loki.*")'
                # Debezium (OTel Java Agent) が publish ごとに出す確認待ちの span。親を持たず
                # 単独のトレースになるだけなので落とす。このフィルタは span 名の付け直し
                # (set_semconv_span_name) の後に動くため、元の名前で判定する
                - 'resource.attributes["service.name"] == "seichi-portal-debezium" and attributes["original_span_name"] == "Channel.waitForConfirmsOrDie"'
                # Garage は Sampler::AlwaysOn 固定でサンプリング設定が無く (src/garage/tracing_setup.rs)、
                # 2026-10-19 実測で約 200 span/s を送っていた。その半分以上が内部 RPC
                # ("RPC [garage_table/...] to <node id>" など) とパーティションごとのロック取得
                # ("Acquire mutation_lock #0〜#255") で、span 名のカーディナリティも高い。
                # S3 API のルート span と、そのレイテンシ内訳になる BlockManager / テーブル操作の
                # 子 span は残し、それ以外の内部処理と admin API (metrics scrape 含む) を落とす。
                # (正規表現にバックスラッシュを入れると YAML → Helm → Alloy → OTTL の各段で
                #  エスケープ解釈が変わるので、"RPC [" ではなく "RPC " で前方一致させる)
                - 'resource.attributes["service.name"] == "garage" and IsMatch(name, "^RPC ")'
                - 'resource.attributes["service.name"] == "garage" and IsMatch(name, "^Acquire mutation_lock #.*")'
                - 'resource.attributes["service.name"] == "garage" and IsMatch(name, "^Admin API .*")'
                - 'resource.attributes["service.name"] == "garage" and name == "admin/gather_metrics"'
                - 'resource.attributes["service.name"] == "garage" and IsMatch(name, "^(Resync block|Hash block.*|Encrypt and hash.*|Read block from client)$")'

        autoInstrumentation:
          # 2026-10-03: kernel 6.13+ の BPF private stack のバグで、プリエンプション可能な uprobe 経路では
          # 同じ CPU 上で同じ prog が重なるとスタックが壊れる。wk-2 の mariadbd (libssl uprobe →
          # obi_protocol_tcp) で NULL 参照パニックが繰り返し起きたため無効化している。
          # upstream の修正 "bpf: guard uprobes against..." が Ubuntu カーネルに入るまで有効化しないこと。
          # 経緯: https://github.com/GiganticMinecraft/seichi_infra/pull/6220
          enabled: false
          collector: alloy-singleton
          beyla:
            config:
              data:
                discovery:
                  exclude_instrument:
                    - exe_path: ".*alloy.*|.*otelcol.*|.*beyla.*"
                    - k8s_namespace: garage-admin
                  # HTTP の RED metrics の正は Tempo metrics-generator (span-metrics
                  # processor) に一本化する (#5604)。OTel SDK 計装済みサービス
                  # (seichi-portal-frontend/backend 等) は Beyla が二重にトレースを
                  # 生成しないよう除外する。exclude_otel_instrumented_services は
                  # Beyla のデフォルト true だが、一本化の決定として明文化する
                  exclude_otel_instrumented_services: true
                  # Beyla は除外判定したサービスについても span metrics / service graph
                  # metrics だけは生成し続けるのがデフォルト (SDK 側がサンプリングする
                  # 環境向けの挙動)。本クラスタの SDK は parentbased_always_on で全量
                  # トレースを送るため Tempo 側の spanmetrics が全量を反映しており、
                  # Beyla 側の生成は将来 Beyla メトリクスのスクレイプを有効化した際に
                  # 二重計上になるだけなので止める
                  exclude_otel_instrumented_services_span_metrics: true
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
            k8sCache:
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 256Mi

        annotationAutodiscovery:
          enabled: false

        prometheusOperatorObjects:
          enabled: false

        profiling:
          enabled: true
          collector: alloy-profiles
          ebpf:
            enabled: true
          java:
            enabled: true
          pprof:
            enabled: true

        collectors:
          alloy-singleton:
            presets: [singleton]
          alloy-logs:
            # host-storage: positions ファイル (どのログファイルをどこまで読んだか) を
            # ノードの hostPath /var/lib/alloy に保存する。未指定だと storage.path が
            # コンテナ内の /tmp/alloy になり、Alloy Pod の再起動・更新のたびに位置を失って
            # 全ファイルを tail_from_end で末尾から読み直す (その間に書かれた行が欠落する)。
            # 第 2 段で podLogsViaLoki.onlyGatherNewLogLines を false にする前提として、先に位置を
            # 保存させておく (位置が無いまま切り替えると既存ログファイルを全量再送してしまう)。
            # onlyGatherNewLogLines が効くのは chart の pod_logs だけで、下の extraConfig の
            # k8s_audit / mariadb_slow は tail_from_end = true を直書きしている
            # (k8s_audit の audit*.log はローテート済みの audit-<時刻>.log にも一致するので、
            #  false にすると過去分を全量送る点に注意)。
            # 注意:
            #   - /var/lib/alloy はノード全体で共有されるパスなので、他の Alloy DaemonSet
            #     (alloy-profiles など) に host-storage を付けると positions を取り合う
            #   - 書き込みは alloy イメージ既定の root (uid 0) で動いていることに依存する
            #     (runAsUser は指定していない。kubelet が作る /var/lib/alloy は root 所有)
            presets: [daemonset, filesystem-log-reader, host-storage]
            # k8s-monitoring Helm chart は alloy-logs 以外の任意名 collector を
            # サポートしないため、audit log 収集を alloy-logs に同居させている。
            # /var/log/kubernetes/audit/ は CP ノードにしか存在しないので、
            # worker の alloy-logs では local.file_match が空 targets を返し、
            # 実質的に CP ノードのみで audit log が収集される。
            extraConfig: |-
              local.file_match "k8s_audit" {
                path_targets = [{
                  __path__ = "/var/log/kubernetes/audit/audit*.log",
                  job      = "integrations/kubernetes/audit",
                  instance = sys.env("HOSTNAME"),
                  cluster  = "seichi-cloud",
                }]
              }

              loki.source.file "k8s_audit" {
                targets       = local.file_match.k8s_audit.targets
                forward_to    = [loki.process.k8s_audit.receiver]
                tail_from_end = true
              }

              loki.process "k8s_audit" {
                // audit イベントは 1 行 1 JSON。
                // user.username や objectRef.resource/namespace をラベル化すると
                // カーディナリティが爆発して Loki が劣化するので、
                // 低カーディナリティな level のみラベル化し、他は log 本文の JSON で検索する
                // (Grafana Explore では `| json | user_username="..."` で絞り込める)
                stage.json {
                  expressions = {
                    audit_level = "level",
                  }
                }
                stage.labels {
                  values = {
                    level = "audit_level",
                  }
                }
                stage.static_labels {
                  values = {
                    source = "k8s-audit",
                  }
                }
                forward_to = [loki.write.localloki.receiver]
              }

              // ---- MariaDB slow query log parsing ----
              // mariadb Pod に同居する "slow-log-tailer" sidecar が slow log を pod stdout に
              // 中継している。default の podLogsViaLoki でも line-by-line で Loki に届くが、
              // それとは別に multiline で 1 イベントに再結合し、structured_metadata を付けて
              // Prometheus ヒストグラムも併発行する。
              discovery.kubernetes "mariadb_slow" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
              }

              discovery.relabel "mariadb_slow" {
                targets = discovery.kubernetes.mariadb_slow.targets

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  regex         = "slow-log-tailer"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              // loki.source.file はグロブ展開をしないので、必ず local.file_match を挟む。
              local.file_match "mariadb_slow" {
                path_targets = discovery.relabel.mariadb_slow.output
              }

              loki.source.file "mariadb_slow" {
                targets       = local.file_match.mariadb_slow.targets
                forward_to    = [loki.process.mariadb_slow.receiver]
                tail_from_end = true
              }

              loki.process "mariadb_slow" {
                // containerd の pod log ヘッダを剥がす
                stage.cri {}

                // MariaDB は同じ秒のクエリでは "# Time:" を省略するので、
                // 毎イベント必ず出現する "# User@Host:" を境界にする。
                // 先頭の "# Time:" 行は前イベントの末尾に混ざるが regex で読み飛ばすので OK。
                stage.multiline {
                  firstline     = "^# User@Host:"
                  max_wait_time = "3s"
                  max_lines     = 500
                }

                // "\\S+" は "root[root]" を greedy に食って後続の "[" で fail するので、
                // user は "[^\\[]+" で "[" の手前までを捕まえる。
                stage.regex {
                  expression = "(?s)User@Host:\\s+(?P<user>[^\\[]+)\\[.*?Query_time:\\s+(?P<query_time>[\\d.]+)\\s+Lock_time:\\s+(?P<lock_time>[\\d.]+)\\s+Rows_sent:\\s+(?P<rows_sent>\\d+)\\s+Rows_examined:\\s+(?P<rows_examined>\\d+)"
                }

                // 低カーディナリティだけ label 化
                stage.labels {
                  values = {
                    user = "",
                  }
                }
                stage.static_labels {
                  values = {
                    source = "mariadb-slow",
                  }
                }

                // 高カーディナリティは structured_metadata (Loki v3 で index されない)
                stage.structured_metadata {
                  values = {
                    query_time    = "",
                    lock_time     = "",
                    rows_examined = "",
                    rows_sent     = "",
                  }
                }

                // Prometheus ヒストグラムとしても発行
                // (Alloy の命名規則で "loki_process_custom_" プレフィックスが付く)
                stage.metrics {
                  metric.histogram {
                    name        = "mariadb_slow_query_seconds"
                    description = "MariaDB slow query execution time (seconds)"
                    source      = "query_time"
                    buckets     = [0.1, 0.25, 0.5, 1, 2, 5, 10]
                  }
                }

                forward_to = [loki.write.localloki.receiver]
              }
          alloy-receiver:
            presets: [deployment]
            # 運用メモ (#5608):
            #   - alloy-receiver は 1 replica の Deployment で SPOF。落ちている間の
            #     ブラウザテレメトリ (garage-admin / seichi-portal) はドロップされる
            #   - seichi-portal は same-origin の /collect rewrite で送るため
            #     cors_allowed_origins への追加は不要 (CORS 自体が発生しない)
            extraConfig: |-
              faro.receiver "default" {
                // Loki のストリームラベル。値が空のラベルはペイロードの同名キーから
                // 抽出される (app_name = Faro SDK の app.name、kind = log/exception/
                // measurement/event)。未設定だとラベル 0 個のストリームになり Loki に
                // 保存されない (2026-08-01 実測: faro 由来のログが Loki に 1 行もない)。
                // #5612 の Loki ruler ルール {app_name=..., kind="exception"} の前提
                extra_log_labels = {
                  app_name = "",
                  kind     = "",
                }

                server {
                  listen_address = "0.0.0.0"
                  listen_port    = 12347

                  cors_allowed_origins = ["https://garage-admin.onp.admin.seichi.click"]

                  max_allowed_payload_size = "10MiB"

                  // デフォルト (rate = 50, burst_size = 100, global) は
                  // seichi-portal の本番ブラウザトラフィックを載せると不足しうるため
                  // 引き上げる。超過時は 429 でドロップされる。
                  rate_limiting {
                    enabled    = true
                    rate       = 200
                    burst_size = 400
                  }
                }

                sourcemaps {
                  // source map によるデミニファイは不採用 (seichi-portal-frontend#934
                  // 参照。必要になれば productionBrowserSourceMaps + 公開配信 +
                  // download_from_origins 限定でいつでも導入できる)。
                  // このブロック自体は SSRF 対策として残す: ブロックが無くても
                  // デフォルトで download = true + download_from_origins = ["*"] が
                  // 適用され、ブラウザ由来の任意 URL を Alloy が fetch しうるため、
                  // 明示的に無効化しておく。
                  download = false
                }

                output {
                  logs   = [loki.write.localloki.receiver]
                  traces = [otelcol.processor.attributes.localtempo.input]
                }
              }
            alloy:
              extraPorts:
                - name: otlp-http
                  port: 4318
                  targetPort: 4318
                  protocol: TCP
                - name: faro
                  port: 12347
                  targetPort: 12347
                  protocol: TCP
          alloy-profiles:
            presets: [privileged, daemonset]

        alloy-operator:
          deploy: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
