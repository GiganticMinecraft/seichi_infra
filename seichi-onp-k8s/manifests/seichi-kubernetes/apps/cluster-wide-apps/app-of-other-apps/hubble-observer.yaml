apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-observer
  namespace: argocd
spec:
  project: cluster-wide-apps
  source:
    chart: hubble-observer
    repoURL: ghcr.io/onzack/helm-charts
    targetRevision: 2.7.1
    helm:
      releaseName: hubble-observer
      values: |
        # AUDIT のみを記録する。none (全 verdict) だと FORWARDED が
        # フロー件数の 94.8% を占め、Loki の取り込み量 約130 GiB/日 の
        # ほぼ全量がこれになる (2026-09-07 実測: 5分間 234,552 フロー中
        # FORWARDED 222,305 / AUDIT 12,056 / TRACED 191)。
        #
        # policyAuditMode: true (cilium.yaml) の下では、ポリシー上は拒否
        # されるはずの通信が DROPPED ではなく AUDIT として記録される。
        # つまり AUDIT が「audit モードを切ったら遮断される通信」＝
        # まだ書けていない許可ルールの一覧であり、NetworkPolicy 導入
        # 作業に必要な信号はこれだけで足りる。FORWARDED (許可済みの通信)
        # は作業上の価値がないため落とす。
        #
        # 将来 policyAuditMode を false にすると、遮断された通信は AUDIT
        # ではなく DROPPED として出るようになる。そのときはこの値を
        # DROPPED に変更すること (変更しないと何も記録されなくなる)。
        # なお両方を同時に指定することはできない。チャートは値を
        # `--verdict <値>` にそのまま埋め込むが、hubble CLI はカンマ区切りを
        # 受け付けない (実測: invalid argument "DROPPED,AUDIT")。
        verdictFilter: "AUDIT"
        # hubble CLI 単体のイメージ (quay.io/cilium/hubble、チャートの既定値) は
        # v1.16.4 (Alpine 3.20、EOL) で配布が止まっている。上流は Cilium Agent の
        # イメージに同梱の hubble を使う方針 (cilium/hubble#1631) なので、それに
        # 差し替える。チャートは `/bin/sh -c "hubble observe ..."` で起動するので
        # そのまま動く。Cilium の DaemonSet が使うイメージ (cilium.yaml の chart の既定値。
        # `kubectl -n kube-system get ds cilium` で見られる) と同じタグ・digest にする。
        # ノードには digest で入っているので、そろっていれば pull が起きない。
        # Renovate は Cilium の chart と同じグループで上げるが、公開時期の差で別々の PR に
        # なることもあるので、Cilium を上げたらここも合っているか確かめる。
        image:
          repository: quay.io/cilium/cilium
          # renovate: datasource=docker depName=quay.io/cilium/cilium
          tag: v1.20.3@sha256:95cfa5c2427cc6b452c00908778d0566311f572589284af949d06a013db1a849
        # Cilium Agent のイメージは root 実行・ネットワーク系ツール入りなので、
        # hubble observe に要らない権限を落とす (/tmp はチャートが emptyDir を付ける)。
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        hubbleRelay:
          serviceName: hubble-relay
          port: "80"
          namespace: kube-system
        grafanaDashboard:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
