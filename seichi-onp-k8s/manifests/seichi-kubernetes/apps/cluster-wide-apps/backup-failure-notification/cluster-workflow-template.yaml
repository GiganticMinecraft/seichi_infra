apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: backup-failure-notification
spec:
  templates:
    - name: send-discord-notification
      inputs:
        parameters:
          - name: title
          # 本文の「〜 `<workflow 名>` が失敗しました」の主語。
          # バックアップ以外のワークフロー (garage-read-canary など) が通知に使うときに上書きする
          - name: workflow-kind
            default: "バックアップワークフロー"
      container:
        image: curlimages/curl:8.23.0
        env:
          - name: DISCORD_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: backup-failure-notify-webhook
                key: DISCORD_WEBHOOK_URL
        command: [sh, -ceu]
        args:
          - |
            curl -fSs -X POST \
              -H "Content-Type: application/json" \
              --data "{
                \"content\": \"<@&532704116799963168>\",
                \"allowed_mentions\": {\"roles\": [\"532704116799963168\"]},
                \"embeds\": [{
                  \"title\": \"{{inputs.parameters.title}}\",
                  \"description\": \"{{inputs.parameters.workflow-kind}} \`{{workflow.name}}\` が失敗しました。ArgoWorkflows を確認してください。\",
                  \"color\": 15548997
                }]
              }" \
              "${DISCORD_WEBHOOK_URL}"
