# Garage の異常を既存の Alertmanager -> Discord 経路へ通知する。
#
# 重要: Garage 自身が公開するクラスタ健全性メトリクス
# (cluster_healthy / cluster_available / cluster_storage_nodes_ok /
#  cluster_partitions_quorum / cluster_partitions_all_ok) は
# ノード間のネットワーク疎通ベースで、ストレージ障害には反応しない。
# 2026-09-06〜09-07 に garage-2 の iSCSI LUN が offline 化して
# 全 PUT が 503 になった障害でも、これらは最後まで正常値
# (cluster_healthy=1, storage_nodes_ok=3/3, partitions_quorum=256/256) のままだった。
# そのため「Garage が健全か」は下記 2 つで判断する。
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-alerts
  namespace: garage
  labels:
    release: prometheus
spec:
  groups:
    - name: garage-alerts
      rules:
        - alert: GarageS3ServerErrors
          # 症状側の一次シグナル。書き込みが quorum 不足で 503 になると
          # Loki / Thanos / ワールドアップロード / バックアップが軒並み失敗する。
          # 実測: 2026-08-15〜09-06 の日次 503 増分はほぼ全日 0 で、
          # 障害中のみ約 8/秒。閾値 0.1/秒 は障害時実測の約 1/80 で十分な余裕がある。
          expr: sum(rate(api_s3_error_counter{status_code="503"}[5m])) > 0.1
          for: 10m
          labels:
            severity: critical
            notify: discord
          annotations:
            summary: "Garage が S3 リクエストを 503 で拒否しています"
            description: "Garage の 503 応答が 10 分以上継続しています。いずれかのノードのブロックストアが応答していない可能性が高いです。garage status はネットワーク疎通しか見ないため healthy に見える点に注意してください。各ノードで /sys/block/<dev>/device/state が offline になっていないか確認してください。"

        - alert: GarageBlockResyncErrors
          # 原因側のシグナル。ディスク I/O エラーなどでブロックの再同期に
          # 失敗し続けている状態を捉える。
          # 実測: 2026-09 までの「平常値 13〜29」は 10/3・10/15 の LMDB 破損で
          # 失われたブロックの残骸で、2026-10-19 に repair block-refs と
          # block purge で全ノード 0 にした。以後の平常値は 0。
          # ノード再起動や repair の直後に数十〜100 程度まで一時的に上がり
          # 1 時間以内に戻るので、10 超が 2 時間続いたら鳴らす。
          expr: max by (pod) (block_resync_errored_blocks) > 10
          for: 2h
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage {{ $labels.pod }} で再同期に失敗しているブロックが増えています"
            description: "{{ $labels.pod }} の block_resync_errored_blocks が 2 時間以上 10 を超えています。ノードのカーネルログで I/O エラーを、garage block list-errors で参照が残るブロック(RC>0)を確認してください。"

        - alert: GarageS3InternalErrors
          # 500 はクォーラム不足ではなく、メタデータの不整合 (object が指す version が
          # 削除済み、ブロック欠損など) で返る。2026-10-19 に pyroscope の 48 キーが
          # 毎秒 6.5 件の 500 を 3 日以上返し続けていたが、503 のアラートしか無く
          # 気付けなかった。Pyroscope の削除レースで数件/分は平常時も出るので、
          # 1 件/秒超が 15 分続いたら鳴らす。
          expr: sum(rate(api_s3_error_counter{status_code="500"}[5m])) > 1
          for: 15m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage が S3 リクエストに 500 を返し続けています"
            description: "Garage の 500 応答が 15 分以上毎秒 1 件を超えています。Loki で {namespace=\"garage\"} |= \"Internal error\" を見てキーを特定してください。object/version 不整合なら該当キーの DeleteObject、ブロック欠損なら garage block list-errors / purge が対処です (docs/runbooks/garage-meta-volume-migration.md の関連項参照)。"

        - alert: GarageS3SlowWrites
          # metadata_fsync=true のため meta ボリュームの fsync レイテンシが PutObject に
          # そのまま乗る。Synology iSCSI 上では PutObject p99 が 6 秒前後で数週間
          # 推移していたが誰も気付かなかった。NVMe (topolvm) 移行後は 0.2 秒。
          expr: histogram_quantile(0.99, sum by (le) (rate(api_s3_request_duration_bucket{api_endpoint="PutObject"}[10m]))) > 2
          for: 30m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage の PutObject p99 が {{ $value | humanizeDuration }} に悪化しています"
            description: "PutObject の p99 が 30 分以上 2 秒を超えています。テーブル書き込み p99 (table_put_request_duration) が同時に悪化していれば meta ボリュームの fsync 性能、block_write_duration なら data ボリューム (TrueNAS) 側を疑ってください。"

        - alert: GarageStorageNodeDisconnected
          # replicationFactor=2 では 1 台欠けた時点で 2/3 のパーティションの書き込み
          # クォーラムが満たせず 503 になる。503 アラートより先に原因を指す。
          # 注意: この指標はノード間のネットワーク疎通ベースで、ストレージ障害
          # (2026-09-06 の iSCSI LUN offline) では反応しない。
          expr: min(cluster_storage_nodes_ok) < min(cluster_storage_nodes)
          for: 10m
          labels:
            severity: critical
            notify: discord
          annotations:
            summary: "Garage のストレージノードが {{ $value }} 台しか接続されていません"
            description: "garage status で欠けているノードを確認してください。Pod が Pending なら topolvm の PV があるノードにしか乗れない制約 (nodeAffinity) を疑ってください。"

        - alert: GarageMetaVolumeLow
          # LMDB は再同期中に 3 倍以上に膨れる (2026-10-15: 22GiB → 70GiB、100Gi の
          # ボリュームで 72% まで使用)。満杯になると Garage が書けなくなり LMDB も
          # 壊れうるので、再同期を始める前に余裕があるかをここで見る。
          expr: garage_local_disk_avail{volume="metadata"} / garage_local_disk_total{volume="metadata"} < 0.2
          for: 15m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage {{ $labels.pod }} の meta ボリューム空きが {{ $value | humanizePercentage }} です"
            description: "meta (LMDB) ボリュームの空きが 20% を切っています。topolvm なら PVC を拡張 (allowVolumeExpansion=true)、snapshots/ と db.lmdb.corrupt-* の掃除も検討してください。"

        - alert: GarageResyncBacklog
          # ノード再構築後の再同期が進んでいないことを捉える。NVMe 上なら 35 万件を
          # 10 分で消化できる (2026-10-19 実測) ので、1 万件超が 6 時間続くのは異常。
          # resync-tranquility / resync-worker-count (garage worker get) を確認する。
          expr: max by (pod) (block_resync_queue_length) > 10000
          for: 6h
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage {{ $labels.pod }} の resync キューが 6 時間以上 1 万件を超えています"
            description: "block_resync_queue_length が減っていません。garage worker list で resync worker の状態と tranquility を、ノードのディスク I/O を確認してください。"

        - alert: GarageBlockDeleteBurst
          # block_ref が誤って削除されると、参照の切れたブロックが GC で大量に消える。
          # 2026-10-19 に garage-1 切断中に repair block-refs を実行した際、553 件の
          # block_ref が deleted になり、参照先ブロックが GC されて seichi-plugins /
          # thanos / mariadb-backups / pyroscope / seichi-portal の約 70 オブジェクトが
          # 読めなくなった (GET は 200 と正しい Content-Length を返すが本文が途中で切れる)。
          # そのとき garage-0 の削除数は 6.37 万/h (10-18 23:00Z まで) と 14.3 万/h
          # (10-19 02:00Z まで) だった。平常時はノードあたり数百〜1,500/h、retention の
          # 掃除のピークは 2026-10-17〜20 の 3 日間の実測で最大 2.07 万/h (garage-2)。
          # その 2.4 倍・事故時の 1/3 にあたる 5 万/h を閾値にする。
          # 一度消えたブロックは戻らないので for は置かずに即時通知する。
          expr: sum by (pod) (increase(block_delete_counter{job="garage-metrics"}[1h])) > 50000
          for: 0m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage {{ $labels.pod }} が 1 時間で {{ $value | humanize }} 個のブロックを削除しました"
            description: "{{ $labels.pod }} のブロック削除数が 1 時間で 5 万を超えています (retention の掃除でも 2 万/h 程度)。repair (block-refs など) やレイアウト変更、ノード切断の直後であれば、block_ref が誤って削除され参照中のブロックまで GC されている可能性があります。block_rc_size (ブロック参照カウンタ数) が急減していないかをダッシュボード garage-overview で、実行中の repair / GC を garage worker list で確認し、疑わしければ repair を止めてください。欠損したオブジェクトは GET が 200 のまま本文が途中で切れるため、S3 のエラー率には現れません。"

        - alert: GarageBlockRcDrop
          # ブロック参照カウンタ (block_rc テーブル) のエントリ数が短時間で大きく減るのは
          # 大量の参照が一斉に消えたことを意味する。2026-10-19 の事故では garage-0 で
          # 20 分のうちに 733,641 → 671,510 (約 6.2 万減) だった。平常時の 30 分間の減少は
          # 2026-10-17〜20 の 3 日間の実測で最大 9,736 (retention の掃除) なので、その 3 倍・
          # 事故時の半分にあたる 3 万を閾値にする。
          expr: (block_rc_size{job="garage-metrics"} offset 30m) - block_rc_size{job="garage-metrics"} > 30000
          for: 0m
          labels:
            severity: warning
            notify: discord
          annotations:
            summary: "Garage {{ $labels.pod }} のブロック参照カウンタ数が 30 分で {{ $value | humanize }} 減りました"
            description: "{{ $labels.pod }} の block_rc_size が 30 分前から 3 万以上減っています (retention の掃除でも 1 万程度)。大量のオブジェクト削除に心当たりがなければ、repair block-refs などで block_ref が誤って削除された可能性があります。garage worker list で実行中の repair を確認し、block_delete_counter の増加 (GarageBlockDeleteBurst) と合わせて判断してください。"
