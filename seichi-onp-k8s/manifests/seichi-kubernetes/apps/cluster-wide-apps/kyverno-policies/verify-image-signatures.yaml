apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-ghcr-image-signatures
  annotations:
    policies.kyverno.io/title: Verify GHCR Image Signatures
    policies.kyverno.io/description: >-
      ghcr.io/giganticminecraft/* のコンテナイメージが
      GitHub Actions の Cosign keyless signing で署名されていることを検証する。
      検証結果は Audit として記録し、デプロイはブロックしない。
spec:
  validationActions: [Audit]
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/giganticminecraft/*"
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  # ビルド側の --new-bundle-format=false に対応する Cosign 署名を検証する。
  attestors:
    - name: githubActions
      cosign:
        keyless:
          identities:
            - subjectRegExp: "https://github\\.com/GiganticMinecraft/.+"
              issuer: "https://token.actions.githubusercontent.com"
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    # 通常コンテナだけでなく init / ephemeral コンテナも検証する。
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
          .all(image, verifyImageSignatures(image, [attestors.githubActions]) > 0)
      message: "Image must be signed by GiganticMinecraft GitHub Actions"
