apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ?ref= (config/: CRD / RBAC / manager) と images の newTag は同じコミットに揃える。
  # Renovate が digest 追従で更新するのは newTag (latest@sha256) だけで ?ref= は追従しないため、
  # 上流の config/ が変わったら ?ref= を手動で上げる
  - github.com/GiganticMinecraft/seichi-gateway-operator/config/default?ref=8d077e320437deea757a78bfa45edf2dd02eee12

images:
  - name: controller
    newName: ghcr.io/giganticminecraft/seichi-gateway-operator
    newTag: latest@sha256:187158b68b5ede6e7b3625a23c4efb8145b74985a106c59976c7bc8e7e1ce197
