apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ?ref= (config/: CRD / RBAC / manager / ServiceMonitor) と images の newTag は同じコミットに揃える。
  # Renovate が digest 追従で更新するのは newTag (latest@sha256) だけで ?ref= は追従しないため、
  # 上流の config/ が変わったら ?ref= を手動で上げる
  - github.com/GiganticMinecraft/seichi-gateway-operator/config/default?ref=f9c44e61c8dc1b112bd1acac7209aa48eb111eb4
  - prometheus-metrics-reader-binding.yaml

images:
  - name: controller
    newName: ghcr.io/giganticminecraft/seichi-gateway-operator
    newTag: latest@sha256:187158b68b5ede6e7b3625a23c4efb8145b74985a106c59976c7bc8e7e1ce197

patches:
  # 上流の ServiceMonitor を kube-prometheus-stack の Prometheus (serviceMonitorSelector: release=prometheus) に拾わせる
  - target:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: seichi-gateway-operator-controller-manager-metrics-monitor
    patch: |-
      - op: add
        path: /metadata/labels/release
        value: prometheus
