name: Terraform (PR)
on:
  # terraform が file(...) でファイルを参照することがあり、
  # 参照されたファイルが変更された場合 re-apply する必要があるので、
  # 常に plan していい
  pull_request:

jobs:
  tf_plan:
    name: tf plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # plan の結果を PR にコメントするため
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORM_CLOUD_API_TOKEN }}
          terraform_version: v1.16.5
          # wrapper は stdout に "[command]..." 行を混ぜるうえ、その step output も使わないので無効にする
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check
        working-directory: "./terraform"

      - run: terraform init
        working-directory: "./terraform"

      - name: Validate .tf files
        run: terraform validate -no-color
        working-directory: "./terraform"

      - name: Open tunnel to OnP k8s cluster
        run: bash "./.github/workflows/scripts/open-tunnel-to-onp-k8s-and-export-tf-var-to-github-env.sh"

      - name: Expose all Terraform variables to environment variables from secrets
        run: bash "./.github/workflows/scripts/expose-all-tf-vars-to-github-env.sh"
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Plan Terraform infrastructure changes
        # plan の出力は大きくなりうるので、step output や環境変数ではなくファイルで次の step に渡す。
        # shell: bash を明示すると pipefail が有効になり、plan の失敗が tee に隠れない
        shell: bash
        run: terraform plan -input=false -no-color -lock-timeout=10m | tee "${RUNNER_TEMP}/tfplan.txt"
        working-directory: "./terraform"

      - name: Comment result to Pull Request
        run: bash "./.github/workflows/scripts/comment-tf-plan-to-pr.sh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAN_FILE: ${{ runner.temp }}/tfplan.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
