name: Build itzg upstream images on Ubuntu 26.04

# itzg/minecraft-server の java17 タグは Ubuntu 20.04 (focal) ベースで JDK が 2025-04 の
# 17.0.15 から更新されていない (java8-jdk / java21-jdk は上流で既に Ubuntu 26.04)。
# 上流の Dockerfile はそのまま使い、BASE_IMAGE だけ Ubuntu 26.04 (resolute) の Temurin 17 に
# 差し替えて自前でビルドする。上流のタグと base image の digest は Renovate が追従する。
#
# 上流が java17 を focal に留めている理由 (netty/netty#12343) は netty 4.1.76 限定のバグで、
# Minecraft 1.18.2 同梱の netty は 4.1.68。Paper 1.18.2 を Temurin 17 の Ubuntu 26.04 で
# 起動できることは本番クラスタで確認済み (2026-10-24)。
# bungeecord (itzg/mc-proxy) は java21 を使っていて上流が既に Ubuntu 26.04 なので対象外。
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_itzg_images.yaml"
  pull_request:
    paths:
      - ".github/workflows/build_itzg_images.yaml"
  workflow_dispatch:

# java17 / java17-<上流タグ> は再 push される可変タグなので、main 上のビルドが追い越して
# 古い方が最後に push されないよう直列化する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build ${{ matrix.image }}:${{ matrix.variant }} (and publish on main)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: itzg-minecraft-server
            variant: java17
            upstream_repo: itzg/docker-minecraft-server
            # renovate: datasource=github-releases depName=itzg/docker-minecraft-server
            upstream_ref: 2026.11.0
            # renovate: datasource=docker depName=eclipse-temurin
            base_image: eclipse-temurin:17-jre@sha256:0b6521287f850ec1c4b31c9074c5a1ae1d67c5922c3fefd21065c7c32e244d4a

    steps:
      # 上流のタグは動かせるので、ビルド時点の commit に解決してから context に渡し、
      # 何をビルドしたか label に残す (annotated tag は ^{} で peel した commit を使う)
      - name: Resolve upstream tag to a commit
        id: upstream
        run: |
          commit="$(git ls-remote "https://github.com/${{ matrix.upstream_repo }}.git" \
            "refs/tags/${{ matrix.upstream_ref }}^{}" "refs/tags/${{ matrix.upstream_ref }}" \
            | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { plain=$1 } END { print (peeled != "" ? peeled : plain) }')"
          if [ -z "$commit" ]; then
            echo "tag ${{ matrix.upstream_ref }} not found in ${{ matrix.upstream_repo }}" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "resolved ${{ matrix.upstream_repo }}@${{ matrix.upstream_ref }} -> $commit"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/giganticminecraft/${{ matrix.image }}
          # java17 は再 push される安定タグ。利用側は java17@sha256:... で参照し、
          # digest の更新は Renovate が追従する (mcserver 系イメージと同じ方式)
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=raw,value=${{ matrix.variant }}-${{ matrix.upstream_ref }}
          labels: |
            org.opencontainers.image.base.name=${{ matrix.base_image }}
            io.giganticminecraft.upstream.repo=${{ matrix.upstream_repo }}
            io.giganticminecraft.upstream.ref=${{ matrix.upstream_ref }}
            io.giganticminecraft.upstream.commit=${{ steps.upstream.outputs.commit }}

      # context に上流リポジトリの Git URL を渡すと BuildKit がその commit を取得して
      # 上流の Dockerfile と build スクリプトでビルドするので、checkout もコピーも要らない。
      # mc-image-helper 等の版は上流タグに同梱の値をそのまま使う (上流が検証した組み合わせを崩さない)
      - name: Build (and push if on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: https://github.com/${{ matrix.upstream_repo }}.git#${{ steps.upstream.outputs.commit }}
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}

      - name: Sign container image with Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          # ghcr.io は OCI 1.1 referrers API 非対応で、cosign v3 デフォルトの bundle 形式の
          # 署名は Kyverno が発見できないため、レガシー形式 (.sig タグ) で署名する
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            ghcr.io/giganticminecraft/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # Kyverno のポリシー (verify-image-signatures.yaml) と同じ条件で検証し、
      # 署名と検証側のモードがズレた瞬間に CI を fail させる。
      - name: Verify signature like Kyverno does
        if: github.ref == 'refs/heads/main'
        run: |
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/GiganticMinecraft/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ghcr.io/giganticminecraft/${{ matrix.image }}@${{ steps.build.outputs.digest }}

          # 素の cosign verify は bundle 形式も透過的に読めてしまい形式のズレを
          # 検出できないため、レガシー形式 (.sig タグ) の存在も別途確認する
          docker buildx imagetools inspect "$(cosign triangulate ghcr.io/giganticminecraft/${{ matrix.image }}@${{ steps.build.outputs.digest }})"

      - name: Run Trivy vulnerability scanner
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/giganticminecraft/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && steps.build.outputs.digest != ''
        with:
          sarif_file: 'trivy-results.sarif'
