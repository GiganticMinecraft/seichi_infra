name: CI
on:
  # ブランチへの push で起動すると、Renovate の rebase で main 側の差分が paths に
  # 引っかかり無関係なブランチでもビルドが走るため、main 以外は pull_request で拾う
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mod_downloader.yaml"
      - "docker-images/mod-downloader/**"
  pull_request:
    paths:
      - ".github/workflows/mod_downloader.yaml"
      - "docker-images/mod-downloader/**"

env:
  IMAGE: ghcr.io/giganticminecraft/mod-downloader

jobs:
  lint-and-test:
    name: Lint and test application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'docker-images/mod-downloader/go.mod'
          cache-dependency-path: 'docker-images/mod-downloader/go.sum'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          working-directory: docker-images/mod-downloader

  build-image:
    name: Build docker image (and publish on main if app changed)
    needs: [lint-and-test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    defaults:
      run:
        working-directory: docker-images/mod-downloader
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # ワークフローファイルだけの変更 (action の digest 更新など) でも push すると、
      # provenance/SBOM の差分で digest が変わり Renovate の digest 更新 PR と
      # StatefulSet の入れ替えが発生するため、アプリ側に変更があるときだけ push する
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            app:
              - docker-images/mod-downloader/**

      - id: should_push
        run: |
          echo "should_push=${{ github.ref == 'refs/heads/main' && steps.changes.outputs.app == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # 1.0.0 は再 push される安定タグ。マニフェスト側は 1.0.0@sha256:... で参照し、
          # digest の更新は Renovate が追従する (mcserver 系イメージと同じ方式)
          tags: |
            type=sha,prefix=sha-,suffix=,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=1.0.0

      - name: Build (and push if on main and app changed)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker-images/mod-downloader/
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ steps.should_push.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max

      - name: Sign container image with Cosign
        if: steps.should_push.outputs.should_push == 'true'
        run: |
          # ghcr.io は OCI 1.1 referrers API 非対応で、cosign v3 デフォルトの bundle 形式の
          # 署名は Kyverno が発見できないため、レガシー形式 (.sig タグ) で署名する
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # Kyverno のポリシー (verify-image-signatures.yaml) と同じ条件で検証し、
      # 署名と検証側のモードがズレた瞬間に CI を fail させる。
      - name: Verify signature like Kyverno does
        if: steps.should_push.outputs.should_push == 'true'
        run: |
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/GiganticMinecraft/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

          # 素の cosign verify は bundle 形式も透過的に読めてしまい形式のズレを
          # 検出できないため、レガシー形式 (.sig タグ) の存在も別途確認する
          docker buildx imagetools inspect "$(cosign triangulate ${{ env.IMAGE }}@${{ steps.build.outputs.digest }})"

      - name: Run Trivy vulnerability scanner
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always() && steps.build.outputs.digest != ''
        with:
          sarif_file: 'trivy-results.sarif'
