name: Build Minecraft Server Base Images
on: 
  push:
    paths:
      - ".github/workflows/build_mcserver_base_images.yaml"
      - "docker-images/mcservers/base-server-image/**"

env:
  DOCKER_OUTPUT_IMAGE_NAME: ghcr.io/giganticminecraft/seichi_minecraft_server_base
  DOCKER_BUILD_CONTEXT: ./docker-images/mcservers/base-server-image

jobs:
  build-image:
    name: Build docker image (and publish on main)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    strategy:
      matrix:
        include:
          # mcserver_base_image_repo / mcserver_base_image_tag / mcserver_base_image_digest:
          #   基底にする itzg/minecraft-server 系イメージの repo・タグ・digest 値。
          #   digest 値は、itzg/minecraft-server の行は linux/amd64 の Manifest Digest (Index Digest ではない)、
          #     ghcr.io/giganticminecraft/itzg-minecraft-server の行は cosign が署名した Index Digest を記載する
          #     (renovate は記載されている digest の種類に合わせて更新する)。
          #   java17 は上流の java17 タグが Ubuntu 20.04 (focal) + 古い JDK のままなので、
          #     build_itzg_images.yaml が Ubuntu 26.04 ベースで再ビルドした
          #     ghcr.io/giganticminecraft/itzg-minecraft-server を使う (上流同様 JRE ベース。
          #     java_version_component_in_tag の -jdk は従来からのタグ名で、利用側の FROM と
          #     renovate の追従を壊さないため据え置き)。
          #     この行の digest は build_itzg_images.yaml が main で publish → renovate の
          #     「itzg/minecraft-server images」PR → この workflow の再ビルド → 「seichi_minecraft_server images」PR
          #     の順でしか進まないので、上流の変更が本番に届くまで数ホップかかる。
          #   これらの値は renovate によって更新したいため、
          #     フィールドをリネームする必要があれば renovate.json5 も見直すこと。
          #   また、 renovate に認識させるため、
          #     [mcserver_base_image_repo, mcserver_base_image_tag, mcserver_base_image_digest] の順で
          #     フィールドを記述すること。
          #   itzg/minecraft-server には 2025.3.0-java21 のように日付を含むタグを持つイメージがあるが、
          #     これらのイメージを使用すると、renovate が更新を検知できないため使用しないこと。
          #     itzg-minecraft-server も同様に java17-2026.10.0 ではなく java17 の方を使うこと。
          # java_version_component_in_tag:
          #   mcserver_base_image_tag に含まれる Java バージョンを含む文字列。
          #   当ワークフローが生成する整地鯖の基底イメージは、タグとして
          #     java_version_component_in_tag を含むように設定されている。
          #   renovate に各サーバーのイメージ更新 PR を出してもらえるように、
          #     各サーバーの基底イメージ指定は
          #     java_version_component_in_tag + digest pinning で行うこととしている。
          - mcserver_base_image_repo: itzg/minecraft-server
            mcserver_base_image_tag: java8-jdk
            mcserver_base_image_digest: "sha256:6429fba1e78941cde63faa1285cce7e69de2fc16524cbf2502c0d0429a7e3de9"
            java_version_component_in_tag: java8-jdk
          - mcserver_base_image_repo: ghcr.io/giganticminecraft/itzg-minecraft-server
            mcserver_base_image_tag: java17
            mcserver_base_image_digest: "sha256:737db73bbe5e270bc8f888c239294d477fd5e2e53d5a5b5c75e3bfc0d3485b89"
            java_version_component_in_tag: java17-jdk
          - mcserver_base_image_repo: itzg/minecraft-server
            mcserver_base_image_tag: java21-jdk
            mcserver_base_image_digest: "sha256:886e0549bd173844468d34f53e2e78feb991dad4d3d37c8b7ce0d99afa926bae"
            java_version_component_in_tag: java21-jdk

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_OUTPUT_IMAGE_NAME }}
          tags: |
            type=sha,prefix=upstreamVersion-${{ matrix.mcserver_base_image_tag }}-,suffix=,format=short
            type=raw,value=upstreamVersion-${{ matrix.mcserver_base_image_tag }}
            type=raw,value=1.0.0-${{ matrix.java_version_component_in_tag }}

      - name: Build (and push if on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          # すべてのビルドステージのすべてのレイヤーをキャッシュして欲しいのでmode=max
          cache-to: type=gha,mode=max
          build-args: |
            MCSERVER_BASE_IMAGE=${{ matrix.mcserver_base_image_repo }}:${{ matrix.mcserver_base_image_tag }}@${{ matrix.mcserver_base_image_digest }}

      - name: Sign container image with Cosign
        if: github.ref == 'refs/heads/main'
        run: |
          # ghcr.io は OCI 1.1 referrers API 非対応で、cosign v3 デフォルトの bundle 形式の
          # 署名は Kyverno が発見できないため、レガシー形式 (.sig タグ) で署名する
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            ${{ env.DOCKER_OUTPUT_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

      # Kyverno のポリシー (verify-image-signatures.yaml) と同じ条件で検証し、
      # 署名と検証側のモードがズレた瞬間に CI を fail させる。
      - name: Verify signature like Kyverno does
        if: github.ref == 'refs/heads/main'
        run: |
          cosign verify \
            --certificate-identity-regexp 'https://github\.com/GiganticMinecraft/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            ${{ env.DOCKER_OUTPUT_IMAGE_NAME }}@${{ steps.build.outputs.digest }}

          # 素の cosign verify は bundle 形式も透過的に読めてしまい形式のズレを
          # 検出できないため、レガシー形式 (.sig タグ) の存在も別途確認する
          docker buildx imagetools inspect "$(cosign triangulate ${{ env.DOCKER_OUTPUT_IMAGE_NAME }}@${{ steps.build.outputs.digest }})"

      - name: Run Trivy vulnerability scanner
        if: steps.build.outputs.digest != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DOCKER_OUTPUT_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && steps.build.outputs.digest != ''
        with:
          sarif_file: 'trivy-results.sarif'
